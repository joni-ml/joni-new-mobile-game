# Publishes the game to GitHub Pages on every push.
#
# One-time setup, in the repository settings under Pages:
#   Source -> GitHub Actions
# The workflow token is not allowed to create the Pages site itself
# ("Resource not accessible by integration"), so that switch has to be
# flipped by hand once. Everything after it is automatic.
name: Deploy game to Pages

on:
  push:
    branches:
      - claude/survival-monster-game-t1m97b
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
