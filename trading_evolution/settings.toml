# ההגדרות של הבוטים.
# אפשר לשנות אותן גם בזמן ש-live.py רץ: שומרים את הקובץ, והשינוי נכנס לתוקף בבדיקה הבאה.
# זמנים כותבים ככה: 30m = חצי שעה, 6h = שש שעות, 1d = יום, 1w = שבוע.

# באילו מטבעות הבוטים יכולים לסחור.
# כל בוט מתמחה במטבע אחד, והשכפולים שלו לפעמים עוברים למטבע אחר.
# ככה האבולוציה מגלה בעצמה באיזה מטבע הכי קל להרוויח.
assets = ["BTC", "ETH", "XRP", "DOGE", "LTC", "ADA", "LINK"]

# סלים: true = חלק מהבוטים סוחרים בסל של כמה מטבעות (עד כולם) במקום במטבע אחד.
# בבדיקה על 2020-2025 הסלים לא עזרו (גם כשהבוטים נשפטים מול כל המטבעות), אז זה כבוי.
baskets = false

# כמה בוטים יש בהתחלה, וכמה יכולים להיות לכל היותר באותו זמן
start_bots = 10
max_bots = 20

# כמה כסף (מזויף) מקבל כל בוט חדש, בשקלים
start_money = 5.0

# התשלום אליך: כל כמה זמן, וכמה אחוזים מהכסף של כל בוט
pay_every = "1d"
pay_percent = 0

# המבחן: כל כמה זמן, וכמה אחוזים מהבוטים מתים בו.
# מבחן נדיר ורך (30 יום, 25%) נותן לבוטים טובים זמן להוכיח את עצמם, ולא מעניש על שבוע אחד של מזל רע.
# הבוטים הכי פחות טובים מתים (לאן הולך הכסף שלהם - ראה losers_money למטה).
# כל אחד מהטובים מחליט בעצמו אם להשתכפל (לכל בוט יש כלל משלו, שעובר בתורשה ומשתנה).
# מי שמשתכפל מתחלק בכסף שלו עם השכפול (חצי-חצי).
select_every = "30d"
kill_percent = 25

# המטרה של הבוטים:
#   "hold"  - להחזיק כמה שיותר זמן. קונים כשאין סימני סכנה, ומוכרים רק כשרואים סכנה
#             (הציון יורד מתחת ל"קו הסכנה" של הבוט, או שהמחיר נופל הרבה מהשיא). כשהסכנה עוברת - קונים שוב.
#   "trade" - לקנות ולמכור לפי הציון, כולל מכירה ברווח (כמו קודם).
goal = "hold"

# איך שופטים את הבוטים במבחן:
#   "beat_hold" - כמה הבוט ניצח את "לקנות ולחכות" בכל המטבעות (שווה בשווה) מאז המבחן הקודם.
#                 ככה שורד מי שבאמת קנה ומכר חכם, ולא מי שהיה לו מזל או ישב במזומן. (הכי טוב בבדיקה: 16 מתוך 24)
#   "steady"    - אותו דבר, פחות עונש על נפילות בדרך (באימון ארוך זה מלמד אותם כמעט לא להשקיע).
#   "money"     - כמה כסף הבוט הרוויח מאז המבחן הקודם.
judge = "beat_hold"

# סבלנות (במצב "hold"): כמה זמן ברצף הציון צריך להישאר מתחת לקו הסכנה לפני שהבוט בורח.
# ככה הוא לא בורח מכל ירידה קטנה של יום אחד. נפילה גדולה מהשיא (stop-loss) עדיין גורמת לבריחה מיד.
patience = "3d"

# המוח של הבוטים:
#   "learning" - מוח לומד: רשת עצבית קטנה שלומדת מכל טעות לאורך כל החיים של הבוט.
#                במטרה "hold" הוא מנחש אם תהיה נפילה גדולה בקרוב (גלאי סכנה), ב-"trade" לאן המחיר ילך.
#                בוט חדש לומד קודם על 365 הנרות האחרונים ("בית ספר"), וילד מקבל את המוח של ההורה ומשפר אותו.
#                כל בוט גם מחליט (בגן שעובר בירושה) כמה להקשיב למוח וכמה לנוסחה הקבועה.
#   "simple"   - נוסחה קבועה: כל סימן כפול משקל שנקבע בלידה (הבוט לא לומד, רק האבולוציה משנה את הילדים).
brain = "learning"

# מילוי מקומות ריקים: אם אחרי מבחן נשארו פחות מ-start_bots בוטים, נולדים בוטים חדשים
# מהאסטרטגיות של הבוטים הכי טובים (עם שינוי קטן). על כל בוט חדש אתה שם start_money, כמו בהתחלה.
# ככה תמיד יש מספיק בוטים כדי שהאבולוציה תמשיך. false = לא למלא.
refill = true

# לאן הולך הכסף של הבוטים שמתו במבחן:
#   "me"      - אליך. שים לב: ככה בכל מבחן יוצא מהבוטים בערך חצי מהכסף,
#               אז אחרי כמה מבחנים כולם מרוששים, ונוצרים בוטים חדשים בכסף חדש שלך.
#   "winners" - מתחלק בין הבוטים ששרדו. ככה הכסף נשאר בתוך המשחק ורק התשלום הקבוע מגיע אליך.
losers_money = "winners"

# באילו שיטות הבוטים יכולים להשתמש כדי להחליט מתי לקנות ומתי למכור.
# כל בוט נותן לכל שיטה משקל משלו, והאבולוציה מגלה אילו שיטות עוזרות. מוחקים שיטה מהרשימה כדי לאסור אותה.
#   trend     - מגמה: הממוצע הקצר מול הממוצע הארוך
#   dip       - RSI: האם המחיר ירד הרבה לאחרונה (או עלה הרבה)
#   momentum  - תנופה: כמה המחיר השתנה בזמן האחרון
#   stretch   - מרחק המחיר מהממוצע
#   macd      - MACD (12/26/9): האם התנופה מתחזקת או נחלשת
#   bollinger - רצועות בולינגר: כמה המחיר רחוק מהממוצע ביחס לכמה שהוא קופץ בדרך כלל
#   channel   - ערוץ 20 נרות: האם המחיר קרוב לשיא או לשפל של התקופה האחרונה
#   breakout  - פריצה של 55 נרות (שיטת הצבים המפורסמת)
#   calm      - האם השוק רגוע או סוער עכשיו
#   pattern   - זיכרון דפוסים: מה קרה בעבר אחרי ש-5 הנרות האחרונים נראו ככה
# חושים מהאינטרנט (גלאי סכנה). מתעדכנים לבד פעם ב-6 שעות במסחר החי:
#   fear_greed - מדד הפחד והחמדנות של הקריפטו (alternative.me)
#   stocks     - האם הבורסה האמריקאית (S&P 500) עלתה או נפלה בחודש האחרון יותר מהרגיל
#   vix        - מדד הפחד של וול סטריט (VIX): קופץ כשיש בעיות בכלכלה
#   attention  - כמה אנשים קוראים על ביטקוין בוויקיפדיה
#   activity   - כמה כתובות פעילות יש ברשת של המטבע (Coin Metrics)
#   valuation  - כמה המטבע יקר לעומת מה שאנשים שילמו עליו (MVRV, Coin Metrics)
#   stablecoins - כמה דולרים דיגיטליים (USDT, USDC ועוד) יש בקריפטו: האם נכנס כסף חדש יותר או פחות מהרגיל
signals = ["trend", "dip", "momentum", "stretch", "macd", "bollinger", "channel", "breakout", "calm", "pattern",
           "fear_greed", "stocks", "vix", "attention", "activity", "valuation", "stablecoins"]

# כל כמה זמן הבוטים מקבלים מחיר חדש במסחר החי: 1m / 5m / 15m / 1h
# נר קצר = הרבה יותר אקשן (טוב כדי לראות מה קורה), נר ארוך = פחות רעש.
candle = "1h"
