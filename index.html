<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>ארגז חול</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:#0d0f14; font-family:-apple-system, 'Heebo', 'Segoe UI', sans-serif;
    color:#e8e0c8; touch-action:none; display:flex; flex-direction:column;
    height:100vh; height:100dvh;
  }

  #stage { position:relative; flex:1; min-height:0; overflow:hidden; }
  #game  { display:block; width:100%; height:100%; image-rendering:pixelated;
           background:#05070c; touch-action:none; }

  #topbar {
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));
    background:linear-gradient(#0d0f14ee, #0d0f1400); pointer-events:none;
  }
  #topbar .title { font-weight:700; font-size:15px; letter-spacing:.3px; }
  #topbar .score { font-size:12px; opacity:.85; }
  #topbar .fps   { font-size:11px; opacity:.5; margin-inline-start:auto; direction:ltr; }

  #mission {
    position:absolute; top:calc(42px + env(safe-area-inset-top)); left:10px; right:10px;
    z-index:10; background:rgba(20,26,38,0.92); border:1px solid #33608a;
    border-radius:12px; padding:8px 12px; font-size:13px; line-height:1.4;
    box-shadow:0 6px 14px rgba(0,0,0,.4); transition:.25s;
  }
  #mission b { color:#6cc0ff; }
  #mission.done { border-color:#5ec27a; background:rgba(22,40,28,.94); }

  #toolbar {
    background:#14171f; border-top:1px solid #2a2f3a;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:6px;
  }
  #materials { display:flex; gap:6px; overflow-x:auto; padding:2px; scrollbar-width:none; }
  #materials::-webkit-scrollbar { display:none; }
  .mat {
    flex:0 0 auto; width:58px; height:56px; border-radius:12px;
    border:2px solid #2a2f3a; background:#1b1f28; color:#e8e0c8;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; font-size:11px; font-weight:600; cursor:pointer; transition:.12s;
  }
  .mat .dot { width:20px; height:20px; border-radius:6px; border:1px solid #0006; }
  .mat.active { border-color:#e8e0c8; background:#262b36; transform:translateY(-2px); }
  .mat.pop { animation:pop .4s; }
  @keyframes pop { 0%{transform:scale(.5)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }

  #controls { display:flex; align-items:center; gap:8px; overflow-x:auto; scrollbar-width:none; padding:0 2px; }
  #controls::-webkit-scrollbar { display:none; }
  #controls button {
    flex:0 0 auto; height:38px; padding:0 12px; border-radius:10px;
    border:1px solid #2a2f3a; background:#1b1f28; color:#e8e0c8;
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  #controls button:active { background:#2a2f3a; }
  #controls button.selbtn { border-color:#e8e0c8; background:#2f2620; }
  #controls #btnCool.selbtn { background:#1c2a34; }

  #sliders { display:flex; gap:16px; align-items:center; padding:0 4px; font-size:12px; opacity:.9; }
  #sliders label { display:flex; align-items:center; gap:6px; }
  #sliders input[type=range] { width:100px; accent-color:#d69a3e; }

  #pedia {
    position:absolute; inset:0; z-index:40; background:rgba(8,10,16,.96);
    display:none; flex-direction:column; padding:16px;
    padding-top:calc(16px + env(safe-area-inset-top));
  }
  #pedia.open { display:flex; }
  #pedia h2 { font-size:18px; margin-bottom:4px; }
  #pedia .sub { font-size:12px; opacity:.6; margin-bottom:12px; }
  #pediaGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
               gap:8px; overflow-y:auto; }
  .pcard { display:flex; gap:8px; align-items:center; background:#161b25;
           border:1px solid #2a2f3a; border-radius:10px; padding:8px 10px; }
  .pcard .dot { width:26px; height:26px; border-radius:7px; flex:0 0 auto; border:1px solid #0006; }
  .pcard .nm { font-size:13px; font-weight:700; }
  .pcard .rc { font-size:11px; opacity:.7; }
  .pcard.locked { opacity:.5; }
  .pcard.locked .dot { background:#222!important; display:flex; align-items:center; justify-content:center; font-size:15px; }
  #pediaClose { margin-top:12px; align-self:center; height:42px; padding:0 24px;
     border-radius:12px; border:1px solid #33608a; background:#1b2634; color:#e8e0c8;
     font-size:15px; font-weight:700; cursor:pointer; }

  /* חנות היסודות */
  #shop { position:absolute; inset:0; z-index:41; background:rgba(8,10,16,.97);
    display:none; flex-direction:column; padding:14px; padding-top:calc(14px + env(safe-area-inset-top)); overflow-y:auto; }
  #shop.open { display:flex; }
  #shop h2 { font-size:18px; margin-bottom:2px; }
  #shop .sub { font-size:12px; opacity:.8; margin-bottom:10px; }
  #shop .sub b { color:#ffd479; }
  #ptable { display:grid; grid-template-columns:repeat(18,1fr); gap:2px; direction:ltr; }
  .ele { position:relative; aspect-ratio:1; border-radius:3px; border:1px solid #0005;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#0d0f14; }
  .ele .z  { position:absolute; top:0; left:2px; font-size:5px; opacity:.65; }
  .ele .sy { font-size:8.5px; font-weight:800; }
  .ele.owned { outline:2px solid #fff; outline-offset:-1px; }
  .ele.blank { background:none!important; border:none; cursor:default; }
  #ptlegend { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0 4px; }
  #ptlegend span { font-size:9.5px; padding:2px 6px; border-radius:6px; color:#0d0f14; font-weight:600; }
  #eleDetail { display:none; background:#131a26; border:1px solid #33608a; border-radius:12px; padding:12px; margin-top:8px; }
  #eleDetail.show { display:block; }
  #eleDetail .eh { display:flex; align-items:center; gap:10px; }
  #eleDetail .esym { width:54px; height:54px; border-radius:8px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#0d0f14; flex:0 0 auto; }
  #eleDetail .esym .s { font-size:20px; font-weight:800; line-height:1; }
  #eleDetail .esym .zz { font-size:9px; }
  #eleDetail .en { font-size:17px; font-weight:800; }
  #eleDetail .ec { font-size:12px; opacity:.75; }
  #eleDetail .props { font-size:12.5px; line-height:1.65; margin-top:8px; }
  #eleDetail .buy { margin-top:10px; height:42px; width:100%; border-radius:10px; border:none;
    font-size:15px; font-weight:800; cursor:pointer; background:#3ba55d; color:#08120a; }
  #eleDetail .buy.soon { background:#333a46; color:#8892a0; }
  #shopClose { margin-top:14px; align-self:center; height:44px; padding:0 26px; border-radius:12px;
    border:1px solid #33608a; background:#1b2634; color:#e8e0c8; font-size:15px; font-weight:700; cursor:pointer; }

  /* הגדרות + אטום */
  #settings, #atomView { position:absolute; inset:0; z-index:42; background:rgba(8,10,16,.97);
    display:none; flex-direction:column; padding:18px; padding-top:calc(18px + env(safe-area-inset-top));
    align-items:center; }
  #settings.open, #atomView.open { display:flex; }
  #settings h2, #atomView h2 { font-size:19px; margin-bottom:14px; align-self:flex-start; }
  .stog { display:flex; align-items:center; gap:10px; font-size:14.5px; background:#161b25;
    border:1px solid #2a2f3a; border-radius:12px; padding:12px 14px; width:100%; max-width:420px;
    margin-bottom:10px; cursor:pointer; }
  .stog input { width:22px; height:22px; accent-color:#5ec27a; flex:0 0 auto; }
  #setClose, #atomClose { margin-top:14px; height:44px; padding:0 26px; border-radius:12px;
    border:1px solid #33608a; background:#1b2634; color:#e8e0c8; font-size:15px; font-weight:700; cursor:pointer; }
  #atomCv { background:radial-gradient(circle at 50% 50%, #0d1520, #05070c); border-radius:14px;
    border:1px solid #2a3444; max-width:92vw; }
  #atomInfo { font-size:13.5px; line-height:1.7; margin-top:12px; text-align:center; max-width:420px; }
  #atomInfo b { color:#6cc0ff; }
  #atomTabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
  #atomTabs .atab { padding:7px 15px; border-radius:20px; border:1px solid #2a3444; background:#141a24;
    color:#cfe0f5; font-size:15px; font-weight:700; cursor:pointer; }
  #atomTabs .atab.on { background:#2b6cff; border-color:#2b6cff; color:#fff; }
  #molcv { cursor:pointer; }

  #toast {
    position:absolute; top:52%; left:50%; transform:translate(-50%,-50%);
    background:#000d; padding:10px 18px; border-radius:12px; font-size:15px; font-weight:700;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:30; text-align:center;
  }
  #toast.show { opacity:1; }

  /* זכוכית מגדלת */
  #mag { position:absolute; width:132px; height:132px; border-radius:50%;
    border:3px solid #e8e0c8; box-shadow:0 6px 18px #000b, inset 0 0 0 2px #0007;
    image-rendering:pixelated; pointer-events:none; z-index:50; display:none; }
  /* חלון מידע של פיקסל */
  #inspect { position:absolute; left:8px; right:8px; bottom:8px; z-index:46; display:none;
    background:rgba(12,16,24,.96); border:1px solid #3a4556; border-radius:12px;
    padding:10px 12px; font-size:12.5px; line-height:1.5; box-shadow:0 8px 20px #000a; }
  #inspect .ihead { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #inspect .idot { width:22px; height:22px; border-radius:6px; border:1px solid #0006; flex:0 0 auto; }
  #inspect .iname { font-weight:800; font-size:15px; }
  #inspect .iform { font-family:ui-monospace,monospace; opacity:.8; direction:ltr; }
  #inspect .igrid { display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; }
  #inspect .igrid span { opacity:.65; }
  #inspect .igrid b { font-weight:700; }
  #inspect .ix { position:absolute; top:4px; left:6px; opacity:.85; font-size:26px; line-height:1;
    cursor:pointer; padding:8px 14px; border-radius:10px; background:rgba(255,255,255,.08); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="topbar">
      <span class="title">🏖️ ארגז חול</span>
      <span class="score" id="score"></span>
      <span class="fps" id="fps"></span>
    </div>
    <div id="mission">🧑‍🔬 <b>המדריך:</b> <span id="missionText">…</span></div>
    <div id="toast"></div>
    <canvas id="mag" width="132" height="132"></canvas>
    <div id="inspect"></div>

    <!-- הגדרות -->
    <div id="settings">
      <h2>⚙️ הגדרות</h2>
      <label class="stog"><input type="checkbox" id="setBuild" checked> 🧱 בנייה רק על אוויר (לא מוחק חומרים)</label>
      <label class="stog"><input type="checkbox" id="setBorder"> 🔲 קירות מסביב למסך (חומרים וחום לא בורחים)</label>
      <label class="stog"><input type="checkbox" id="setGrav" checked> 🍃 צמחים נופלים כשאין תמיכה</label>
      <label class="stog">🌡️ מקסימום חום למברשת: <input type="number" id="setMaxT" min="200" max="6000" step="100" value="4000" style="width:88px;background:#141a24;color:#e8e0c8;border:1px solid #33608a;border-radius:8px;padding:4px 6px;font-size:15px"></label>
      <label class="stog">🔥 מוליכות חום כללית <input type="range" id="setCond" min="1" max="30" value="10" style="flex:1;min-width:120px"></label>
      <button id="setClose">סגור</button>
    </div>

    <!-- אטום (מודל בוהר) -->
    <div id="atomView">
      <h2>⚛️ מבנה האטום</h2>
      <div id="atomTabs"></div>
      <canvas id="atomCv" width="300" height="300"></canvas>
      <div id="atomInfo"></div>
      <button id="atomClose">סגור</button>
    </div>

    <!-- חנות היסודות (הטבלה המחזורית) -->
    <div id="shop">
      <h2>🛒 חנות היסודות</h2>
      <div class="sub">הטבלה המחזורית — כל היסודות ביקום. לחץ על יסוד לפרטים ולקנייה. <b id="kp">🧠 0</b></div>
      <div id="ptable"></div>
      <div id="ptlegend"></div>
      <div id="eleDetail"></div>
      <button id="shopClose">סגור</button>
    </div>

    <div id="pedia">
      <h2>📖 פדיית החומרים</h2>
      <div class="sub">מה שגילית — ואיך מכינים את מה שעוד לא. הכל דרך ניסוי, בלי כסף.</div>
      <div id="pediaGrid"></div>
      <button id="pediaClose">סגור</button>
    </div>
  </div>

  <div id="toolbar">
    <div id="materials"></div>
    <div id="controls">
      <button id="btnHeat">🔥 חום</button>
      <button id="btnCool">❄️ קור</button>
      <button id="btnHand">✋ יד</button>
      <button id="btnInspect">🔍 בדיקה</button>
      <button id="btnShop">🛒 חנות</button>
      <button id="btnSettings">⚙️</button>
      <button id="btnPedia">📖</button>
      <button id="btnPause">⏸️</button>
      <button id="btnSave">💾</button>
      <button id="btnClear">🗑️</button>
    </div>
    <div id="sliders">
      <label>גודל <input id="brush" type="range" min="1" max="12" value="3"></label>
      <label id="spdWrap">מהירות <input id="speed" type="range" min="1" max="15" value="10"></label>
      <label id="degWrap" style="display:none">מעלות <input id="deg" type="range" min="5" max="300" step="5" value="30"><b id="degVal">30°</b></label>
    </div>
  </div>

<script>
/* =========================================================================
   ארגז חול — סימולציית פיזיקה תרמית + גילויים
   לכל תא: חומר + טמפרטורה. חום עובר בין תאים (הולכה), והחומרים משתנים
   לפי טמפרטורה: מים רותחים לאדים / קופאים לקרח, אבן נמסה ללבה, לבה
   מתקררת לבזלת, עץ נדלק. הכל מתחיל מ-3 חומרי יסוד ומתגלה תוך כדי משחק.
   ========================================================================= */

/* ---------- טבלת החומרים ----------
   type: empty|static|solid|powder|liquid|gas
   solid = נופל ישר (כובד) אבל לא מתפזר — אבן/קרח.  density: כבד יותר שוקע.
   flam: דליק   base: זמין מההתחלה   pedia: תיאור/מתכון */
const MAT = [
  { key:'air',    name:'אוויר',  color:[6,8,14],      type:'empty'  },
  { key:'stone',  name:'אבן',    color:[120,120,128], type:'solid',  density:8, base:true, pedia:'חומר יסוד — נופלת ושוקעת במים' },
  { key:'water',  name:'מים',    color:[64,132,214],  type:'liquid', density:2, base:true, pedia:'חומר יסוד' },
  { key:'earth',  name:'אדמה',   color:[112,78,46],   type:'powder', density:5, base:true, pedia:'חומר יסוד' },
  { key:'mud',    name:'בוץ',    color:[80,56,36],    type:'powder', density:4, pedia:'💧 מים + 🟫 אדמה' },
  { key:'sand',   name:'חול',    color:[224,196,120], type:'powder', density:5, pedia:'מים שוחקים 🪨 אבן' },
  { key:'wood',   name:'עץ',     color:[120,78,44],   type:'static', flam:true, pedia:'צומח מ🟤 בוץ' },
  { key:'sprout', name:'נבט',    color:[95,185,75],   type:'static', flam:true, pedia:'מופיע על בוץ לח' },
  { key:'leaf',   name:'עלה',    color:[74,158,58],   type:'static', flam:true, pedia:'גדל על העץ' },
  { key:'flower', name:'פרח',    color:[232,92,140],  type:'static', flam:true, pedia:'עץ בוגר מוציא פרח' },
  { key:'seedT',  name:'זרע-עץ', color:[150,108,58],  type:'powder', density:3, flam:true, pedia:'נופל מפרח 🌸' },
  { key:'seedF',  name:'זרע-פרח',color:[205,150,70],  type:'powder', density:3, flam:true, pedia:'נופל מפרח 🌸' },
  { key:'fire',   name:'אש',     color:[240,120,30],  type:'gas',    life:55, pedia:'חממו עץ 🌳 מעל 300°' },
  { key:'steam',  name:'אדים',   color:[190,200,210], type:'gas',    life:320, pedia:'מים רותחים 💧 (100°+)' },
  { key:'ice',    name:'קרח',    color:[176,216,240], type:'solid',  density:1, pedia:'❄️ מים קפואים (0°-)' },
  { key:'ash',    name:'אפר',    color:[92,90,96],    type:'powder', density:3, pedia:'נשאר אחרי שריפה' },
  { key:'glass',  name:'זכוכית', color:[172,212,226], type:'static', pedia:'🏖️ חול חם מאוד (1400°+)' },
  { key:'lava',   name:'לבה',    color:[236,96,28],   type:'liquid', density:8, pedia:'🪨 אבן חמה (1100°+) נמסה' },
  { key:'basalt', name:'בזלת',   color:[34,32,42],    type:'solid',  density:8, pedia:'🌋 לבה טהורה שהתקררה (שחורה)' },
  { key:'hydrogen',name:'מימן',  color:[200,225,255], type:'gas', life:600, flam:true, shop:true, pedia:'H · יסוד 1 — גז נפיץ, נשרף למים' },
  { key:'helium',  name:'הליום', color:[255,238,190], type:'gas', life:600,            shop:true, pedia:'He · יסוד 2 — גז אצילי, קל מהאוויר' },
  { key:'lithium', name:'ליתיום',color:[205,180,195], type:'solid', density:1, flam:true, shop:true, pedia:'Li · יסוד 3 — מתפוצץ במים! חמם >180° → נמס' },
  { key:'beryllium',name:'בריליום',color:[150,195,165],type:'solid', density:3,          shop:true, pedia:'Be · יסוד 4 — מתכת קשה. חמם >1287° → נמס' },
  { key:'wall',    name:'קיר',   color:[68,72,82],    type:'static', base:true, sys:true, pedia:'קיר בנייה — לא נמס, מבודד חום' },
  // --- יסודות נוספים לחנות (מתווספים בסוף כדי לא לשבור עולמות שמורים) ---
  { key:'carbon',   name:'פחמן',    color:[44,44,50],    type:'powder', density:2, flam:true, shop:true, pedia:'C · יסוד 6 — בסיס החיים. נשרף ל-CO₂' },
  { key:'nitrogen', name:'חנקן',    color:[120,150,225], type:'gas', life:600,     shop:true, pedia:'N · יסוד 7 — 78% מהאוויר, רגוע' },
  { key:'oxygen',   name:'חמצן',    color:[120,200,255], type:'gas', life:600,     shop:true, pedia:'O · יסוד 8 — מזין אש, עם מימן→מים' },
  { key:'sodium',   name:'נתרן',    color:[192,192,205], type:'solid', density:1, flam:true, shop:true, pedia:'Na · יסוד 11 — מתפוצץ במים! עם כלור→מלח' },
  { key:'magnesium',name:'מגנזיום', color:[205,208,214], type:'solid', density:2, flam:true, shop:true, pedia:'Mg · יסוד 12 — נשרף באור לבן מסנוור' },
  { key:'aluminum', name:'אלומיניום',color:[200,205,215],type:'solid', density:3, shop:true, pedia:'Al · יסוד 13 — מתכת קלה, נמסה ב-660°' },

function drawMol(mc,id){
  const S=mc.width, g=molGeom[id], x=mc.getContext('2d');

  x.strokeStyle='#8a94a6'; x.lineWidth=2;
  for(const [a,b] of g.bonds){ const A=g.atoms[a],B=g.atoms[b];
    x.beginPath(); x.moveTo(A[1]*S,A[2]*S); x.lineTo(B[1]*S,B[2]*S); x.stroke(); }
  const R=Math.max(8,S*0.13);
  for(const [el,ax,ay] of g.atoms){
    x.fillStyle=ATOMCOL[el]||'#888'; x.beginPath(); x.arc(ax*S,ay*S,R,0,7); x.fill();
    x.fillStyle=(el==='H'||el==='O'||el==='Cl')?'#111':'#fff';
    x.font='bold '+Math.round(R)+'px sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText(el,ax*S,ay*S);
  }
}

let W, H, grid, life, aux, temp, temp2, velX, velY, moved, pha, img;

function setup() {
  const stage = document.getElementById('stage');
  const cssW = stage.clientWidth, cssH = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(40, Math.floor(cssW / SCALE));
  H = Math.max(40, Math.floor(cssH / SCALE));
  buf.width = W; buf.height = H;
  img = bctx.createImageData(W, H);
  canvas.width  = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.imageSmoothingEnabled = false;
  grid = new Uint8Array(W*H);
  life = new Uint8Array(W*H);
  aux  = new Uint8Array(W*H);
  temp = new Float32Array(W*H).fill(AMB);
  temp2= new Float32Array(W*H);
  velX = new Float32Array(W*H);   // מהירות אופקית (תנע/פגיעות)
  velY = new Float32Array(W*H);   // מהירות אנכית (כובד)
  moved= new Uint8Array(W*H);     // סימון "כבר זז השנה" (למניעת עיבוד כפול של גז)
  pha  = new Uint8Array(W*H);     // מצב צבירה: 0=טבעי, 1=נמס (נוזל), 2=רתח (גז) — זוכר את החומר
}
const idx = (x,y) => y*W + x;
const inB = (x,y) => x>=0 && x<W && y>=0 && y<H;

/* ---------- מצב משחק ---------- */
let current = WATER, brush = 3, paused = false, speed = 1;
let buildOnAir = true, borderWalls = false;   // הגדרות
let heatStep = 30, maxTemp = 4000, minTemp = -90, condMul = 1;   // מברשת חום/קור + מוליכות
let held = null, holdX = 0, holdY = 0;         // כלי היד — גוש חומר שמורם
let painting = false, ptx=0, pty=0;
let score = 0;
const found = new Uint8Array(MAT.length);
MAT.forEach(m => { if (m.base) found[m.id] = 1; });
let foundCount = 3;

/* ---------- ציור (כולל זוהר לפי טמפרטורה) ---------- */
function render() {
  const d = img.data;
  for (let i=0; i<grid.length; i++) {
    const id = grid[i]; const c = MAT[id].color;
    let r,g,b;
    if (id===FIRE || id===LAVA) {
      const f = 0.65 + Math.random()*0.35;
      r=Math.min(255,c[0]*f+30); g=c[1]*f; b=c[2]*f*0.6;
    } else {
      r=c[0]; g=c[1]; b=c[2];
      if (id!==AIR) {
        const t = temp[i];
        if (t>120){ const h=Math.min(150,(t-120)*0.12); r=Math.min(255,r+h); g=Math.max(0,g-h*0.25); b=Math.max(0,b-h*0.35); }
        else if (t<6){ const k=Math.min(70,(6-t)*3); b=Math.min(255,b+k); r=Math.max(0,r-k*0.3); g=Math.min(255,g+k*0.25); }
        if (pha[i]===1){ const f=0.55+Math.random()*0.3; r=Math.min(255,r*f+130); g=Math.min(255,g*f+45); b=b*f*0.5; }   // מותך זוהר
        else if (pha[i]===2){ r=(r+150)/2; g=(g+156)/2; b=(b+162)/2; }                                                  // גז דליל
      }
    }
    d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255;
  }
  if (held){                              // תצוגת הגוש שמורם ביד — עוקב אחרי האצבע
    for (const c of held.cells){
      const x=holdX+c.dx, y=holdY+c.dy; if (x<0||x>=W||y<0||y>=H) continue;
      const j=(y*W+x)*4, col=MAT[c.id].color;
      d[j]=Math.min(255,col[0]+45); d[j+1]=Math.min(255,col[1]+45); d[j+2]=Math.min(255,col[2]+45); d[j+3]=255;
    }
  }
  bctx.putImageData(img,0,0);
  ctx.drawImage(buf,0,0,canvas.width,canvas.height);
}

/* ---------- עזרים ---------- */
function swap(a,b){ const t=grid[a];grid[a]=grid[b];grid[b]=t;
                    const l=life[a];life[a]=life[b];life[b]=l;
                    const x=aux[a];aux[a]=aux[b];aux[b]=x;
                    const p=temp[a];temp[a]=temp[b];temp[b]=p;      // החום נוסע עם החומר
                    const vx=velX[a];velX[a]=velX[b];velX[b]=vx;    // גם התנע נוסע
                    const vy=velY[a];velY[a]=velY[b];velY[b]=vy;
                    const ph=pha[a];pha[a]=pha[b];pha[b]=ph; }      // גם מצב הצבירה נוסע עם החומר
function density(id){ return MAT[id].density||0; }
function setCell(i,id){ grid[i]=id; life[i]=0; aux[i]=0; pha[i]=0; discover(id); }

/* ---------- לב המנוע ---------- */
let flip=false;
function step(){
  flip=!flip;
  moved.fill(0);
  for (let y=H-1; y>=0; y--){
    for (let k=0; k<W; k++){
      const x = flip ? k : (W-1-k);
      const i = idx(x,y);
      let id = grid[i];
      if (id===AIR) continue;
      if ((MAT[id].type==='gas' || pha[i]===2) && moved[i]) continue;   // גז שכבר עובד השנה — דלג
      if (react(x,y,i,id)) continue;
      id = grid[i];
      let et = MAT[id].type;                 // סוג אפקטיבי לפי מצב צבירה (נמס=נוזל, רתח=גז)
      if (pha[i]===1) et='liquid'; else if (pha[i]===2) et='gas';
      switch (et){
        case 'powder': movePowder(x,y,i,id); break;
        case 'liquid': moveLiquid(x,y,i,id); break;
        case 'solid':  moveSolid(x,y,i,id);  break;
        case 'gas':    moveGas(x,y,i,id);    break;
      }
    }
  }
  thermal();   // הולכת חום + מעברי פאזה
}

/* ===== חום: הולכה, איבוד לסביבה, ומעברי פאזה ===== */
function thermal(){
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=idx(x,y), id=grid[i], ci=cond[id], t=temp[i];
    if (id===WALL){ temp2[i]=0; continue; }   // קיר: תמיד 0°, חום לא נכנס/עובר
    let acc=0;
    if (x>0)   { const j=i-1; acc += Math.min(ci,cond[grid[j]])*(temp[j]-t); }
    if (x<W-1) { const j=i+1; acc += Math.min(ci,cond[grid[j]])*(temp[j]-t); }
    if (y>0)   { const j=i-W; acc += Math.min(ci,cond[grid[j]])*(temp[j]-t); }
    if (y<H-1) { const j=i+W; acc += Math.min(ci,cond[grid[j]])*(temp[j]-t); }
    let nt = t + 0.5*acc*condMul;
    nt += (AMB - nt) * radi[id];
    temp2[i]=nt;
  }
  const s=temp; temp=temp2; temp2=s;
  for (let i=0;i<grid.length;i++) checkPhase(i);
}
function checkPhase(i){
  const id=grid[i], t=temp[i];
  switch(id){
    case WATER:  if (t>=100){ grid[i]=STEAM; life[i]=MAT[STEAM].life; discover(STEAM); }
                 else if (t<=0){ grid[i]=ICE; discover(ICE); } break;
    case STEAM:  if (t<=75 && Math.random()<0.06) { grid[i]=WATER; life[i]=0; } break;  // מתעבה בהדרגה (כמו גשם)
    case ICE:    if (t>=1)  { grid[i]=WATER; } break;
    case STONE:  if (t>=1100){ grid[i]=LAVA; aux[i]=1; discover(LAVA); } break;  // aux=1: לבה שהיתה אבן
    case BASALT: if (t>=1100){ grid[i]=LAVA; aux[i]=0; discover(LAVA); } break;  // בזלת נמסה ללבה טהורה
    case LAVA:   if (t>=2900){ pha[i]=2; }                      // רותחת → 💨 אדי סלע (גז)
                 else if (pha[i]===2){ pha[i]=0; }              // מתעבה חזרה ללבה
                 else if (t<=600) {                             // מתקררת: אבן→אבן, לבה טהורה→בזלת שחורה
                   grid[i] = aux[i]===1 ? STONE : BASALT; aux[i]=0; pha[i]=0;
                   if (grid[i]===BASALT) discover(BASALT);
                 } break;
    case SAND:   if (t>=1400){ grid[i]=GLASS; discover(GLASS); } break;
    case GLASS:  if (t>=2950){ pha[i]=2; } else if (pha[i]===2){ pha[i]=0; } break;  // זכוכית רותחת → גז
    case MUD:    if (t>=140) {                                 // מתייבש — המים יוצאים כאדים (ואז מתעבים חזרה)
                   if (i>=W && grid[i-W]===AIR){ grid[i-W]=STEAM; life[i-W]=MAT[STEAM].life; temp[i-W]=Math.max(101,t); }
                   grid[i]=EARTH; } break;
    case WOOD: case LEAF: case SPROUT: case FLOWER: case SEEDT: case SEEDF:
      if (t>=300){ grid[i]=FIRE; temp[i]=760; life[i]=MAT[FIRE].life; discover(FIRE); } break;
  }
  // ---- מעבר מצב גנרי: כל חומר עם נקודת התכה נמס/רותח/מתמצק וזוכר מי הוא ----
  if (genPhase[id]){
    const mp=meltC[id], bp=boilC[id];
    if (pha[i]===0){
      if (bp!=null && t>=bp) pha[i]=2;
      else if (mp!=null && t>=mp){ pha[i]=1; fireMissionFlag('melt'); }
    } else if (pha[i]===1){
      if (bp!=null && t>=bp) pha[i]=2;
      else if (mp!=null && t<mp) pha[i]=0;      // מתמצק חזרה
    } else if (pha[i]===2){
      if (bp!=null && t<bp) pha[i]=1;           // מתעבה חזרה לנוזל (אף פעם לא נעלם)
    }
  }
}

/* ===== תגובות/צמיחה (כימיה שאינה תרמית) ===== */
const NEI4 = [[1,0],[-1,0],[0,1],[0,-1]];
function react(x,y,i,id){
  switch(id){
    case WATER:  return reactWater(x,y,i);
    case MUD:    return reactMud(x,y,i);
    case SPROUT: return growSprout(x,y,i);
    case SEEDT:  return reactSeed(x,y,i,true);
    case SEEDF:  return reactSeed(x,y,i,false);
    case FLOWER: return reactPlantPart(x,y,i,FLOWER);
    case FIRE:   return updateFire(x,y,i);
    case ASH:    return reactAsh(x,y,i);
    case HYDRO:  return reactHydrogen(x,y,i);
    case LITH: case SODIUM: case POTAS: case RUBID: case CESIUM: case FRANC: return reactAlkali(x,y,i,id);
    case IRON:   return reactIron(x,y,i);
    case COPPER: return reactCopper(x,y,i);
    case OXY:    return reactOxygen(x,y,i);
    case MAGNES: return reactMagnesium(x,y,i);
    case URANIUM:return reactUranium(x,y,i);
    case SULFUR: return reactSulfur(x,y,i);
    case ACID:   return reactAcid(x,y,i);
    case LEAF:   return reactPlantPart(x,y,i,LEAF);
    case WOOD:   return reactWood(x,y,i);
  }
  return false;
}
// מתכות אלקליות (הטור השמאלי): מתפוצצות במים. ככל שיורדים בטור — הפיצוץ עוצמתי יותר
// (זו כימיה אמיתית: הריאקטיביות עולה Li<Na<K<Rb<Cs<Fr). נתרן + כלור → מלח.
const ALKALI_POWER = {};
ALKALI_POWER[LITH]=4; ALKALI_POWER[SODIUM]=7; ALKALI_POWER[POTAS]=11;
ALKALI_POWER[RUBID]=15; ALKALI_POWER[CESIUM]=20; ALKALI_POWER[FRANC]=26;
function reactAlkali(x,y,i,id){
  for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const n=grid[idx(nx,ny)];
    if(n===WATER){ explode(x,y,i, ALKALI_POWER[id]||4); return true; }
    if(id===SODIUM && n===CHLOR){ const j=idx(nx,ny);            // Na + Cl → מלח
      grid[i]=SALT; life[i]=0; pha[i]=0; grid[j]=SALT; life[j]=0; pha[j]=0; discover(SALT); return true; }
  }
  return false;
}
// ברזל: חם + פחמן → פלדה (סגסוגת חזקה). קר + מים → חלודה.
function reactIron(x,y,i){
  if(temp[i]>=800) for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const j=idx(nx,ny); if(grid[j]===CARBON){ grid[i]=STEEL; pha[i]=0; grid[j]=STEEL; pha[j]=0; discover(STEEL); return true; } }
  if(temp[i]<250) for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    if(grid[idx(nx,ny)]===WATER && Math.random()<0.0018){ grid[i]=RUST; life[i]=0; pha[i]=0; discover(RUST); return true; } }
  return false;
}
// נחושת: חם + בדיל → ברונזה (סגסוגת)
function reactCopper(x,y,i){
  if(temp[i]>=232) for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const j=idx(nx,ny); if(grid[j]===TIN){ grid[i]=BRONZE; pha[i]=0; grid[j]=BRONZE; pha[j]=0; discover(BRONZE); return true; } }
  return false;
}
// גופרית + מים → חומצה גופרתית (H₂SO₄)
function reactSulfur(x,y,i){
  for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const j=idx(nx,ny); if(grid[j]===WATER && Math.random()<0.012){ grid[i]=ACID; life[i]=0; grid[j]=AIR; life[j]=0; velX[j]=0; velY[j]=0; discover(ACID); return true; } }
  return false;
}
// חומצה: ממיסה מוצקים/אבקות (חוץ מזכוכית/זהב/קיר). ממתכת משתחרר מימן (בועות). מתדלדלת עם השימוש.
const ACID_RESIST = new Set([GLASS, GOLD, WALL]);   // עמידים לחומצה — אפשר להחזיק חומצה בכלי זכוכית!
function reactAcid(x,y,i){
  for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const j=idx(nx,ny), n=grid[j], tp=MAT[n].type;
    if((tp==='solid'||tp==='powder'||tp==='static') && !ACID_RESIST.has(n)){
      if(Math.random()<0.07){
        if(conduct[n] && tp!=='gas'){ grid[j]=HYDRO; life[j]=MAT[HYDRO].life; pha[j]=0; }   // מתכת → בועת מימן
        else { grid[j]=AIR; life[j]=0; pha[j]=0; }
        if(Math.random()<0.3){ grid[i]=AIR; life[i]=0; velX[i]=0; velY[i]=0; }               // החומצה נצרכת
        return true;
      }
    }
  }
  return false;
}
// חמצן מזין בעירה: מגביר אש שכנה, ולאט נצרך לתוכה
function reactOxygen(x,y,i){
  let fed=false;
  for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const j=idx(nx,ny), n=grid[j];
    if(n===FIRE){ if(life[j]<250)life[j]+=3; temp[j]+=10; fed=true; }
    else if(MAT[n].flam && n!==OXY){ temp[j]+=3; }            // עוזר להתלקח
  }
  if(fed && Math.random()<0.05){ grid[i]=FIRE; temp[i]=820; life[i]=MAT[FIRE].life; return true; }
  return false;
}
// מגנזיום: נדלק בקלות ובוער באור לבן לוהט מאוד (~1100°)
function reactMagnesium(x,y,i){
  let ig = temp[i]>=473;
  if(!ig) for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const n=grid[idx(nx,ny)]; if(n===FIRE||n===LAVA){ ig=true; break; } }
  if(ig){ grid[i]=FIRE; temp[i]=1100; life[i]=MAT[FIRE].life+50; discover(FIRE); return true; }
  return false;
}
// אורניום: רדיואקטיבי — מתחמם מעצמו (גוש גדול מתחמם יותר, כמו מסה קריטית)
function reactUranium(x,y,i){
  if(temp[i]<250) temp[i]+=2.0;
  return false;
}
// עץ: נופל כשאין תמיכה מתחתיו (אם ההגדרה דלוקה)
function reactWood(x,y,i){
  if(plantGrav && y+1<H && grid[idx(x,y+1)]===AIR){ swap(i,idx(x,y+1)); return true; }
  return true;
}
// עלה/פרח: אם התנתקו מהעץ (אין שכן צמחי) ואין תמיכה — נופלים
function reactPlantPart(x,y,i,id){
  if(plantGrav){
    let att=false;
    for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
      const n=grid[idx(nx,ny)]; if(n===WOOD||n===LEAF||n===FLOWER||n===SPROUT){ att=true; break; } }
    if(!att && y+1<H && canSink(id,grid[idx(x,y+1)])){ swap(i,idx(x,y+1)); return true; }
  }
  if(id===FLOWER) return reactFlowerSeed(x,y,i);
  return true;
}
// מימן: ליד אש/לבה או מעל טמפ' התלקחות (~560°) → מתפוצץ. הליום (אצילי) לא — לכן אין לו react.
function reactHydrogen(x,y,i){
  let ignite = temp[i]>=560;
  if(!ignite) for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
    const n=grid[idx(nx,ny)]; if(n===FIRE||n===LAVA){ ignite=true; break; } }
  if(ignite){ explode(x,y,i); return true; }
  return false;   // אחרת מתנהג כגז קל (עולה) — moveGas
}
// פיצוץ אמיתי: כדור אש במרכז, גל הדף שמעיף הכל (גם מוצקים = רסיסים) לכל הכיוונים,
// גל חום עז, הצתת שרשרת ומכתש. R = עוצמה — מתכת אלקלית כבדה יותר = פיצוץ גדול יותר.
function explode(x,y,i,R=4){
  const R2=R*R, core=R*0.4;
  for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
    const d2=dx*dx+dy*dy; if(d2>R2) continue;
    const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
    const j=idx(nx,ny), n=grid[j];
    if(n===WALL) continue;                            // קיר עומד בפני הפיצוץ
    const d=Math.sqrt(d2)||1, f=(R-d)/R;
    temp[j] += f*1400;                                // גל חום עז
    if(d<core){                                       // ליבת כדור האש — מאדה הכל
      grid[j]=FIRE; temp[j]=Math.max(temp[j],1500); life[j]=MAT[FIRE].life; pha[j]=0; velX[j]=0; velY[j]=0; moved[j]=1;
      continue;
    }
    if(n!==AIR){                                      // גל הדף — מעיף החוצה ולמעלה (כולל מוצקים)
      const inv=1/d;
      velX[j] += dx*inv*f*MAXV*(1.0+Math.random()*0.6);
      velY[j] += (dy*inv - 0.6)*f*MAXV*(0.9+Math.random()*0.6);
      if(velX[j]> MAXV)velX[j]= MAXV; if(velX[j]<-MAXV)velX[j]=-MAXV;
      if(velY[j]> MAXV)velY[j]= MAXV; if(velY[j]<-MAXV)velY[j]=-MAXV;
      if(MAT[n].flam && Math.random()<0.6){ grid[j]=FIRE; temp[j]=1000; life[j]=MAT[FIRE].life; pha[j]=0; moved[j]=1; }   // שרשרת הצתה
      else if(n===HYDRO){ grid[j]=FIRE; temp[j]=1100; life[j]=MAT[FIRE].life; moved[j]=1; }
    }
  }
  grid[i]=FIRE; temp[i]=1600; life[i]=MAT[FIRE].life; pha[i]=0; velX[i]=0; velY[i]=0; moved[i]=1;   // מרכז = כדור אש
}
function reactWater(x,y,i){
  for (const [dx,dy] of NEI4){
    const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
    const j=idx(nx,ny), n=grid[j];
    if (n===EARTH && Math.random()<0.22){ setCell(j,MUD); grid[i]=AIR; life[i]=0; velX[i]=0; velY[i]=0; return true; } // המים נספגים — נצרכים
    else if (n===STONE && Math.random()<0.0016){ setCell(j,SAND); }
  }
  return false;
}
function reactMud(x,y,i){
  const below = y+1<H ? grid[idx(x,y+1)] : STONE;
  const aboveIsAir = y-1>=0 && grid[idx(x,y-1)]===AIR;
  let wet=false;   // בוץ רווי מדי (ליד מים) לא מצמיח
  for(const [dx,dy] of NEI4){ const nx=x+dx,ny=y+dy; if(inB(nx,ny)&&grid[idx(nx,ny)]===WATER){ wet=true; break; } }
  if (!wet && below!==AIR && aboveIsAir && Math.random()<0.0022){
    const a=idx(x,y-1);
    grid[a]=SPROUT; life[a]=10+Math.floor(Math.random()*12); aux[a]=6;
    discover(SPROUT);
  }
  return false;
}
const GROW_DELAY = 7;
// צמח שותה כדי לגדול: מחפש מים (נצרכים) או בוץ (יורד רמה לאדמה) ברדיוס קטן. מחזיר true אם שתה.
function drinkWater(x,y){
  for (let r=1;r<=3;r++) for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
    if (Math.abs(dx)!==r && Math.abs(dy)!==r) continue;   // רק הטבעת החיצונית של הרדיוס
    const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
    const j=idx(nx,ny);
    if (grid[j]===WATER){ grid[j]=AIR; life[j]=0; velX[j]=0; velY[j]=0; return true; }  // שותה מים
    if (grid[j]===MUD){ grid[j]=EARTH; return true; }                                   // מנקז בוץ → אדמה
  }
  return false;
}
function growSprout(x,y,i){
  if (aux[i] > 0){ aux[i]--; return true; }
  const a = y-1>=0 ? idx(x,y-1) : -1;
  if (life[i] > 1 && a>=0 && grid[a]===AIR && !drinkWater(x,y)){ aux[i]=GROW_DELAY; return true; }  // אין מים — ממתין
  if (life[i] > 1 && a>=0 && grid[a]===AIR){
    grid[a]=SPROUT; life[a]=life[i]-1; aux[a]=GROW_DELAY;
    grid[i]=WOOD; life[i]=0; discover(WOOD);
    if (Math.random()<0.35){
      const sx = x + (Math.random()<0.5?1:-1);
      if (sx>=0 && sx<W){ const s=idx(sx,y); if (grid[s]===AIR){ grid[s]=LEAF; discover(LEAF); } }
    }
  } else { grid[i]=FLOWER; life[i]=0; discover(FLOWER); }
  return true;
}
function reactSeed(x,y,i,isTree){
  const below = y+1<H ? grid[idx(x,y+1)] : AIR;
  if (below===MUD){
    grid[i]=SPROUT; aux[i]=GROW_DELAY;
    life[i] = isTree ? 12+Math.floor(Math.random()*10) : 3+Math.floor(Math.random()*2);
    discover(SPROUT);
    return true;
  }
  return false;
}
function reactFlowerSeed(x,y,i){
  if (Math.random()<0.0045){
    for (const [dx,dy] of [[0,-1],[1,0],[-1,0]]){
      const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
      const j=idx(nx,ny);
      if (grid[j]===AIR){ const t=Math.random()<0.5; grid[j]=t?SEEDT:SEEDF; discover(t?SEEDT:SEEDF); break; }
    }
  }
  return true;
}
function updateFire(x,y,i){
  if (temp[i]<650) temp[i]=700+Math.random()*160;   // אש חמה — מחממת ומדליקה סביבה
  if (life[i]===0) life[i]=MAT[FIRE].life;
  for (const [dx,dy] of NEI4){                       // מתפשטת לחומר דליק צמוד
    const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
    const j=idx(nx,ny);
    if (MAT[grid[j]].flam){
      if (Math.random()<0.25){ grid[j]=FIRE; temp[j]=760; life[j]=MAT[FIRE].life; moved[j]=1; discover(FIRE); }
      else temp[j]+=25;
    }
  }
  if (--life[i] <= 1){
    if (Math.random()<0.4){ grid[i]=ASH; discover(ASH); } else grid[i]=AIR;
    life[i]=0; return true;
  }
  const a = y-1>=0?idx(x,y-1):-1;
  if (a>=0 && grid[a]===AIR && Math.random()<0.6){ swap(i,a); moved[a]=1; }
  return true;
}
function reactAsh(x,y,i){
  for (const [dx,dy] of NEI4){
    const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
    if (grid[idx(nx,ny)]===WATER && Math.random()<0.05){ grid[i]=EARTH; return true; }
  }
  return false;
}

/* ===== תנועה ===== */
function canSink(mv,tg){
  if (tg===AIR) return true;
  const t=MAT[tg];
  return (t.type==='liquid'||t.type==='gas') && density(mv)>density(tg);
}
/* תנועה דינמית: כובד מאיץ, החומר נופל לפי מהירותו (מספר תאים בצעד),
   ובפגיעה חזקה (חפץ כבד+מהיר) הוא מפזר את הקרקע ויוצר מכתש. */
function moveDynamic(x,y,i,id,kind){
  velX[i]*=0.86;                                   // התנגדות אוויר אופקית
  velY[i]+=G_ACC;
  if (velY[i]> MAXV) velY[i]= MAXV;
  if (velY[i]<-MAXV) velY[i]=-MAXV;
  let cur=i, cx=x, cy=y;

  // תנועה אופקית (חלקיקים שנזרקו מפגיעה)
  if (Math.abs(velX[cur])>=0.7){
    const s=velX[cur]>0?1:-1, nx=cx+s;
    if (nx>=0&&nx<W){ const j=idx(nx,cy);
      if (grid[j]===AIR||canSink(id,grid[j])){ swap(cur,j); cur=j; cx=nx; velX[cur]*=0.7; }
      else velX[cur]=0;
    } else velX[cur]=0;
  }

  // תנועה אנכית — מספר תאים לפי המהירות
  const dir = velY[cur]>=0 ? 1 : -1;
  const steps = Math.max(1, Math.round(Math.abs(velY[cur])));
  let moved=0;
  for (let s=0;s<steps;s++){
    const ny=cy+dir; if (ny<0||ny>=H) break;
    const j=cur+dir*W;
    const ok = dir>0 ? canSink(id,grid[j]) : (grid[j]===AIR);
    if (ok){ swap(cur,j); cur=j; cy=ny; moved++; } else break;
  }

  if (dir>0 && moved<steps){                       // נחת/נחסם
    const v=velY[cur], E=0.5*mass[id]*v*v;
    if (kind==='solid' && E>IMPACT_TH) scatter(cx, cy, id, E);   // מכתש
    velY[cur]=0;
    settleLateral(cur, cy, id, kind);
  } else if (dir<0 && moved<steps){                // חלקיק שנזרק למעלה נחסם
    velY[cur]=0;
  }
}
function movePowder(x,y,i,id){ moveDynamic(x,y,i,id,'powder'); }
function moveSolid (x,y,i,id){ moveDynamic(x,y,i,id,'solid');  }

// ערמה/זרימה אחרי נחיתה (אבקה נערמת באלכסון, נוזל זורם הצידה)
function settleLateral(i,y,id,kind){
  if (kind==='solid') return;
  const x=i%W, dir=Math.random()<0.5?1:-1;
  for (const dx of [dir,-dir]){ const nx=x+dx;
    if (nx>=0&&nx<W&&y+1<H){ const d=idx(nx,y+1); if(canSink(id,grid[d])){ swap(i,d); return; } } }
  if (kind==='liquid'){
    const vc = pha[i]===1 ? 0.28 : (VISC[id]||0.5);   // מותך = סמיך; מים = נוזלי
    if (Math.random() >= vc) return;                  // נוזל סמיך זורם לאט
    const reach = vc>=0.9 ? 2 : 1;                    // מים נוזליים זורמים רחוק יותר (מתייצבים מהר)
    for (const dx of [dir,-dir]){
      for (let r=1;r<=reach;r++){ const nx=x+dx*r;
        if (nx<0||nx>=W) break; const s=idx(nx,y);
        if (grid[s]===AIR){ swap(i,s); return; }
        if (grid[s]!==id || pha[s]!==pha[i]) break;   // נחסם ע"י חומר/מצב אחר
      }
    }
  }
}

// פיזור בפגיעה — הקרקע עפה לצדדים ולמעלה, נוצר מכתש
// פיזור בפגיעה — פרופורציונלי לאנרגיה האמיתית (½·מסה·מהירות²). לא מנופח.
function scatter(cx,cy,id,E){
  const r = Math.min(RMAX, 1+Math.floor(Math.sqrt(E)*0.4));
  const power = Math.min(MAXV, Math.sqrt(E)*0.5);
  for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
    const dist=Math.hypot(dx,dy); if (dist<1||dist>r) continue;
    const nx=cx+dx, ny=cy+dy; if(!inB(nx,ny)) continue;
    const j=idx(nx,ny), tp=MAT[grid[j]].type;
    if ((tp==='powder'||tp==='liquid') && Math.random()<0.7){
      const inv=1/(dist||1);
      velX[j] += dx*inv*power*(0.6+Math.random()*0.6);
      velY[j] -= power*(0.4+Math.random()*0.6)*(dy<=0?1:0.3);
      if (velX[j]> MAXV) velX[j]= MAXV; if (velX[j]<-MAXV) velX[j]=-MAXV;
      if (velY[j]<-MAXV) velY[j]=-MAXV;
    }
  }
}
function moveLiquid(x,y,i,id){ moveDynamic(x,y,i,id,'liquid'); }
function moveGas(x,y,i,id){
  // גז לא נעלם לאוויר לעולם — אדים מתעבים למים (checkPhase), הליום/מימן נשארים.
  // ציפה הדרגתית: גז חם עולה מהר יותר, קר — לאט. לא קופץ מיד למעלה.
  const pUp = Math.min(0.5, LIFT[id] + Math.max(0,(temp[i]-AMB))*0.004);
  if (Math.random() < pUp && y-1>=0){
    const a=idx(x,y-1);
    if (grid[a]===AIR){ swap(i,a); moved[a]=1; return; }
    // אם חסום מלמעלה — מנסה באלכסון מעלה
    const dl=Math.random()<0.5?1:-1;
    for (const dx of [dl,-dl]){ const nx=x+dx; if(nx>=0&&nx<W){ const u=idx(nx,y-1); if(grid[u]===AIR){ swap(i,u); moved[u]=1; return; } } }
  }
  // פיזור אופקי איטי (הגז מתפשט)
  if (Math.random()<0.25){ const dir=Math.random()<0.5?1:-1, nx=x+dir;
    if (nx>=0&&nx<W){ const s=idx(nx,y); if(grid[s]===AIR){ swap(i,s); moved[s]=1; return; } } }
}

/* ===== גילוי ===== */
function discover(id){
  if (found[id]) return;
  found[id]=1; foundCount++; score+=100;
  updateScore(); buildPalette(id); buildPedia();
  toast('🔬 גילית: '+MAT[id].name+'!');
  checkMissions(id);
}
function updateScore(){
  document.getElementById('score').innerHTML = `🔬 ${foundCount}/${TOTAL} &nbsp; ⭐ ${score}`;
}

/* ===== משימות ===== */
const MISSIONS = [
  { t:'שים 🟫 אדמה ליד 💧 מים — צור בוץ.',                 ok:id=>id===MUD },
  { t:'בוץ על הקרקע יצמיח 🌱 נבט. חכה רגע.',              ok:id=>id===SPROUT },
  { t:'תן לנבט לגדול ל🌳 עץ שלם.',                        ok:id=>id===WOOD },
  { t:'עץ בוגר מוציא 🌸 פרח.',                            ok:id=>id===FLOWER },
  { t:'פרח נותן 🌰 זרעים — תפוס אחד.',                    ok:id=>id===SEEDT||id===SEEDF },
  { t:'קח את מברשת 🔥 החום וחמם עץ עד שיידלק.',          ok:id=>id===FIRE },
  { t:'מים חמים מ-100° הופכים ל💨 אדים.',                 ok:id=>id===STEAM },
  { t:'מברשת ❄️ הקור על מים → 🧊 קרח (מתחת ל-0°).',       ok:id=>id===ICE },
  { t:'מים זורמים על 🪨 אבן שוחקים אותה ל🏖️ חול.',        ok:id=>id===SAND },
  { t:'חמם 🏖️ חול חזק (1400°) → 🔮 זכוכית.',              ok:id=>id===GLASS },
  { t:'חמם 🪨 אבן עד 1100° → 🌋 לבה. קרר במים → בזלת.',   ok:id=>id===LAVA },
  { t:'🔍 בחר "בדיקה" ולחץ על חומר — ראה טמפ\', משקל ומולקולה.', flag:'inspect' },
  { t:'⚙️ פתח הגדרות — שנה "מקסימום חום" ומוליכות חום.',   flag:'settings' },
  { t:'✋ קח את היד, הרם גוש חומר וזרוק אותו במקום אחר.',  flag:'hand' },
  { t:'🫠 קנה מתכת בחנות (ליתיום), חמם מעל נקודת ההיתוך — היא נמסה!', flag:'melt' },
];
let mi = 0;
// דלג אוטומטית על משימות "גילוי" שכבר השלמת (אחרת אי אפשר להתקדם אם עשית מראש)
function autoAdvance(){
  let guard=0;
  while (mi<MISSIONS.length && MISSIONS[mi].ok && guard<60){
    let done=false;
    for (let id=0; id<MAT.length; id++){ if (found[id] && MISSIONS[mi].ok(id)){ done=true; break; } }
    if (!done) break;
    mi++; guard++;
  }
}
function showMission(){
  autoAdvance();
  const el=document.getElementById('mission'), tx=document.getElementById('missionText');
  el.classList.remove('done');
  tx.textContent = mi<MISSIONS.length ? MISSIONS[mi].t : '🎉 גילית הכל! עכשיו פשוט תיצור ותשחק.';
}
function completeMission(){
  document.getElementById('mission').classList.add('done');
  document.getElementById('missionText').textContent='✓ כל הכבוד! משימה הושלמה.';
  mi++; setTimeout(showMission, 1600);
}
function checkMissions(id){
  if (mi<MISSIONS.length && MISSIONS[mi].ok && MISSIONS[mi].ok(id)) completeMission();
}
// משימות מבוססות פעולה (בדיקה/הגדרות/יד/המסה) ולא גילוי חומר
function fireMissionFlag(name){
  if (mi<MISSIONS.length && MISSIONS[mi].flag===name) completeMission();
}

/* ===== קלט (כולל מברשות חום/קור) ===== */
function paintAt(cx,cy){
  const r=canvas.getBoundingClientRect();
  const gx=Math.floor((cx-r.left)/r.width*W), gy=Math.floor((cy-r.top)/r.height*H);
  if (current==='inspect'){ inspectAt(gx,gy,cx,cy); return; }   // זכוכית מגדלת
  if (current==='hand'){ holdX=gx; holdY=gy; return; }          // היד רק עוקבת — תפיסה/שחרור ב-down/up
  const rad=brush;
  for (let dy=-rad; dy<=rad; dy++) for (let dx=-rad; dx<=rad; dx++){
    if (dx*dx+dy*dy>rad*rad) continue;
    const x=gx+dx, y=gy+dy; if(!inB(x,y)) continue;
    const i=idx(x,y);
    if (current==='heat'){ if(grid[i]!==WALL) temp[i]=Math.min(maxTemp, temp[i]+heatStep); continue; }
    if (current==='cool'){ if(grid[i]!==WALL) temp[i]=Math.max(minTemp,  temp[i]-heatStep); continue; }
    if (current===AIR){ grid[i]=AIR; life[i]=0; aux[i]=0; temp[i]=AMB; velX[i]=0; velY[i]=0; continue; }
    if (buildOnAir && grid[i]!==AIR) continue;   // ברירת מחדל: בונים רק על אוויר (לא מוחקים)
    grid[i]=current; life[i]=0; aux[i]=0; velX[i]=0; velY[i]=0;
    temp[i] = temp0[current]!=null ? temp0[current] : AMB;
    if (current===FIRE) life[i]=MAT[FIRE].life;
    else if (current===SPROUT){ life[i]=12+Math.floor(Math.random()*10); aux[i]=0; }
  }
}
function pos(e){ const t=e.touches?e.touches[0]:e; return [t.clientX,t.clientY]; }
function toGrid(cx,cy){ const r=canvas.getBoundingClientRect();
  return [Math.floor((cx-r.left)/r.width*W), Math.floor((cy-r.top)/r.height*H)]; }
// כלי היד — מרים את כל החומרים ברדיוס לתוך "held", מנקה מהרשת
function grabHand(gx,gy){
  const cells=[], rad=brush;
  for (let dy=-rad; dy<=rad; dy++) for (let dx=-rad; dx<=rad; dx++){
    if (dx*dx+dy*dy>rad*rad) continue;
    const x=gx+dx, y=gy+dy; if(!inB(x,y)) continue;
    const i=idx(x,y), id=grid[i]; if (id===AIR||id===WALL) continue;
    cells.push({dx,dy,id,temp:temp[i],life:life[i],aux:aux[i],pha:pha[i]});
    grid[i]=AIR; life[i]=0; aux[i]=0; velX[i]=0; velY[i]=0; temp[i]=AMB; pha[i]=0;
  }
  if (cells.length){ held={cells}; holdX=gx; holdY=gy; fireMissionFlag('hand'); }
}
// שחרור — מניח את הגוש במקום החדש (רק על אוויר)
function dropHand(){
  if (!held) return;
  for (const c of held.cells){
    const x=holdX+c.dx, y=holdY+c.dy; if(!inB(x,y)) continue;
    const i=idx(x,y); if (grid[i]!==AIR) continue;
    grid[i]=c.id; temp[i]=c.temp; life[i]=c.life; aux[i]=c.aux; pha[i]=c.pha; velX[i]=0; velY[i]=0;
  }
  held=null;
}
function down(e){ e.preventDefault(); painting=true; [ptx,pty]=pos(e);
  if (current==='hand'){ const [gx,gy]=toGrid(ptx,pty); if(!held) grabHand(gx,gy); else { holdX=gx; holdY=gy; } return; }
  paintAt(ptx,pty); }
function move(e){ if(!painting) return; e.preventDefault(); const [x,y]=pos(e);
  const steps=Math.max(1,Math.hypot(x-ptx,y-pty)/3);
  for (let s=0;s<=steps;s++) paintAt(ptx+(x-ptx)*s/steps, pty+(y-pty)*s/steps);
  ptx=x; pty=y; }
function up(){ painting=false;
  if (current==='hand' && held) dropHand();
  if (current==='inspect') document.getElementById('mag').style.display='none'; }
canvas.addEventListener('touchstart',down,{passive:false});
canvas.addEventListener('touchmove', move,{passive:false});
canvas.addEventListener('touchend',  up);
canvas.addEventListener('mousedown', down);
canvas.addEventListener('mousemove', move);
window.addEventListener('mouseup',   up);

/* ===== לוח החומרים + בחירה ===== */
const matsEl = document.getElementById('materials');
function setCurrent(v){ if(held && v!=='hand') dropHand(); current=v; refreshActive(); updateSliders(); }
function refreshActive(){
  [...matsEl.children].forEach(c=> c.classList.toggle('active', c.dataset.id!==''&&+c.dataset.id===current));
  document.getElementById('btnHeat').classList.toggle('selbtn', current==='heat');
  document.getElementById('btnCool').classList.toggle('selbtn', current==='cool');
  document.getElementById('btnHand').classList.toggle('selbtn', current==='hand');
  document.getElementById('btnInspect').classList.toggle('selbtn', current==='inspect');
  if (current!=='inspect'){ document.getElementById('mag').style.display='none'; document.getElementById('inspect').style.display='none'; }
}
function updateSliders(){
  const isHeat = current==='heat' || current==='cool';
  document.getElementById('degWrap').style.display = isHeat ? 'flex' : 'none';
  document.getElementById('spdWrap').style.display = isHeat ? 'none' : 'flex';
}

/* ===== זכוכית מגדלת + חלון מידע ===== */
const magEl = document.getElementById('mag');
const magCtx = magEl.getContext('2d');
magCtx.imageSmoothingEnabled = false;
const inspEl = document.getElementById('inspect');
function inspectAt(gx,gy,cx,cy){
  if (!inB(gx,gy)) return;
  // --- זכוכית מגדלת: מציגים אזור 11x11 מוגדל ---
  const SRC=11, half=(SRC-1)/2;
  magCtx.clearRect(0,0,132,132);
  magCtx.drawImage(buf, gx-half, gy-half, SRC, SRC, 0,0,132,132);
  magCtx.strokeStyle='rgba(255,255,255,.7)'; magCtx.lineWidth=2;   // צלב כוונת על התא המרכזי
  const c=132/SRC; magCtx.strokeRect(half*c, half*c, c, c);
  const rect=canvas.getBoundingClientRect();
  let mx=cx-66, my=cy-150;                                        // מעל האצבע
  mx=Math.max(rect.left+4, Math.min(mx, rect.right-136));
  my=Math.max(rect.top+4, my);
  magEl.style.left=(mx-rect.left)+'px'; magEl.style.top=(my-rect.top)+'px'; magEl.style.display='block';
  // --- חלון מידע ---
  const i=idx(gx,gy), id=grid[i];
  const spd=Math.hypot(velX[i],velY[i]);
  const vmps=(spd*1.5).toFixed(1);                               // המרה משוערת ל-m/s
  const ang=spd>0.15 ? Math.round((Math.atan2(velY[i],velX[i])*180/Math.PI+360)%360) : null;
  const arrow=spd>0.15 ? '↗↘↙↖→↓←↑'[0] : '';
  const kg=(mass[id]*0.1).toFixed(3);
  const joule=(0.5*mass[id]*0.1*vmps*vmps).toFixed(2);
  const st = pha[i]===2 ? 'גז (רותח)' : pha[i]===1 ? 'נוזל (מותך)' : (STATE[MAT[id].type]||'—');

function buildPalette(justFound){
  matsEl.innerHTML='';
  MAT.forEach(m=>{
    if (m.id===AIR || !found[m.id]) return;
    const b=document.createElement('button');
    b.className='mat'+(m.id===current?' active':'')+(m.id===justFound?' pop':'');
    b.dataset.id=m.id;
    b.innerHTML=`<span class="dot" style="background:rgb(${m.color.join(',')})"></span>${m.name}`;
    b.onclick=()=>setCurrent(m.id);
    matsEl.appendChild(b);
  });
  const e=document.createElement('button');
  e.className='mat'+(current===AIR?' active':''); e.dataset.id=AIR;
  e.innerHTML=`<span class="dot" style="background:#222;border-style:dashed"></span>מחק`;
  e.onclick=()=>setCurrent(AIR);
  matsEl.appendChild(e);
}

function buildPedia(){
  const g=document.getElementById('pediaGrid'); g.innerHTML='';
  MAT.forEach(m=>{
    if (m.id===AIR) return;
    const card=document.createElement('div');
    if (found[m.id]){
      card.className='pcard';
      card.innerHTML=`<span class="dot" style="background:rgb(${m.color.join(',')})"></span>
        <div><div class="nm">${m.name}</div><div class="rc">${m.pedia||''}</div></div>`;
    } else {
      card.className='pcard locked';
      card.innerHTML=`<span class="dot">❓</span>
        <div><div class="nm">???</div><div class="rc">${m.pedia||'נסה לשלב חומרים'}</div></div>`;
    }
    g.appendChild(card);
  });
}

  26:'🌧️ + מים → חלודה · חם + פחמן → פלדה 💪',
  29:'🫠 חמם → נמס. חם + בדיל → ברונזה 🔔',
  37:'💧 זרוק על מים → 💥 פיצוץ עוצמתי (חזק מאשלגן)',
  50:'🔔 חמם + נחושת → ברונזה (סגסוגת)',
  55:'💧 זרוק על מים → 💥💥 פיצוץ ענק!',
  87:'💧 זרוק על מים → 💥💥💥 הפיצוץ הכי חזק!',

  92:'☢️ מתחמם לבד! שים אותו וצפה בחום עולה' };
const ptable=document.getElementById('ptable');
function buildShop(){
  ptable.innerHTML='';
  PT.forEach((e,ix)=>{
    const [sym,he,cat,mass,ph,row,col]=e, z=ix+1;
    const c=document.createElement('div');
    c.className='ele'+(PLAY[z]&&found[PLAY[z]]?' owned':'');
    c.style.gridRow=row; c.style.gridColumn=col;
    c.style.background=CAT[cat][1];
    c.innerHTML=`<span class="z">${z}</span><span class="sy">${sym}</span>`;
    c.onclick=()=>showElement(z);
    ptable.appendChild(c);
  });
  const lg=document.getElementById('ptlegend'); lg.innerHTML='';
  Object.values(CAT).forEach(([nm,col])=>{ const s=document.createElement('span'); s.style.background=col; s.textContent=nm; lg.appendChild(s); });
  document.getElementById('kp').innerHTML='🧠 '+score;
}
function showElement(z){
  const [sym,he,cat,mass,ph,row,col]=PT[z-1];
  const col2=CAT[cat][1], playable=PLAY[z]!==undefined, owned=playable&&found[PLAY[z]];
  let props='';
  if(FACTS[z]) props=FACTS[z].map(f=>'<div>'+f+'</div>').join('');
  else props='<div>מצב בטמפ\' החדר: <b>'+PHASE[ph]+'</b></div><div>קטגוריה: <b>'+CAT[cat][0]+'</b></div>';
  if(REACTS[z]) props+='<div style="margin-top:4px">🔗 <b>תגובה:</b> '+REACTS[z]+'</div>';
  const btn = playable
    ? (owned?'<button class="buy" disabled>✓ כבר ברשותך</button>'
            :'<button class="buy" id="buyBtn">קנה · 0 נק\' ידע</button>')
    : '<button class="buy soon" disabled>עוד לא זמין לשחק — נוסיף בעתיד 🔜</button>';
  const atomBtn = ELEMENT_HE[sym] ? '<button class="buy" id="atomBtn" style="background:#3a5580;color:#fff;margin-top:6px">⚛️ צפה במבנה האטום</button>' : '';
  const d=document.getElementById('eleDetail');
  d.innerHTML=`
    <div class="eh">
      <div class="esym" style="background:${col2}"><span class="s">${sym}</span><span class="zz">${z}</span></div>
      <div><div class="en">${he}</div><div class="ec">${CAT[cat][0]} · מסה ${mass} · ${PHASE[ph]}</div></div>
    </div>
    <div class="props">${props}</div>
    ${btn}${atomBtn}`;
  d.classList.add('show');
  if(playable && !owned) document.getElementById('buyBtn').onclick=()=>{
    found[PLAY[z]]=1; buildPalette(PLAY[z]); buildShop(); showElement(z);
    toast('🛒 קנית: '+he+'!');
  };
  if(atomBtn) document.getElementById('atomBtn').onclick=()=>showAtom(sym);
}
document.getElementById('btnShop').onclick=()=>{ buildShop(); document.getElementById('eleDetail').classList.remove('show'); document.getElementById('shop').classList.add('open'); };
document.getElementById('shopClose').onclick=()=>document.getElementById('shop').classList.remove('open');

/* ===== הגדרות ===== */
let plantGrav = true;
function applyBorder(){ if(!borderWalls) return;
  const w=(i)=>{ grid[i]=WALL; temp[i]=0; };
  for(let x=0;x<W;x++){ w(idx(x,0)); w(idx(x,H-1)); }
  for(let y=0;y<H;y++){ w(idx(0,y)); w(idx(W-1,y)); }
}
function clearBorder(){
  for(let x=0;x<W;x++){ if(grid[idx(x,0)]===WALL)grid[idx(x,0)]=AIR; if(grid[idx(x,H-1)]===WALL)grid[idx(x,H-1)]=AIR; }
  for(let y=0;y<H;y++){ if(grid[idx(0,y)]===WALL)grid[idx(0,y)]=AIR; if(grid[idx(W-1,y)]===WALL)grid[idx(W-1,y)]=AIR; }
}
document.getElementById('btnSettings').onclick=()=>document.getElementById('settings').classList.add('open');
document.getElementById('setClose').onclick=()=>document.getElementById('settings').classList.remove('open');
document.getElementById('setBuild').onchange=e=>buildOnAir=e.target.checked;
document.getElementById('setGrav').onchange=e=>plantGrav=e.target.checked;
document.getElementById('setBorder').onchange=e=>{ borderWalls=e.target.checked; if(borderWalls)applyBorder(); else clearBorder(); };
document.getElementById('setMaxT').onchange=e=>{ maxTemp=Math.max(200,+e.target.value||4000); fireMissionFlag('settings'); };
document.getElementById('setCond').oninput=e=>{ condMul=+e.target.value/10; fireMissionFlag('settings'); };

/* ===== מודל בוהר של האטום (חינוכי) ===== */
// מספר אלקטרונים בכל קליפה (2,8,18,32...) לפי מספר אטומי
function shells(Z){ const cap=[2,8,18,32,32,18,8]; const sh=[]; let e=Z;
  for(let k=0;k<cap.length&&e>0;k++){ const n=Math.min(cap[k],e); sh.push(n); e-=n; } return sh; }
const ELEMENT_HE={H:['מימן',1],He:['הליום',2],Li:['ליתיום',3],Be:['בריליום',4],B:['בורון',5],C:['פחמן',6],N:['חנקן',7],O:['חמצן',8],Ne:['ניאון',10],Na:['נתרן',11],Mg:['מגנזיום',12],Al:['אלומיניום',13],Si:['צורן',14],S:['גופרית',16],Cl:['כלור',17],K:['אשלגן',19],Ca:['סידן',20],Fe:['ברזל',26],Cu:['נחושת',29],Rb:['רובידיום',37],Ag:['כסף',47],Sn:['בדיל',50],Cs:['צזיום',55],W:['טונגסטן',74],Au:['זהב',79],Hg:['כספית',80],Pb:['עופרת',82],Fr:['פרנציום',87],U:['אורניום',92]};
function showAtom(sym, list){
  const info=ELEMENT_HE[sym]; if(!info) return;
  const [he,Z]=info, sh=shells(Z);
  // לשוניות למעבר בין האטומים השונים במולקולה
  const tabs=document.getElementById('atomTabs'); tabs.innerHTML='';
  if(list && list.length>1){
    list.forEach(s=>{ if(!ELEMENT_HE[s]) return;
      const b=document.createElement('button'); b.className='atab'+(s===sym?' on':'');
      b.textContent=`${s} · ${ELEMENT_HE[s][0]}`;
      b.onclick=()=>showAtom(s, list); tabs.appendChild(b); });
  }
  const cv=document.getElementById('atomCv'), x=cv.getContext('2d'), S=cv.width, cx=S/2, cy=S/2;
  x.clearRect(0,0,S,S);
  // קליפות — מרווח מותאם כדי שגם אטומים כבדים (הרבה קליפות) ייכנסו במסגרת
  const gap=Math.min(30,(S/2-26)/Math.max(1,sh.length));
  for(let k=0;k<sh.length;k++){
    const r=30+k*gap;
    x.strokeStyle='rgba(120,150,200,.4)'; x.lineWidth=1.5;
    x.beginPath(); x.arc(cx,cy,r,0,7); x.stroke();
    // אלקטרונים על הקליפה
    for(let e=0;e<sh[k];e++){
      const a=(e/sh[k])*Math.PI*2 - Math.PI/2 + k*0.3;
      const ex=cx+r*Math.cos(a), ey=cy+r*Math.sin(a);
      x.fillStyle='#6cc0ff'; x.beginPath(); x.arc(ex,ey,5,0,7); x.fill();
      x.fillStyle='#fff'; x.font='7px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('-',ex,ey);
    }
  }
  // גרעין
  x.fillStyle='#e05555'; x.beginPath(); x.arc(cx,cy,20,0,7); x.fill();
  x.fillStyle='#fff'; x.font='bold 15px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(sym,cx,cy);
  const valence=sh[sh.length-1];
  document.getElementById('atomInfo').innerHTML=
    `<b>${he}</b> (${sym}) · מספר אטומי <b>${Z}</b><br>`+
    `🔴 בגרעין: ${Z} פרוטונים · 🔵 ${Z} אלקטרונים<br>`+
    `קליפות אלקטרונים: <b>${sh.join(' · ')}</b><br>`+
    `אלקטרונים בקליפה החיצונית (ערכיות): <b>${valence}</b>`;
  document.getElementById('atomView').classList.add('open');
}
document.getElementById('atomClose').onclick=()=>document.getElementById('atomView').classList.remove('open');

/* ===== כפתורים ===== */
document.getElementById('btnHeat').onclick=()=>setCurrent('heat');
document.getElementById('btnCool').onclick=()=>setCurrent('cool');
document.getElementById('btnInspect').onclick=()=>setCurrent('inspect');
document.getElementById('btnClear').onclick=()=>{ grid.fill(0); life.fill(0); aux.fill(0); pha.fill(0); temp.fill(AMB); velX.fill(0); velY.fill(0); held=null; toast('נוקה'); };
const pauseBtn=document.getElementById('btnPause');
pauseBtn.onclick=()=>{ paused=!paused; pauseBtn.textContent=paused?'▶️':'⏸️'; };
document.getElementById('btnSave').onclick=()=>save(true);
document.getElementById('brush').oninput=e=>brush=+e.target.value;

document.getElementById('btnHand').onclick=()=>setCurrent('hand');
document.getElementById('deg').oninput=e=>{ heatStep=+e.target.value; document.getElementById('degVal').textContent=heatStep+'°'; };

/* ===== שמירה/טעינה ===== */
const KEY='sandbox_v3';
function save(msg){
  try{
    localStorage.setItem(KEY, JSON.stringify({ W,H, grid:Array.from(grid), found:Array.from(found), score, mi }));
    if(msg) toast('💾 נשמר');
  }catch(e){ if(msg) toast('שגיאה בשמירה'); }
}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return;
    const d=JSON.parse(raw);
    if(d.W===W && d.H===H && d.grid) grid.set(d.grid);
    if(d.found) d.found.forEach((v,ix)=>{ if(v) found[ix]=1; });
    foundCount=found.reduce((a,b)=>a+b,0);
    score=d.score||0; mi=d.mi||0;
    life.fill(0); aux.fill(0); temp.fill(AMB); pha.fill(0);
  }catch(e){}
}
setInterval(()=>{ save(false); }, 10000);

/* ===== הודעות ===== */
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1300);
}

/* ===== לולאה (עם בקרת מהירות) ===== */
let last=performance.now(), fr=0, ft=0, acc=0;
function loop(now){
  const dt=now-last; last=now;
  if(!paused){ acc+=speed; let n=0; while(acc>=1 && n<3){ step(); acc--; n++; } }
  if(painting) paintAt(ptx,pty);   // החזקה רציפה: ממשיך למרוח/לחמם/לקרר כמו ברז
  render();
  fr++; ft+=dt;
  if(ft>=500){ document.getElementById('fps').textContent=Math.round(fr*1000/ft)+' fps'; fr=0; ft=0; }
  requestAnimationFrame(loop);
}

/* ===== התחלה ===== */
function boot(){
  setup(); load();
  buildPalette(); buildPedia(); updateScore(); showMission(); refreshActive(); updateSliders();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', ()=>{ save(false); setup(); load(); buildPalette(); });
boot();
</script>
