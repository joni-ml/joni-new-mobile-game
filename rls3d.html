const flame = buildMesh(flameProg, flameMesh, false);

/* סיבוב סביב ציר אנכי. בלי זה זרוע מלחציים יכולה לצאת רק לאורך ציר X,
   וזה בדיוק למה הלסתות עצרו ליד המעמד במקום להגיע לזכוכית. */
function rotY(m,a,cx=0,cz=0){
  const c=Math.cos(a), s=Math.sin(a);
  const pos=new Float32Array(m.pos), nrm=new Float32Array(m.nrm);
  for (let i=0;i<pos.length;i+=3){
    const x=pos[i]-cx, z=pos[i+2]-cz;
    pos[i]=cx+x*c-z*s; pos[i+2]=cz+x*s+z*c;
    const nx=nrm[i], nz=nrm[i+2];
    nrm[i]=nx*c-nz*s; nrm[i+2]=nx*s+nz*c;
  }
  return { pos, nrm, idx:m.idx, col:m.col };
}

/* זרוע שנסגרת על משהו. מקבלת את הנקודה שצריך לאחוז בה ואת רדיוס
   הגוף שם, ומכוונת את עצמה אליה — כולל הלסתות שמתפצלות סביבו. */
function clampTo(rodX, rodZ, target, gripR){
  const dx=target[0]-rodX, dz=target[2]-rodZ;
  const ang=Math.atan2(dz,dx), len=Math.hypot(dx,dz);
  const pad=gripR+0.055;                    /* מרכז הפקק נוגע בזכוכית */
  const parts=[
    colored(box(0.11,0.14,0.11, 0,0,0), IRON),                      /* ראש */
    colored(box(len-0.08,0.048,0.048, (len-0.08)/2+0.04,0,0), ALLOY),
    colored(box(0.10,0.05, pad*2+0.10, len-0.10,  0.085, 0), IRON),  /* לסת עליונה */
    colored(box(0.10,0.05, pad*2+0.10, len-0.10, -0.085, 0), IRON),  /* לסת תחתונה */
    colored(cyl(0.055,-0.085,0.085, len-0.05,  pad, 10), CORK),
    colored(cyl(0.055,-0.085,0.085, len-0.05, -pad, 10), CORK),
  ];
  return place(rotY(merge(...parts), ang), rodX, target[1], rodZ);
}

function stands(){
  const p=[];
  const rig=(bx,bz,rodH,grips)=>{
    p.push(colored(box(0.82,0.052,0.62, bx,BENCH_Y+0.026,bz), IRON));
    p.push(colored(cyl(0.040,BENCH_Y+0.05,rodH, bx,bz,14), ALLOY));
    for (const [t,gr] of grips) p.push(clampTo(bx,bz,t,gr));
  };
  /* שמאל אוחז את צוואר הבקבוק. הבסיס מפנה מקום לחצובה שמתחת לבקבוק. */
  rig(-1.62, 0.0, 2.62, [[[0, 2.16, 0], 0.21]]);
  /* ימין אוחז את המעבה בשתי נקודות. הבסיס נסוג ב-z כדי לא להתנגש
     בכוס, ולכן הזרועות מגיעות באלכסון — מה שהן עושות גם במציאות. */
  const HR=0.46;
  rig(3.16, -1.34, 3.62, [
    [[BEAKER_X, 3.20, -HR], 0.135],
    [[BEAKER_X, 2.65, -HR], 0.135],
  ]);
  return merge(...p);
}
const rigMesh = buildMesh(solidProg, stands(), false);

const shiftX = (m,dx)=>{ for(let i=0;i<m.pos.length;i+=3) m.pos[i]+=dx; return m; };
const GLASS = [
  /* לבקבוק תחתית עגולה אין מדים — לא במציאות ולא כאן. על בועה
     כדורית קו בגובה קבוע מתעקל ונראה כמו צלע, לא כמו סימון. */
  { mesh:buildMesh(glassProg, hollow(flaskProfile(), 0.024)), ox:0,
    mark:[0,0,1,0], axis:0, glow:true },
  { mesh:buildMesh(glassProg, shiftX(hollow(beakerProfile(), 0.028), BEAKER_X)),
    ox:BEAKER_X, mark:[0.20,1.30,0.11,1], axis:BEAKER_X, markAng:0.45, glow:false },
  /* הצינור חלול גם הוא, ובלי מדים — אף אחד לא מודד נפח בצינור מעבה */
  { mesh:buildMesh(glassProg, merge(tubeMesh(PATH,0.135),
                                    flipNormals(tubeMesh(PATH,0.112)))), ox:1.4,
    mark:[0,0,1,0], axis:0, glow:false },
];

/* ===========================================================================
   5) העולם
   =========================================================================== */
const MAX = NMOL + 1400;
const IN_FLASK=0, IN_TUBE=1, IN_BEAKER=2;
const GAS=0, LIQ=1, SOL=2;

const mol = {
  n:0, sp:new Array(MAX),
  x:new Float32Array(MAX), y:new Float32Array(MAX), z:new Float32Array(MAX),
  vx:new Float32Array(MAX), vy:new Float32Array(MAX), vz:new Float32Array(MAX),
  spin:new Float32Array(MAX), axis:new Float32Array(MAX*3),
  where:new Uint8Array(MAX), t:new Float32Array(MAX),
  phase:new Uint8Array(MAX), rho:new Float32Array(MAX), around:new Float32Array(MAX),
};

function spawn(sp,x,y,z,where=IN_FLASK){
  if (mol.n>=MAX) return -1;
  const i=mol.n++;
  mol.sp[i]=sp; mol.x[i]=x; mol.y[i]=y; mol.z[i]=z;
  mol.vx[i]=rand(-.3,.3); mol.vy[i]=rand(-.3,.3); mol.vz[i]=rand(-.3,.3);
  mol.spin[i]=rand(0,6.28);
  const a=v3.norm([rand(-1,1),rand(-1,1),rand(-1,1)]);
  mol.axis[i*3]=a[0]; mol.axis[i*3+1]=a[1]; mol.axis[i*3+2]=a[2];
  mol.where[i]=where; mol.t[i]=0; mol.phase[i]=LIQ; mol.around[i]=0;
  return i;
}
function kill(i){
  const j=--mol.n;
  if (i!==j){
    for (const k of ['sp','x','y','z','vx','vy','vz','spin','where','t','phase','rho','around']) mol[k][i]=mol[k][j];
    for (let c=0;c<3;c++) mol.axis[i*3+c]=mol.axis[j*3+c];
  }
}

const FLASK_R=0.86, FLASK_CY=0.90, NECK_R=0.17, NECK_TOP=2.40;
function flaskRadiusAt(y){
  if (y>=1.95) return NECK_R;
  if (y<=1.62){ const d=y-FLASK_CY; return Math.sqrt(Math.max(0,FLASK_R*FLASK_R-d*d)); }
  const u=(y-1.62)/0.33;
  return 0.52*(1-u)+NECK_R*u;
}

let heat=20, paused=false;
const AMBIENT=20;
function tempAt(where){
  if (where===IN_FLASK) return heat;
  if (where===IN_BEAKER) return AMBIENT + Math.max(0,heat-AMBIENT)*0.04;
  return AMBIENT + Math.max(0,heat-AMBIENT)*0.12;
}

/* מצב הצבירה נגזר מהטמפרטורה בלבד. אין "קרח" ו"אדים" כחומרים נפרדים.
   אבל המעבר לוקח זמן: מולקולה בודדת הופכת לגז בהסתברות שגדלה עם החום,
   ולא כולן יחד ברגע שעוברים 100°. עם סף חד כל הנוזל נעלם בפריים אחד
   ואין שום דבר לראות — לא בעבוע, לא אדים, רק כלי שהתרוקן. */
function updatePhase(i, dt){
  const S=SPECIES[mol.sp[i]], T=tempAt(mol.where[i]);
  const ph=mol.phase[i];
  if (ph===SOL){ if (T > S.melt) mol.phase[i]=LIQ; return; }
  if (ph===LIQ){
    if (T < S.melt){ mol.phase[i]=SOL; return; }
    if (T > S.boil){
      /* בועות נולדות בתחתית, ליד הלהבה — ומשם עולות */
      const depth = clamp((0.95 - mol.y[i]) / 0.95, 0, 1);
      if (Math.random() < (T-S.boil) * 0.0008 * (0.3 + depth*1.5) * dt) mol.phase[i]=GAS;
    }
    return;
  }
  if (T < S.boil && Math.random() < (0.7 + (S.boil-T)*0.02) * dt) mol.phase[i]=LIQ;
}
const densityOf = i => mol.phase[i]===GAS ? SPECIES[mol.sp[i]].gasRho : SPECIES[mol.sp[i]].liq;

/* ---- שכנים: דחייה, לכידות, וצפיפות מקומית ----
   רשת שטוחה עם מיון מנייה. הגרסה הקודמת השתמשה ב-Map, וזה יצא כתשעים
   אלף חיפושים בכל צעד — שלושה רבעים מכל זמן הפיזיקה. כאן הכל אינדוקס
   ישיר במערכים מוקצים מראש, בלי גיבוב ובלי הקצאה בכלל. */
let STIFF=1.0, COH_L=4, COH_S=12, ITERS=3;
const RANGE = 0.25/MSCALE, RANGE2 = RANGE*RANGE;
const CELL = 0.26/MSCALE;

const GX0=-1.5, GY0=-0.35, GZ0=-1.2;
const GNX=Math.ceil(4.6/CELL), GNY=Math.ceil(3.1/CELL), GNZ=Math.ceil(2.4/CELL);
const NCELL=GNX*GNY*GNZ;
const cellStart =new Int32Array(NCELL+1);
const cellCursor=new Int32Array(NCELL);
const cellOfMol =new Int32Array(MAX);
const order     =new Int32Array(MAX);
const gi=(v,lo,n)=>{ const k=((v-lo)/CELL)|0; return k<0?0:k>=n?n-1:k; };

let pairs = new Int32Array(1 << 16), nPairs = 0;

function buildPairs(){
  cellStart.fill(0);
  for (let i=0;i<mol.n;i++){
    mol.rho[i]=0; mol.around[i]=0;
    if (mol.where[i]===IN_TUBE){ cellOfMol[i]=-1; continue; }
    const c=(gi(mol.z[i],GZ0,GNZ)*GNY + gi(mol.y[i],GY0,GNY))*GNX + gi(mol.x[i],GX0,GNX);
    cellOfMol[i]=c; cellStart[c+1]++;
  }
  for (let c=0;c<NCELL;c++) cellStart[c+1]+=cellStart[c];
  cellCursor.set(cellStart.subarray(0,NCELL));
  for (let i=0;i<mol.n;i++){
    const c=cellOfMol[i];
    if (c>=0) order[cellCursor[c]++]=i;
  }

  nPairs=0;
  for (let i=0;i<mol.n;i++){
    const c=cellOfMol[i];
    if (c<0) continue;
    const cx=c%GNX, cy=((c/GNX)|0)%GNY, cz=(c/(GNX*GNY))|0;
    const xi=mol.x[i], yi=mol.y[i], zi=mol.z[i];
    for (let dz=-1;dz<=1;dz++){
      const z=cz+dz; if (z<0||z>=GNZ) continue;
      for (let dy=-1;dy<=1;dy++){
        const y=cy+dy; if (y<0||y>=GNY) continue;
        const row=(z*GNY+y)*GNX;
        const lo=cx>0?cx-1:0, hi=cx<GNX-1?cx+1:GNX-1;
        const q0=cellStart[row+lo], q1=cellStart[row+hi+1];
        for (let q=q0;q<q1;q++){
          const j=order[q];
          if (j<=i) continue;
          const ex=xi-mol.x[j], ey=yi-mol.y[j], ez=zi-mol.z[j];
          if (ex*ex+ey*ey+ez*ez > RANGE2) continue;
          if (nPairs*2+2 > pairs.length){
            const g=new Int32Array(pairs.length*2); g.set(pairs); pairs=g;
          }
          pairs[nPairs*2]=i; pairs[nPairs*2+1]=j; nPairs++;
        }
      }
    }
  }
}

const R0=0.155/MSCALE;
function separate(){
  for (let k=0;k<nPairs;k++){
    const i=pairs[k*2], j=pairs[k*2+1];
    const ex=mol.x[i]-mol.x[j], ey=mol.y[i]-mol.y[j], ez=mol.z[i]-mol.z[j];
    let d=Math.sqrt(ex*ex+ey*ey+ez*ez), ux,uy,uz;
    if (d<1e-6){                    /* בדיוק באותה נקודה — אין כיוון להיפרד
                                       אליו, ובלי דחיפה אקראית הן נתקעות */
      ux=Math.random()-.5; uy=Math.random()-.5; uz=Math.random()-.5;
      const l=Math.hypot(ux,uy,uz)||1; ux/=l; uy/=l; uz/=l; d=0;
    } else if (d<R0){ ux=ex/d; uy=ey/d; uz=ez/d; }
    else continue;
    const push=(R0-d)*0.5*STIFF;
    mol.x[i]+=ux*push; mol.y[i]+=uy*push; mol.z[i]+=uz*push;
    mol.x[j]-=ux*push; mol.y[j]-=uy*push; mol.z[j]-=uz*push;
    const rel=((mol.vx[i]-mol.vx[j])*ux+(mol.vy[i]-mol.vy[j])*uy+(mol.vz[i]-mol.vz[j])*uz)*0.16;
    mol.vx[i]-=ux*rel; mol.vy[i]-=uy*rel; mol.vz[i]-=uz*rel;
    mol.vx[j]+=ux*rel; mol.vy[j]+=uy*rel; mol.vz[j]+=uz*rel;
  }
}

/* צילום מיקומים לפני הפתרון, כדי שאפשר יהיה לגזור ממנו מהירות */
const px=new Float32Array(MAX), py=new Float32Array(MAX), pz=new Float32Array(MAX);

function neighbours(dt){
  buildPairs();
  for (let i=0;i<mol.n;i++){ px[i]=mol.x[i]; py[i]=mol.y[i]; pz[i]=mol.z[i]; }
  for (let it=0;it<ITERS;it++) separate();

  /* המהירות חייבת ללמוד על התיקון. בלי זה מולקולה שנחה על הערימה
     נדחפת למעלה במיקום אבל ממשיכה לצבור מהירות כלפי מטה — הפיזיקה
     צוברת אנרגיה עד שהנוזל רותח בלי חום. */
  const inv=1/dt;
  for (let i=0;i<mol.n;i++){
    if (mol.where[i]===IN_TUBE) continue;
    let cx=(mol.x[i]-px[i])*inv, cy=(mol.y[i]-py[i])*inv, cz=(mol.z[i]-pz[i])*inv;
    const l=Math.hypot(cx,cy,cz);
    if (l>6){ const s=6/l; cx*=s; cy*=s; cz*=s; }
    mol.vx[i]=mol.vx[i]*0.55+cx*0.45;
    mol.vy[i]=mol.vy[i]*0.55+cy*0.45;
    mol.vz[i]=mol.vz[i]*0.55+cz*0.45;
  }

  /* צפיפות מקומית ולכידות — מעבר אחד, אחרי שהמיקומים התייצבו */
  for (let k=0;k<nPairs;k++){
    const i=pairs[k*2], j=pairs[k*2+1];
    const ex=mol.x[i]-mol.x[j], ey=mol.y[i]-mol.y[j], ez=mol.z[i]-mol.z[j];
    const d=Math.sqrt(ex*ex+ey*ey+ez*ez);
    if (d<1e-6) continue;
    mol.rho[i]+=densityOf(j); mol.around[i]++;
    mol.rho[j]+=densityOf(i); mol.around[j]++;
    if (d<=R0 || mol.phase[i]===GAS || mol.phase[j]===GAS) continue;
    const f=-(d-R0)/R0*(mol.phase[i]===SOL?COH_S:COH_L)*dt;
    const nx=ex/d*f, ny=ey/d*f, nz=ez/d*f;
    mol.vx[i]+=nx; mol.vy[i]+=ny; mol.vz[i]+=nz;
    mol.vx[j]-=nx; mol.vy[j]-=ny; mol.vz[j]-=nz;
  }
}

const IGNITION=560;
let flash=0;

function react(){
  if (heat<IGNITION && flash<=0) return;
  const h=[],o=[];
  for (let i=0;i<mol.n;i++){
    if (mol.where[i]===IN_TUBE) continue;
    if (mol.sp[i]==='H2') h.push(i); else if (mol.sp[i]==='O2') o.push(i);
  }
  let made=0;
  for (const oi of o){
    if (h.length<2 || made>6) break;
    const near=[];
    for (const hi of h){
      if (Math.hypot(mol.x[hi]-mol.x[oi],mol.y[hi]-mol.y[oi],mol.z[hi]-mol.z[oi])<2.2*R0) near.push(hi);
      if (near.length===2) break;
    }
    if (near.length<2) continue;
    /* שני H₂ הופכים לשני H₂O, וה-O₂ נבלע. ארבעה H ושני O — לפני ואחרי. */
    for (const hi of near){ mol.sp[hi]='H2O'; mol.vy[hi]+=rand(1.5,3.4); }
    h.splice(h.indexOf(near[0]),1);
    h.splice(h.indexOf(near[1]),1);
    kill(oi);
    made++; flash=0.45;
    heat=Math.min(1200,heat+55);
  }
  if (made) syncHeat();
}

function step(dt){
  neighbours(dt);
  for (let i=0;i<mol.n;i++){
    const S=SPECIES[mol.sp[i]];
    updatePhase(i, dt);
    const ph=mol.phase[i], T=tempAt(mol.where[i]);
    mol.spin[i]+=dt*(ph===GAS?5:ph===LIQ?1.2:0.15);

    if (mol.where[i]===IN_TUBE){
      mol.t[i]+=dt*(ph===GAS?0.46:0.26);
      if (mol.t[i]>=1){
        mol.where[i]=IN_BEAKER;
        const e=PATH[PATH.length-1];
        mol.x[i]=e[0]+rand(-.05,.05); mol.y[i]=e[1]; mol.z[i]=e[2]+rand(-.05,.05);
        mol.vx[i]=0; mol.vy[i]=-1.2; mol.vz[i]=0;
      } else {
        const p=PATH[Math.min(PATH.length-1,(mol.t[i]*(PATH.length-1))|0)];
        mol.x[i]=p[0]; mol.y[i]=p[1]; mol.z[i]=p[2];
      }
      continue;
    }

    /* כובד וציפה בצעד אחד: מה שדוחף גוף למעלה או למטה הוא ההפרש בין
       הצפיפות שלו לצפיפות של מה שמקיף אותו. גז בתוך נוזל עולה חזק,
       נוזל כבד בתוך נוזל קל שוקע, ושני גזים נפרדים לשכבות לפי משקל. */
    const mine=densityOf(i);
    const amb = mol.around[i]>2 ? mol.rho[i]/mol.around[i] : mine;
    const lift = clamp((amb-mine)/Math.max(mine,1e-4), -6, 6);
    /* על גז הכובד כמעט לא משפיע בקנה המידה הזה, ומעל נוזל רותח יש זרם
       עולה. בלי זה אדים בתוך אדים לא מרגישים שום הפרש צפיפות ופשוט
       יושבים בבועה — הזיקוק נעצר לפני שהוא מגיע לצוואר. */
    const G = ph===GAS ? 0.8 : 5.2;
    const conv = ph===GAS ? clamp((T-S.boil)/150,0,1) * 5.2 : 0;
    mol.vy[i] += (-G + G*lift + conv) * dt;

    const therm = ph===GAS ? clamp((T-S.boil)/260,0.25,3.2) : ph===LIQ ? 0.16 : 0.02;
    mol.vx[i]+=rand(-1,1)*therm*dt*9;
    mol.vy[i]+=rand(-1,1)*therm*dt*9;
    mol.vz[i]+=rand(-1,1)*therm*dt*9;

    const k=Math.exp(-(ph===GAS?0.55:ph===LIQ?3.4:11.0)*dt);
    mol.vx[i]*=k; mol.vy[i]*=k; mol.vz[i]*=k;
    mol.x[i]+=mol.vx[i]*dt; mol.y[i]+=mol.vy[i]*dt; mol.z[i]+=mol.vz[i]*dt;

    if (mol.where[i]===IN_FLASK){
      if (ph===GAS && mol.y[i]>NECK_TOP-0.04 && Math.hypot(mol.x[i],mol.z[i])<NECK_R){
        mol.where[i]=IN_TUBE; mol.t[i]=0; continue;
      }
      const maxR=flaskRadiusAt(mol.y[i])-0.06, r=Math.hypot(mol.x[i],mol.z[i]);
      if (r>maxR && r>1e-6){ const s=maxR/r; mol.x[i]*=s; mol.z[i]*=s; mol.vx[i]*=-.35; mol.vz[i]*=-.35; }
      if (mol.y[i]>NECK_TOP-0.05){ mol.y[i]=NECK_TOP-0.05; mol.vy[i]*=-.3; }
      if (mol.y[i]<0.06){ mol.y[i]=0.06; mol.vy[i]*=-.25; }
    } else {
      const r=Math.hypot(mol.x[i]-BEAKER_X,mol.z[i]);
      if (r>0.60){ const s=0.60/r; mol.x[i]=BEAKER_X+(mol.x[i]-BEAKER_X)*s; mol.z[i]*=s;
                   mol.vx[i]*=-.35; mol.vz[i]*=-.35; }
      if (mol.y[i]>1.42){ mol.y[i]=1.42; mol.vy[i]*=-.3; }
      if (mol.y[i]<0.06){ mol.y[i]=0.06; mol.vy[i]*=-.25; }
    }
  }
  react();
  if (flash>0) flash-=dt;
  if (heat>AMBIENT) heat=Math.max(AMBIENT,heat-dt*6);
  else if (heat<AMBIENT) heat=Math.min(AMBIENT,heat+dt*4);
}

/* ===========================================================================
   6) מצלמה
   =========================================================================== */
const FOV=0.86;
const cam={ az:1.15, el:0.16, dist:7, target:[BOUNDS.cx,BOUNDS.cy,0], slice:0, zoom:1 };
/* לאן המצלמה צוללת כשמגדילים: לתוך הנוזל שבבקבוק. בלי זה הזום
   מתקרב למרכז המערכת, שהוא אוויר. */
const DIVE=[0, 0.40, 0];
const MAXZOOM=60;
function camTarget(){
  const t=clamp((1-cam.zoom)/0.80, 0, 1);
  return [BOUNDS.cx+(DIVE[0]-BOUNDS.cx)*t,
          BOUNDS.cy+(DIVE[1]-BOUNDS.cy)*t,
          DIVE[2]*t];
}
const SCENE_R=3.2;
const eyePos=()=>{
  const ce=Math.cos(cam.el);
  return [cam.target[0]+cam.dist*ce*Math.sin(cam.az),
          cam.target[1]+cam.dist*Math.sin(cam.el),
          cam.target[2]+cam.dist*ce*Math.cos(cam.az)];
};
function fitDistance(){
  const asp=(cv.clientWidth||1)/(cv.clientHeight||1);
  const halfV=Math.tan(FOV/2), halfH=halfV*asp;
  const ce=Math.cos(cam.el), se=Math.sin(cam.el);
  const sa=Math.sin(cam.az), ca=Math.cos(cam.az);
  const f=[-ce*sa,-se,-ce*ca], r=[ca,0,-sa], u=v3.cross(r,f);
  let d=0;
  for (const sx of [-1,1]) for (const sy of [-1,1]) for (const sz of [-1,1]){
    const c=[sx*BOUNDS.hx, sy*BOUNDS.hy, sz*BOUNDS.hz];
    const need=Math.max(Math.abs(v3.dot(c,r))/halfH, Math.abs(v3.dot(c,u))/halfV) - v3.dot(c,f);
    if (need>d) d=need;
  }
  return d*1.04;
}

let touches=new Map(), pinch0=0, slice0=0, last2=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (touches.size===2){
    const [a,b]=[...touches.values()];
    pinch0=Math.hypot(a.x-b.x,a.y-b.y); slice0=cam.zoom;
    last2={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }
});
cv.addEventListener('pointermove',e=>{
  const p=touches.get(e.pointerId); if(!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if (touches.size>=2){
    const [a,b]=[...touches.values()];
    const d=Math.max(Math.hypot(a.x-b.x,a.y-b.y), 1);
    cam.zoom=clamp(slice0*(pinch0/d), 1/MAXZOOM, 1.15);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if (last2){ cam.az-=(mid.x-last2.x)*0.008; cam.el=clamp(cam.el+(mid.y-last2.y)*0.006,-0.55,1.25); }
    last2=mid; syncZoom();
  }
});
const release=e=>{ touches.delete(e.pointerId); if (touches.size<2) last2=null; };
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);

let mdown=false,mx=0,my=0;
cv.addEventListener('mousedown',e=>{mdown=true;mx=e.clientX;my=e.clientY;});
addEventListener('mouseup',()=>mdown=false);
addEventListener('mousemove',e=>{
  if(!mdown) return;
  cam.az-=(e.clientX-mx)*0.008; cam.el=clamp(cam.el+(e.clientY-my)*0.006,-0.55,1.25);
  mx=e.clientX; my=e.clientY;
});
cv.addEventListener('wheel',e=>{ e.preventDefault();
  cam.zoom=clamp(cam.zoom*Math.exp(e.deltaY*0.0016), 1/MAXZOOM, 1.15); syncZoom();
},{passive:false});
cv.addEventListener('click',e=>{
  if (touches.size>1) return;
  addMolecules(picked, Math.round(26*MSCALE*MSCALE*MSCALE), e.clientX/innerWidth>0.56 ? IN_BEAKER : IN_FLASK);
});

/* ===========================================================================
   7) ציור
   =========================================================================== */
let W=0,H=0,FW=0,FH=0,SAMPLES=1;
let msFBO,msColor,msDepth;          /* כל הגאומטריה נכנסת לכאן, עם MSAA */
let sceneTex,sceneFBO;              /* אותה תמונה אחרי פתירה, כדי שהנוזל ידגום אותה */
let fdTex,fdRB,fdFBO, b1Tex,b1FBO, thTex,thFBO;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.75);
  const w=Math.max(1,(cv.clientWidth*dpr)|0), h=Math.max(1,(cv.clientHeight*dpr)|0);
  if (w===W && h===H) return;
  W=w; H=h; cv.width=w; cv.height=h;
  FW=Math.max(1,W>>1); FH=Math.max(1,H>>1);   /* הנוזל בחצי רזולוציה — הטשטוש מסתיר את זה */
  SAMPLES=Math.min(4, gl.getParameter(gl.MAX_SAMPLES)||1);

  for (const t of [sceneTex,fdTex,b1Tex,thTex]) if (t) gl.deleteTexture(t);
  for (const f of [msFBO,sceneFBO,fdFBO,b1FBO,thFBO]) if (f) gl.deleteFramebuffer(f);
  for (const r of [msColor,msDepth,fdRB]) if (r) gl.deleteRenderbuffer(r);

  const rb=(w,h,fmt,samples)=>{
    const r=gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER,r);
    if (samples>1) gl.renderbufferStorageMultisample(gl.RENDERBUFFER,samples,fmt,w,h);
    else gl.renderbufferStorage(gl.RENDERBUFFER,fmt,w,h);
    return r;
  };

  msColor=rb(W,H,gl.RGBA8,SAMPLES);
  msDepth=rb(W,H,gl.DEPTH_COMPONENT24,SAMPLES);
  msFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,msColor);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,msDepth);

  sceneTex=makeTex(W,H,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR);
  sceneFBO=makeFBO(sceneTex,null);

  if (FLOAT_FBO){
    fdRB =rb(FW,FH,gl.DEPTH_COMPONENT24,1);
    fdTex=makeTex(FW,FH,gl.R16F,gl.RED,gl.HALF_FLOAT,gl.LINEAR);
    b1Tex=makeTex(FW,FH,gl.R16F,gl.RED,gl.HALF_FLOAT,gl.LINEAR);
    thTex=makeTex(FW,FH,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,gl.LINEAR);
    fdFBO=makeFBO(fdTex,fdRB); b1FBO=makeFBO(b1Tex,null); thFBO=makeFBO(thTex,null);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

/* ---- מפת הצללים ----
   מקרינים את הסצנה מכיוון האור לתוך מפת עומק, ואז כל שיידר בודק מולה
   אם הנקודה שלו רואה את האור. אור מכיוון קבוע, ולכן הטלה אורתוגונלית. */
const SHADOW_SIZE = 1600;
let shadowTex, shadowFBO, LVP;

function initShadow(){
  shadowTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,shadowTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,SHADOW_SIZE,SHADOW_SIZE,0,
                gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
  /* השוואה בחומרה: הדגימה מחזירה כמה מארבעת הטקסלים עברו את המבחן,
     כלומר PCF דו-לינארי בחינם */
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  shadowFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shadowTex,0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  const ortho=(hw,hh,n,f)=>new Float32Array([
    1/hw,0,0,0, 0,1/hh,0,0, 0,0,-2/(f-n),0, 0,0,-(f+n)/(f-n),1]);
  const L=v3.norm([0.38,0.86,0.34]), C=[0.9,0.35,-0.9];
  LVP=m4.mul(ortho(5.2,5.2,0.1,26), m4.lookAt(v3.add(C,v3.scale(L,13)), C, [0,1,0]));
}

function renderShadow(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFBO);
  gl.viewport(0,0,SHADOW_SIZE,SHADOW_SIZE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  /* מטילים רק פאות אחוריות: הצל נדחף לצד הרחוק של הגוף ואקנה נעלמת */
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
  gl.useProgram(shadowProg);
  gl.uniformMatrix4fv(shadowProg.u.uLVP,false,LVP);
  for (const m of [bench, props, rigMesh, burner, jack]){
    gl.bindVertexArray(m.vao);
    gl.drawElements(gl.TRIANGLES,m.n,m.type,0);
  }
  gl.disable(gl.CULL_FACE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function bindShadow(prog){
  gl.uniformMatrix4fv(prog.u.uLVP,false,LVP);
  gl.uniform1f(prog.u.uSTexel,1/SHADOW_SIZE);
  gl.uniform1i(prog.u.uShadow,7);
  gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D,shadowTex);
  gl.activeTexture(gl.TEXTURE0);
}

/* MSAA → דגימה בודדת. זו ההעתקה היחידה שמותרת מחוצץ מרובה־דגימות. */
function resolveTo(dstFBO){
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,dstFBO);
  gl.blitFramebuffer(0,0,W,H, 0,0,W,H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);
}

const inst={ off:new Float32Array(MAX*3*3), col:new Float32Array(MAX*3*3),
             rad:new Float32Array(MAX*3),   kind:new Float32Array(MAX*3) };

function buildAtoms(){
  let k=0;
  for (let i=0;i<mol.n;i++){
    const S=SPECIES[mol.sp[i]];
    const a=mol.spin[i], c=Math.cos(a), s=Math.sin(a);
    const ax=mol.axis[i*3], ay=mol.axis[i*3+1], az=mol.axis[i*3+2];
    for (const [el,off] of S.atoms){
      const E=ELEM[el], [ox,oy,oz]=off;
      const dt=ax*ox+ay*oy+az*oz;
      const cx=ay*oz-az*oy, cy=az*ox-ax*oz, cz=ax*oy-ay*ox;
      inst.off[k*3]  =mol.x[i]+ox*c+cx*s+ax*dt*(1-c);
      inst.off[k*3+1]=mol.y[i]+oy*c+cy*s+ay*dt*(1-c);
      inst.off[k*3+2]=mol.z[i]+oz*c+cz*s+az*dt*(1-c);
      const g = flash>0 && mol.sp[i]==='H2O' ? flash*1.6 : 0;
      inst.col[k*3]  =Math.min(1,E.col[0]+g);
      inst.col[k*3+1]=Math.min(1,E.col[1]+g*.8);
      inst.col[k*3+2]=Math.min(1,E.col[2]+g*.5);
      inst.rad[k]=E.r;
      k++;
    }
  }
  return k;
}
function buildBlobs(){
  let k=0;
  for (let i=0;i<mol.n;i++){
    const S=SPECIES[mol.sp[i]];
    inst.off[k*3]=mol.x[i]; inst.off[k*3+1]=mol.y[i]; inst.off[k*3+2]=mol.z[i];
    const gas=mol.phase[i]===GAS;
    /* אדים לא נושאים את צבע הבליעה של החומר — הם ערפל לבן */
    if (gas){ inst.col[k*3]=0.10; inst.col[k*3+1]=0.11; inst.col[k*3+2]=0.125; }
    else { inst.col[k*3]=S.absorb[0]; inst.col[k*3+1]=S.absorb[1]; inst.col[k*3+2]=S.absorb[2]; }
    inst.rad[k]=(gas?0.20:0.135)/MSCALE;         /* אדים מתפרשים רחב יותר */
    inst.kind[k]=gas?0:1;
    k++;
  }
  return k;
}
function upload(mesh,n,withKind){
  gl.bindVertexArray(mesh.vao);
  const put=(name,arr,size)=>{
    if (!mesh.inst[name]) return;
    gl.bindBuffer(gl.ARRAY_BUFFER,mesh.inst[name]);
    gl.bufferData(gl.ARRAY_BUFFER,arr.subarray(0,n*size),gl.DYNAMIC_DRAW);
  };
  put('aOff',inst.off,3); put('aCol',inst.col,3); put('aRad',inst.rad,1);
  if (withKind) put('aKind',inst.kind,1);
}

let realView = FLOAT_FBO, wantReal = FLOAT_FBO;
/* מעבר ×5 המצלמה כבר בתוך הנוזל. שם אין פני שטח לשקף, ומה שכן יש
   לראות הוא המולקולות עצמן — אז המצג מתחלף לבד. זו כל הנקודה בזום. */
const MICRO = 0.20;

function draw(){
  resize();
  const micro = cam.zoom < MICRO;
  realView = micro ? false : (wantReal && FLOAT_FBO);
  $('view').textContent = realView ? '👁 אמיתי' : (micro ? '⚛ מיקרוסקופ' : '⚛ מולקולות');
  $('view').classList.toggle('on', realView);
  /* האור והריהוט לא זזים לעולם, ולכן מפת הצללים נכונה לתמיד.
     ציור מחדש שלה בכל פריים הוא מעבר שלם על 1600² בלי שום סיבה. */
  if (!shadowFBO){ initShadow(); renderShadow(); }
  const want=fitDistance()*cam.zoom;
  cam.dist = cam.dist>0 ? cam.dist+(want-cam.dist)*0.16 : want;
  const tw=camTarget();
  for (let i=0;i<3;i++) cam.target[i]+=(tw[i]-cam.target[i])*0.16;

  const eye=eyePos();
  const asp=W/H;
  /* המישור הקרוב חייב להתכווץ עם הזום, אחרת בהגדלה עמוקה הוא חותך
     את מה שבאנו לראות */
  const proj=m4.perspective(FOV,asp,Math.max(0.0015,cam.dist*0.012),60);
  const view=m4.lookAt(eye,cam.target,[0,1,0]);
  const VP=m4.mul(proj,view);

  const fwd=v3.norm(v3.sub(cam.target,eye));
  const pp=v3.add(cam.target,v3.scale(fwd,SCENE_R*(2*cam.slice-1)));
  const clip=[fwd[0],fwd[1],fwd[2],v3.dot(pp,fwd)];
  /* אותו מישור, במרחב המצלמה — שם חיים שיידרי הנוזל */
  const cvn=[ view[0]*clip[0]+view[4]*clip[1]+view[8]*clip[2],
              view[1]*clip[0]+view[5]*clip[1]+view[9]*clip[2],
              view[2]*clip[0]+view[6]*clip[1]+view[10]*clip[2] ];
  const cvd=clip[3] - (view[12]*clip[0]+view[13]*clip[1]+view[14]*clip[2]);

  /* --- 1. החדר והשולחן --- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.viewport(0,0,W,H);
  gl.clearColor(0.020,0.023,0.030,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);

  gl.useProgram(roomProg);
  gl.uniformMatrix4fv(roomProg.u.uVP,false,VP);
  gl.uniform4fv(roomProg.u.uClip,clip);
  bindShadow(roomProg);
  gl.bindVertexArray(room.vao);
  gl.drawElements(gl.TRIANGLES,room.n,room.type,0);

  gl.useProgram(woodProg);
  gl.uniformMatrix4fv(woodProg.u.uVP,false,VP);
  gl.uniform4fv(woodProg.u.uClip,clip);
  gl.uniform3fv(woodProg.u.uEye,eye);
  gl.uniform2f(woodProg.u.uOccA,0,0);
  gl.uniform2f(woodProg.u.uOccB,BEAKER_X,0);
  bindShadow(woodProg);
  gl.bindVertexArray(bench.vao);
  gl.drawElements(gl.TRIANGLES,bench.n,bench.type,0);

  gl.useProgram(solidProg);
  gl.uniformMatrix4fv(solidProg.u.uVP,false,VP);
  gl.uniform4fv(solidProg.u.uClip,clip);
  gl.uniform3fv(solidProg.u.uEye,eye);
  bindShadow(solidProg);
  gl.uniform1f(solidProg.u.uEmissive,0);
  for (const m of [props, rigMesh, jack]){
    gl.bindVertexArray(m.vao);
    gl.drawElements(gl.TRIANGLES,m.n,m.type,0);
  }
  /* הרשת והחצובה מאדימות מעל החום — ברזל מתחיל לזהור סביב 500° */
  gl.uniform1f(solidProg.u.uEmissive, clamp((heat-430)/620,0,1)*0.75);
  gl.uniform3f(solidProg.u.uEmCol, 1.0,0.26,0.05);
  gl.bindVertexArray(burner.vao);
  gl.drawElements(gl.TRIANGLES,burner.n,burner.type,0);
  gl.uniform1f(solidProg.u.uEmissive,0);

  let shown=0;

  if (realView && FLOAT_FBO){
    /* --- 2. פותרים את הרקע כדי שהנוזל יוכל לשבור אותו --- */
    resolveTo(sceneFBO);

    /* --- 3. עומק פני הנוזל --- */
    const n=buildBlobs(); shown=n;
    gl.bindFramebuffer(gl.FRAMEBUFFER,fdFBO);
    gl.viewport(0,0,FW,FH);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    gl.useProgram(fluidDepthProg);
    gl.uniformMatrix4fv(fluidDepthProg.u.uProj,false,proj);
    gl.uniformMatrix4fv(fluidDepthProg.u.uView,false,view);
    gl.uniform4f(fluidDepthProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
    upload(billboard,n,true);
    gl.drawElementsInstanced(gl.TRIANGLES,billboard.n,billboard.type,0,n);

    /* --- 3. טשטוש דו-צדדי: אלף כדורים → משטח אחד --- */
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(blurProg);
    gl.uniform1i(blurProg.u.uTex,0); gl.uniform1f(blurProg.u.uDepthFalloff,5.0);
    gl.activeTexture(gl.TEXTURE0);
    for (const [src,dst,dir] of [[fdTex,b1FBO,[1/FW,0]],[b1Tex,fdFBO,[0,1/FH]],
                                 [fdTex,b1FBO,[1.7/FW,0]],[b1Tex,fdFBO,[0,1.7/FH]]]){
      gl.bindFramebuffer(gl.FRAMEBUFFER,dst);
      gl.viewport(0,0,FW,FH);
      gl.bindTexture(gl.TEXTURE_2D,src);
      gl.uniform2f(blurProg.u.uDir,dir[0],dir[1]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }

    /* --- 4. עובי: כמה חומר יש בכל פיקסל, ובאיזה צבע --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER,thFBO);
    gl.viewport(0,0,FW,FH);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    gl.useProgram(fluidThickProg);
    gl.uniformMatrix4fv(fluidThickProg.u.uProj,false,proj);
    gl.uniformMatrix4fv(fluidThickProg.u.uView,false,view);
    gl.uniform4f(fluidThickProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
    upload(billboard2,n,true);
    gl.drawElementsInstanced(gl.TRIANGLES,billboard2.n,billboard2.type,0,n);
    gl.disable(gl.BLEND);

    /* --- 5. הרכבה חזרה לתוך חוצץ הגאומטריה. העומק שם נשאר שלם,
             ולכן הזכוכית שתצויר אחר כך עדיין תיחסם נכון על ידי השולחן. --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
    gl.viewport(0,0,W,H);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(compositeProg);
    const halfV=Math.tan(FOV/2);
    gl.uniform2f(compositeProg.u.uTan,halfV*asp,halfV);
    gl.uniform2f(compositeProg.u.uTexel,1/FW,1/FH);
    gl.uniform4fv(compositeProg.u.uClip,clip);
    const iv=m4.lookAt(eye,cam.target,[0,1,0]);
    gl.uniformMatrix4fv(compositeProg.u.uInvView,false,new Float32Array([
      iv[0],iv[4],iv[8],0, iv[1],iv[5],iv[9],0, iv[2],iv[6],iv[10],0, 0,0,0,1]));
    gl.uniform1i(compositeProg.u.uScene,0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
    gl.uniform1i(compositeProg.u.uDepth,1); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,fdTex);
    gl.uniform1i(compositeProg.u.uThick,2); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,thTex);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.activeTexture(gl.TEXTURE0);

    /* בועות ואדים, בחיבור מעל הנוזל שכבר הורכב */
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    gl.useProgram(bubbleProg);
    gl.uniformMatrix4fv(bubbleProg.u.uProj,false,proj);
    gl.uniformMatrix4fv(bubbleProg.u.uView,false,view);
    gl.uniform4f(bubbleProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
    gl.bindVertexArray(billboard2.vao);
    gl.drawElementsInstanced(gl.TRIANGLES,billboard2.n,billboard2.type,0,n);
    gl.disable(gl.BLEND); gl.depthMask(true);
  } else {
    /* מצג מולקולות: כל אטום ככדור */
    const n=buildAtoms(); shown=n;
    gl.useProgram(atomProg);
    gl.uniformMatrix4fv(atomProg.u.uVP,false,VP);
    gl.uniform3fv(atomProg.u.uEye,eye);
    gl.uniform4fv(atomProg.u.uClip,clip);
    upload(sphere,n,false);
    gl.drawElementsInstanced(gl.TRIANGLES,sphere.n,sphere.type,0,n);
  }

  /* --- הלהבה. חיבור, בלי כתיבה לעומק. --- */
  if (heat > 40){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    gl.useProgram(flameProg);
    gl.uniformMatrix4fv(flameProg.u.uVP,false,VP);
    gl.uniform4fv(flameProg.u.uClip,clip);
    gl.uniform1f(flameProg.u.uTime,performance.now()/1000);
    gl.uniform1f(flameProg.u.uY0,FLAME_Y0);
    gl.uniform1f(flameProg.u.uY1,FLAME_Y1);
    gl.uniform1f(flameProg.u.uOn, clamp((heat-40)/260,0,1));
    gl.bindVertexArray(flame.vao);
    gl.drawElements(gl.TRIANGLES,flame.n,flame.type,0);
    gl.depthMask(true); gl.disable(gl.BLEND);
  }

  /* --- 6. זכוכית מעל הכל --- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.viewport(0,0,W,H);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(glassProg);
  gl.uniformMatrix4fv(glassProg.u.uVP,false,VP);
  gl.uniform3fv(glassProg.u.uEye,eye);
  gl.uniform4fv(glassProg.u.uClip,clip);
  const sorted=[...GLASS].sort((a,b)=>
    Math.hypot(b.ox-eye[0],eye[2])-Math.hypot(a.ox-eye[0],eye[2]));
  for (const g of sorted){
    gl.uniform1f(glassProg.u.uGlow, g.glow?clamp((heat-320)/1500,0,0.30):0);
    gl.uniform1f(glassProg.u.uAxisX, g.axis);
    gl.uniform4fv(glassProg.u.uMark, g.mark);
    gl.uniform1f(glassProg.u.uMarkAng, g.markAng||0);
    gl.bindVertexArray(g.mesh.vao);
    gl.drawElements(gl.TRIANGLES,g.mesh.n,g.mesh.type,0);
  }
  gl.disable(gl.BLEND); gl.depthMask(true);

  /* --- 7. פותרים את ה-MSAA ומציגים --- */
  resolveTo(sceneFBO);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  gl.bindVertexArray(null);
  gl.useProgram(presentProg);
  gl.uniform1i(presentProg.u.uTex,0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.depthMask(true);
  return shown;
}

/* ===========================================================================
   8) הממשק
   =========================================================================== */
const PT=[['H',1,1,1],['He',2,1,18],
  ['Li',3,2,1],['Be',4,2,2],['B',5,2,13],['C',6,2,14],['N',7,2,15],
  ['O',8,2,16],['F',9,2,17],['Ne',10,2,18],
  ['Na',11,3,1],['Mg',12,3,2],['Al',13,3,13],['Si',14,3,14],['P',15,3,15],
  ['S',16,3,16],['Cl',17,3,17],['Ar',18,3,18],
  ['K',19,4,1],['Ca',20,4,2],['Fe',26,4,8],['Cu',29,4,11],['Zn',30,4,12],
  ['Ag',47,5,11],['Au',79,6,11]];
const LIVE={H:'H2', O:'O2'};
let picked='H2';
const $=id=>document.getElementById(id);

(function(){
  const slot=new Map();
  for (const [sym,z,p,g] of PT) slot.set(p*100+g,[sym,z]);
  const html=[];
  for (let p=1;p<=6;p++) for (let g=1;g<=18;g++){
    const e=slot.get(p*100+g);
    if (!e){ html.push('<div class="pt gap"></div>'); continue; }
    const [sym,z]=e, sp=LIVE[sym];
    if (!sp){ html.push('<div class="pt off"></div>'); continue; }
    const c=ELEM[sym].col.map(v=>Math.round(v*255)).join(',');
    html.push(`<button class="pt live" data-sp="${sp}" data-sym="${sym}"
      style="--c:rgb(${c})"><i>${z}</i>${sym}</button>`);
  }
  $('ptable').innerHTML=html.join('');
  $('ptable').addEventListener('click',e=>{
    const b=e.target.closest('button[data-sp]');
    if (b){ picked=b.dataset.sp; syncPick(); closeSheet(); }
  });
})();

function syncPick(){
  const S=SPECIES[picked];
  $('pickName').textContent=S.name;
  $('pickKey').textContent=S.key;
  $('pickDot').style.background='rgb('+ELEM[S.atoms[0][0]].col.map(v=>Math.round(v*255)).join(',')+')';
  for (const b of document.querySelectorAll('.pt.live')) b.classList.toggle('on', b.dataset.sp===picked);
}
function syncHeat(){ $('heat').value=Math.round(heat); $('heatLbl').textContent=Math.round(heat)+'°'; }
function syncCut(){
  $('cut').value=Math.round(cam.slice*100);
  $('cutLbl').textContent='חתך '+Math.round(cam.slice*100)+'%';
}
function syncZoom(){
  const k=1/cam.zoom;
  $('zoomBtn').textContent='🔍 ×'+(k<9.5?k.toFixed(1):Math.round(k));
}
function syncAtoms(){
  const c={H:0,O:0};
  for (let i=0;i<mol.n;i++) for (const [el,k] of Object.entries(SPECIES[mol.sp[i]].count)) c[el]+=k;
  $('atoms').innerHTML=Object.entries(c).map(([el,n])=>{
    const rgb=ELEM[el].col.map(v=>Math.round(v*255)).join(',');
    return `<b style="background:rgba(${rgb},.13);color:rgb(${rgb})">${n}<i>${el}</i></b>`;
  }).join('');
}
function addMolecules(sp,count,where){
  for (let i=0;i<count;i++){
    if (where===IN_BEAKER) spawn(sp, BEAKER_X+rand(-.4,.4), rand(.9,1.3), rand(-.4,.4), IN_BEAKER);
    else spawn(sp, rand(-.45,.45), rand(.5,1.5), rand(-.45,.45), IN_FLASK);
  }
  syncAtoms();
}
function reset(){
  mol.n=0; heat=20; flash=0; cam.slice=0;
  /* מספר המולקולות נקבע מהנפח: במרווח אריזה של 0.155 הן ממלאות
     כשליש מהבועה, ונשארים פני נוזל שאפשר לראות */
  for (let i=0;i<NMOL;i++) spawn('H2O', rand(-.52,.52), rand(.10,1.02), rand(-.52,.52), IN_FLASK);
  syncAtoms(); syncHeat(); syncCut(); syncZoom();
}

$('heat').addEventListener('input',e=>{ heat=+e.target.value; syncHeat(); });
$('spark').addEventListener('click',()=>{ flash=.5; heat=Math.max(heat,IGNITION+60); syncHeat(); });
$('cut').addEventListener('input',e=>{ cam.slice=+e.target.value/100; syncCut(); });
$('zoomBtn').addEventListener('click',()=>{ cam.zoom=cam.zoom<0.9?1:1/12; syncZoom(); });
$('reset').addEventListener('click',reset);
$('pause').addEventListener('click',e=>{
  paused=!paused; e.target.textContent=paused?'▶':'⏸'; e.target.classList.toggle('on',paused);
});
$('view').addEventListener('click',()=>{
  if (!FLOAT_FBO) return;
  if (cam.zoom < MICRO){ cam.zoom=1; syncZoom(); return; }   /* חזרה החוצה */
  wantReal=!wantReal;
});
if (!FLOAT_FBO){
  $('view').textContent='⚛ מולקולות';
  $('view').classList.remove('on');
  $('view').style.opacity='.45';
}
const openSheet=()=>{ $('sheet').classList.add('open'); $('scrim').classList.add('on'); };
const closeSheet=()=>{ $('sheet').classList.remove('open'); $('scrim').classList.remove('on'); };
$('pickBar').addEventListener('click',openSheet);
$('scrim').addEventListener('click',closeSheet);

/* ===========================================================================
   9) הלולאה
   =========================================================================== */
let last=performance.now(), acc=0, frames=0, fpsT=0, bank=0, speed=1;
const FIXED=1/60;

function loop(now){
  const dt=Math.min((now-last)/1000,0.25);
  last=now;
  /* צעד קבוע: מכשיר איטי מפיל פריימים, אבל הזמן בעולם ממשיך באותו קצב */
  if (!paused){
    bank+=dt*speed;
    for (let i=0;i<5 && bank>=FIXED;i++){ step(FIXED); bank-=FIXED; }
    if (bank>FIXED*5) bank=FIXED*5;
  }
  const shown=draw();
  frames++; fpsT+=dt;
  if (fpsT>0.5){
    $('fps').textContent=Math.round(frames/fpsT)+' fps · '+mol.n+' מולקולות';
    frames=0; fpsT=0;
  }
  acc+=dt;
  if (acc>0.25){ syncAtoms(); acc=0; }
  requestAnimationFrame(loop);
}

reset(); syncPick(); syncZoom();
setTimeout(()=>$('hint').classList.add('gone'),100);
requestAnimationFrame(loop);

/* ווים לבדיקות ולהקלטה */
window.RLS = {
  orbit(d,e){ cam.az+=d; cam.el=clamp(cam.el+e,-0.55,1.25); },
  setSlice(t){ cam.slice=clamp(t,0,1); syncCut(); },
  setZoom(z){ cam.zoom=clamp(z,1/MAXZOOM,1.15); syncZoom(); },
  setHeat(v){ heat=v; syncHeat(); },
  setView(real){ wantReal=real&&FLOAT_FBO; },
  setSpeed(v){ speed=v; },
  tune(st,it){ STIFF=st; ITERS=it; },
  add(sp,n,where){ addMolecules(sp,n,where==='beaker'?IN_BEAKER:IN_FLASK); },
  spark(){ flash=.5; heat=Math.max(heat,IGNITION+60); syncHeat(); },
  state(){
    const c={H:0,O:0}, by={}, ph=[0,0,0], w=[0,0,0];
    for (let i=0;i<mol.n;i++){
      by[mol.sp[i]]=(by[mol.sp[i]]||0)+1;
      ph[mol.phase[i]]++; w[mol.where[i]]++;
      for (const [el,k] of Object.entries(SPECIES[mol.sp[i]].count)) c[el]+=k;
    }
    return { atoms:c, species:by, n:mol.n, heat:Math.round(heat), realView, floatFBO:FLOAT_FBO,
             phase:{gas:ph[0],liquid:ph[1],solid:ph[2]},
             where:{flask:w[0],tube:w[1],beaker:w[2]} };
  },
};
</script>
