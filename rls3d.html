  for (let i=0;i<mol.n;i++){
    /* רק אוויר החדר. מה שבתוך כלי מופרד מהחדר בזכוכית, ומי שמעביר
       לו חום הוא הדופן — walls() כבר עושה את זה, ובקצב הנכון.
       כשחיברתי גם את מה שבפנים ישירות לשדה, השדה גרר את המים חזרה
       לטמפרטורת החדר מהר יותר משהמבער חימם אותם, והזיקוק פשוט נעצר:
       הכוס קיבלה אפס במקום חמש מאות. שתי מערכות שמושכות לשני כיוונים
       על אותה מולקולה. */
    if (mol.where[i] !== IN_ROOM) continue;
    const c = hfCellOf(mol.x[i], mol.y[i], mol.z[i]);
    if (c<0) continue;
    const d = (HF.T[c]-mol.T[i]) * k;
    mol.T[i] += d;
    HF.T[c]  -= d * MOL_C / Math.max(MAT_C[HF.mat[c]], 1e-4);
  }
}

function hfReset(){ HF.T.fill(AMBIENT); }

/* לאיזה תא בשדה נוגע כל פלח דופן. קבוע, ולכן מחושב פעם אחת. */
const wallCell = new Int32Array(NWALL).fill(-1);
function hfWallCells(){
  for (let i=0;i<WALL_N;i++){
    const y=(i+0.5)/WALL_N*NECK_TOP;
    wallCell[W_FLASK+i]=hfCellOf(flaskRadiusAt(y)+0.16, y, 0);
    const k=Math.min(PATH.length-1, ((i+0.5)/WALL_N*PATH.length)|0), q=PATH[k];
    wallCell[W_TUBE+i]=hfCellOf(q[0], q[1]+0.20, q[2]);
    wallCell[W_BEAKER+i]=hfCellOf(BEAKER_X+0.80, (i+0.5)/WALL_N*1.48, 0);
  }
}

/* זו הדרך שבה המעבדה מחממת את החדר. החומר שבפנים מחמם את הזכוכית,
   והזכוכית מחממת את האוויר שנוגע בה מבחוץ. בלי החוליה הזאת בקבוק
   רותח יכול לעמוד שעה ליד ראשך ולא לחמם כלום. */
function hfWalls(dt){
  for (let p=0;p<NWALL;p++){
    const c=wallCell[p];
    if (c<0) continue;
    const m=HF.mat[c], diff=wallT[p]-HF.T[c];
    if (diff>-1e-4 && diff<1e-4) continue;
    const q=hfG[MAT_GLASS*5+m]*diff*dt;
    let dW=q/MAT_C[MAT_GLASS], dF=q/MAT_C[m];
    const tot=Math.abs(dW)+Math.abs(dF), room=Math.abs(diff)*0.9;
    if (tot>room){ const f=room/tot; dW*=f; dF*=f; }
    wallT[p]-=dW; HF.T[c]+=dF;
  }
}

/* מדידה לבדיקות: הטמפרטורה הממוצעת של האוויר בתיבה, ובאזור נתון */
function hfProbe(x0,x1,y0,y1,z0,z1){
  let s=0,n=0;
  for (let iz=0;iz<HF.nz;iz++) for (let iy=0;iy<HF.ny;iy++) for (let ix=0;ix<HF.nx;ix++){
    const x=HF.x0+(ix+0.5)*HF.cs, y=HF.y0+(iy+0.5)*HF.cs, z=HF.z0+(iz+0.5)*HF.cs;
    if (x<x0||x>x1||y<y0||y>y1||z<z0||z>z1) continue;
    s+=HF.T[hfIdx(ix,iy,iz)]; n++;
  }
  return n ? s/n : AMBIENT;
}


/* ===========================================================================
   5.8) רזולוציה שנגררת אחרי המצלמה

   ככל שמתקרבים רואים יותר מולקולות, קטנות יותר, עד לגודל האמיתי.
   כל צעד פנימה מפצל כל מולקולה לשתיים, וכל צעד החוצה מאחד בחזרה.
   הכמות החומרית לא משתנה: מה שמשתנה הוא כמה נקודות מתארות אותה,
   ולכן המרווח מתכווץ בשורש שלישי של 2 והנוזל ממלא בדיוק את אותו נפח.

   כמה רחוקים מהאמת: כל כדור כאן מייצג מספר עצום של מולקולות אמיתיות,
   והמספר הזה מוצג. הוא יורד עם כל פיצול, אבל אי אפשר להביא אותו ל-1
   בבקבוק שלם — לזה צריך 10²¹ נקודות. שם נכנס המיקרוסקופ, שהוא קופסה
   של ננומטרים ספורים שבה כל כדור באמת מולקולה אחת.
   =========================================================================== */
/* קנה המידה כבר מוגדר בקובץ — M_PER_UNIT, בקבוק 250 מ״ל. משתמשים
   בו ולא בשני קנים לאותו עולם. */
function repOf(){
  const t = (R0*M_PER_UNIT*1e9)/NM_OO;
  return t*t*t;
}
function sci(n){
  if (n<1000) return String(Math.round(n));
  const e=Math.floor(Math.log10(n));
  const m=(n/Math.pow(10,e));
  const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
  return m.toFixed(1)+'×10'+String(e).split('').map(c=>SUP[+c]).join('');
}

const MOLF = ['sp','x','y','z','vx','vy','vz','spin','where','t','T','phase','rho','around','wet','air'];

/* פיצול: כל מולקולה הופכת לשתיים, והשתיים נדחפות לצדדים מתוך המקום
   של המקורית. הכל עובר כמו שהוא — טמפרטורה, מצב, מהירות — ולכן מבנה
   החום והזרימה בכלי נשמר ולא מוגרל מחדש. */
function splitMolecules(){
  const n0=mol.n, kNew=MSCALE*Math.cbrt(2);
  if (kNew>MSCALE_MAX+1e-6) return false;
  if (n0*2 > MAX) return false;
  const off=R0*0.26;
  for (let i=0;i<n0;i++){
    const j=mol.n++;
    for (const f of MOLF) mol[f][j]=mol[f][i];
    for (let c=0;c<3;c++) mol.axis[j*3+c]=mol.axis[i*3+c];
    mol.spin[j]=rand(0,6.28);
    const ux=rand(-1,1), uy=rand(-1,1), uz=rand(-1,1);
    const l=Math.hypot(ux,uy,uz)||1;
    mol.x[i]+=ux/l*off; mol.y[i]+=uy/l*off; mol.z[i]+=uz/l*off;
    mol.x[j]-=ux/l*off; mol.y[j]-=uy/l*off; mol.z[j]-=uz/l*off;
  }
  applyScale(kNew);
  syncZoom(); syncAtoms();
  return true;
}

/* איחוד: מסירים כל מולקולה שנייה מכל מין ומכל אזור, והמרווח גדל
   בשורש שלישי של 2. הכמות החומרית נשמרת כי כל כדור שנשאר מייצג
   פי שניים — וזה בדיוק מה שהמספר שמוצג אומר.
   לא מיצעתי זוגות שכנים: מולקולות של חומרים שונים אי אפשר למצע,
   ומי שלא מצא בן זוג היה נשאר עם משקל אחר מכולם, ואז "כל כדור
   מייצג N" מפסיק להיות נכון. */
function mergeMolecules(){
  const kNew=MSCALE/Math.cbrt(2);
  if (kNew < LEVELS[0]-1e-6) return false;
  let flip=0;
  for (let i=mol.n-1;i>=0;i--) if ((flip++ & 1)===0) kill(i);
  applyScale(kNew);
  syncZoom(); syncAtoms();
  return true;
}

/* איזו רמה מתאימה לזום הנוכחי. הרצועות חופפות בכוונה: בלי זה מספיק
   רעד קטן על הגבול כדי לפצל ולאחד לסירוגין בכל פריים. */
const LOD_IN =[0.34, 0.14, 0.055];    /* מתחת לזה — מפצלים */
const LOD_OUT=[0.46, 0.19, 0.075];    /* מעל לזה — מאחדים */
/* הרמה נגזרת מהסקאלה עצמה ולא ממונה נפרד. אם מישהו בוחר רמה ידנית
   בהגדרות, המונה היה יוצא מסנכרון והזום היה מפצל מהמקום הלא נכון. */
const lodStepOf = () => Math.round(3*Math.log(MSCALE/LEVELS[0])/Math.log(2));
function lodFollowZoom(){
  if (MC.on) return;
  const st=Math.max(0, Math.min(3, lodStepOf()));
  if (st<3 && cam.zoom < LOD_IN[st]) splitMolecules();
  else if (st>0 && cam.zoom > LOD_OUT[st-1]) mergeMolecules();
}

function step(dt){
  neighbours(dt);
  airHeat(dt);
  walls(dt);
  hfFlame(dt);
  hfWalls(dt);
  hfStep(dt);
  hfCouple(dt);
  for (let i=0;i<mol.n;i++){
    const S=SPECIES[mol.sp[i]];
    updatePhase(i, dt);
    const ph=mol.phase[i], T=mol.T[i];
    mol.spin[i]+=dt*(ph===GAS?5:ph===LIQ?1.2:0.15);

    /* כובד וציפה בצעד אחד: מה שדוחף גוף למעלה או למטה הוא ההפרש בין
       הצפיפות שלו לצפיפות של מה שמקיף אותו. גז בתוך נוזל עולה חזק,
       נוזל כבד בתוך נוזל קל שוקע, ושני גזים נפרדים לשכבות לפי משקל. */
    const mine=densityOf(i);
    const amb = mol.where[i]===IN_ROOM ? (rhoRoom||mine)
              : mol.around[i]>2 ? mol.rho[i]/mol.around[i] : mine;
    const lift = clamp((amb-mine)/Math.max(mine,1e-4), -6, 6);
    /* על גז הכובד כמעט לא משפיע בקנה המידה הזה, ומעל נוזל רותח יש זרם
       עולה. בלי זה אדים בתוך אדים לא מרגישים שום הפרש צפיפות ופשוט
       יושבים בבועה — הזיקוק נעצר לפני שהוא מגיע לצוואר. */
    const G = ph===GAS ? 0.8 : 5.2;
    /* אוויר חופשי לא נופל. משקלו נישא בידי לחץ האוויר שמתחתיו, וגובה
       הסקאלה של האטמוספירה הוא שמונה קילומטר — על פני חדר אחד אין שום
       שקיעה שאפשר למדוד. בלי זה כל האוויר מתנקז לרצפה תוך דקה.
       המשקל מתבטל, הציפה נשארת: חם עולה, קר יורד. זו ההסעה. */
    const W = mol.where[i]===IN_ROOM ? 0 : G;
    /* זרם עולה מעל מקור חום. נמדד מול טמפרטורת החדר ולא מול נקודת
       הרתיחה: חום כמוס מקבע אדים רותחים בדיוק על 100°, וכל תנאי
       שדורש "מעל נקודת הרתיחה" מתאפס בשקט בדיוק כשצריך אותו. */
    /* הדחיפה הזאת היא תיקון לאדים בתוך הבקבוק, שם בועה חמה חייבת
       לפרוץ מעלה. באוויר החדר אין בה צורך ואסור שתהיה: הציפה לבדה
       כבר עושה את העבודה, והתוספת רק הופכת אותה למשאבה. */
    const conv = ph===GAS && mol.where[i]!==IN_ROOM
      ? clamp((mol.T[i]-AMBIENT)/120,0,1) * 9.0 : 0;
    mol.vy[i] += (-W + G*lift + conv) * dt;

    /* הלהבה מחממת רק את מה שיושב מעליה — התחתית של הבקבוק. משם
       החום מטפס פנימה שכנה־שכנה, ולכן הרתיחה מתחילה למטה. */
    if (gasTap>0 && mol.where[i]===IN_FLASK && mol.y[i]<0.55)
      /* ההספק מכויל מהמאזן: להרתיח את כל הבקבוק לוקח כדקה בלהבה
         מלאה. עם 320 מעלות לשנייה הכל התאדה תוך אחת עשרה שניות. */
      mol.T[i] += gasTap * 62 * (1 - mol.y[i]/0.55) * dt;
    /* צד שני של החוגה: אמבט קירור מתחת לבקבוק. במעבדה אין "לבחור
       מינוס מאתיים" — מכניסים את הכלי לאמבט, והחום יוצא ממנו החוצה. */
    if (gasTap<0 && mol.where[i]===IN_FLASK && mol.y[i]<0.60)
      mol.T[i] += (BATH - mol.T[i]) * (-gasTap) * 0.85 * (1 - mol.y[i]/0.60) * dt;
    /* בשוליים של תיבת האוויר מתחילה שאר המעבדה. היא גדולה מכדי
       להתחמם, ולכן אוויר שמגיע לקצה חוזר לטמפרטורת החדר — וזה מה
       שסוגר את מחזור ההסעה: חם עולה ויוצא, קר נכנס במקומו. */
    if (mol.where[i]===IN_ROOM){
      const e = Math.max(
        Math.max((ROOM.x0+0.35-mol.x[i]), (mol.x[i]-(ROOM.x1-0.35)))/0.35,
        Math.max((mol.y[i]-(ROOM.y1-0.40))/0.40,
                 Math.max((ROOM.z0+0.30-mol.z[i]), (mol.z[i]-(ROOM.z1-0.30)))/0.30));
      if (e>0) mol.T[i] += (AMBIENT-mol.T[i]) * Math.min(1,e) * 1.9 * dt;
    }

    const therm = ph===GAS ? clamp((T-S.boil)/260,0.25,3.2) : ph===LIQ ? 0.16 : 0.02;
    mol.vx[i]+=rand(-1,1)*therm*dt*9;
    mol.vy[i]+=rand(-1,1)*therm*dt*9;
    mol.vz[i]+=rand(-1,1)*therm*dt*9;

    const k=Math.exp(-(ph===GAS?0.55:ph===LIQ?3.4:11.0)*dt);
    mol.vx[i]*=k; mol.vy[i]*=k; mol.vz[i]*=k;
    mol.x[i]+=mol.vx[i]*dt; mol.y[i]+=mol.vy[i]*dt; mol.z[i]+=mol.vz[i]*dt;

    if (mol.where[i]===IN_ROOM){
      /* הזכוכית היא קיר גם מבחוץ. בלי זה האוויר פשוט חוצה את הבקבוק
         ומתערבב עם המים, ואז אין בכלל שני צדדים לדופן. */
      pushOutOfGlass(i);
      if (mol.x[i]<ROOM.x0){ mol.x[i]=ROOM.x0; mol.vx[i]*=-.4; }
      if (mol.x[i]>ROOM.x1){ mol.x[i]=ROOM.x1; mol.vx[i]*=-.4; }
      if (mol.z[i]<ROOM.z0){ mol.z[i]=ROOM.z0; mol.vz[i]*=-.4; }
      if (mol.z[i]>ROOM.z1){ mol.z[i]=ROOM.z1; mol.vz[i]*=-.4; }
      if (mol.y[i]<ROOM.y0){ mol.y[i]=ROOM.y0; mol.vy[i]*=-.4; }
      if (mol.y[i]>ROOM.y1){ mol.y[i]=ROOM.y1; mol.vy[i]*=-.4; }
      /* דרך פתח הכוס אפשר להיכנס. זה הכלי היחיד שפתוח לחדר, ולכן
         הוא היחיד שבו אוויר החדר והאוויר שבפנים הם אותו אוויר. */
      if (mol.y[i]<1.44 && mol.y[i]>1.30 && Math.hypot(mol.x[i]-BEAKER_X,mol.z[i])<0.58 && mol.vy[i]<0)
        mol.where[i]=IN_BEAKER;
      continue;
    }

    if (mol.where[i]===IN_TUBE){
      /* המולקולה נעה מכוח עצמה. הכליאה רק מונעת ממנה לצאת דרך הזכוכית:
         מוצאים את הנקודה הקרובה על ציר הצינור ומחזירים אותה פנימה.
         קודם היא הוסעה על מסילה לפי פרמטר — זו הייתה אנימציה, לא זרימה. */
      let hint=mol.t[i]|0, best=hint, bd=1e9;
      const lo=Math.max(0,hint-14), hi=Math.min(PATH.length-1,hint+14);
      for (let k=lo;k<=hi;k++){
        const q=PATH[k];
        const ax=mol.x[i]-q[0], ay=mol.y[i]-q[1], az=mol.z[i]-q[2];
        const dd=ax*ax+ay*ay+az*az;
        if (dd<bd){ bd=dd; best=k; }
      }
      mol.t[i]=best;
      const q=PATH[best];
      const ax=mol.x[i]-q[0], ay=mol.y[i]-q[1], az=mol.z[i]-q[2];
      const rr=Math.sqrt(bd);
      if (rr>TUBE_IN && rr>1e-6){
        const sc=TUBE_IN/rr;
        mol.x[i]=q[0]+ax*sc; mol.y[i]=q[1]+ay*sc; mol.z[i]=q[2]+az*sc;
        const ux=ax/rr, uy=ay/rr, uz=az/rr;
        const vn=mol.vx[i]*ux+mol.vy[i]*uy+mol.vz[i]*uz;
        if (vn>0){ mol.vx[i]-=ux*vn*1.35; mol.vy[i]-=uy*vn*1.35; mol.vz[i]-=uz*vn*1.35; }
      }
      /* הקצוות: בחזרה לבקבוק רק אם היא באמת יורדת מתחת לפתח, אחרת
         כל מולקולה שנכנסת נזרקת החוצה באותו צעד ושום דבר לא זורם */
      if (best<=0 && mol.vy[i]<0 && mol.y[i]<PATH[0][1]-0.02){ mol.where[i]=IN_FLASK; }
      else if (best>=PATH.length-2){
        mol.where[i]=IN_BEAKER; mol.vy[i]=Math.min(mol.vy[i],-0.5);
      }
      continue;
    }

    if (mol.where[i]===IN_FUNNEL){
      const maxR=funnelRadiusAt(mol.y[i]);
      const r=Math.hypot(mol.x[i]-FX, mol.z[i]);
      if (r>maxR && r>1e-6){
        const sc=maxR/r;
        mol.x[i]=FX+(mol.x[i]-FX)*sc; mol.z[i]*=sc;
        mol.vx[i]*=-.35; mol.vz[i]*=-.35;
      }
      if (mol.y[i]>BOWL_Y1-0.05){ mol.y[i]=BOWL_Y1-0.05; mol.vy[i]*=-.3; }
      if (tap.a>0.55){
        /* פתוח: מה שמגיע לתחתית הגזע נכנס לבקבוק */
        if (mol.y[i]<STEM_Y0+0.04){ mol.where[i]=IN_FLASK; mol.vy[i]=-0.8; }
      } else if (mol.y[i]<TAP_Y+0.10){
        mol.y[i]=TAP_Y+0.10; mol.vy[i]*=-0.25;    /* סגור: נחים על הברז */
      }
      continue;
    }

    if (mol.where[i]===IN_FLASK){
      /* הסף חייב להיות מתחת לתקרת הצוואר, אחרת אדים נצמדים לתקרה
         בדיוק מתחת לפתח ולא נכנסים לעולם */
      if (ph===GAS && mol.y[i]>NECK_TOP-0.09 && Math.hypot(mol.x[i],mol.z[i])<NECK_R){
        /* גז שמוצא את פתח הגזע עולה למשפך — אבל רק אם הברז פתוח */
        if (tap.a>0.55 && Math.hypot(mol.x[i]-FX,mol.z[i])<STEM_R-0.02){
          mol.where[i]=IN_FUNNEL; mol.vy[i]=1.2; continue;
        }
        /* נכנסת אל תוך הצינור, לא אל השפה שלו */
        mol.where[i]=IN_TUBE; mol.t[i]=3;
        const q=PATH[3];
        mol.x[i]=q[0]+rand(-.03,.03); mol.y[i]=q[1]; mol.z[i]=q[2]+rand(-.03,.03);
        mol.vy[i]=Math.max(mol.vy[i],0.3);
        continue;
      }
      const maxR=flaskRadiusAt(mol.y[i])-0.06, r=Math.hypot(mol.x[i],mol.z[i]);
      if (r>maxR && r>1e-6){ const s=maxR/r; mol.x[i]*=s; mol.z[i]*=s; mol.vx[i]*=-.35; mol.vz[i]*=-.35; }
      if (mol.y[i]>NECK_TOP-0.05){ mol.y[i]=NECK_TOP-0.05; mol.vy[i]*=-.3; }
      if (mol.y[i]<0.06){ mol.y[i]=0.06; mol.vy[i]*=-.25; }
    } else {
      const r=Math.hypot(mol.x[i]-BEAKER_X,mol.z[i]);
      if (r>0.60){ const s=0.60/r; mol.x[i]=BEAKER_X+(mol.x[i]-BEAKER_X)*s; mol.z[i]*=s;
                   mol.vx[i]*=-.35; mol.vz[i]*=-.35; }
      /* הכוס פתוחה למעלה. גז שעולה יוצא ממנה אל החדר — אחרת האוויר
         נלכד בפנים ולא מתחלף, והכוס הופכת לבקבוק סגור. */
      if (ph===GAS && mol.y[i]>1.40 && mol.vy[i]>0){ mol.where[i]=IN_ROOM; continue; }
      if (mol.y[i]>1.42){ mol.y[i]=1.42; mol.vy[i]*=-.3; }
      if (mol.y[i]<0.06){ mol.y[i]=0.06; mol.vy[i]*=-.25; }
    }
  }
  cool.fill(0, 0, mol.n);
  react();
  tap.a += (( tap.open?1:0 ) - tap.a) * Math.min(1, dt*3.2);
  if (flash>0) flash-=dt;
  heat = flaskTemp();          /* לתצוגה: מה שהמדחום היה מראה */
}

/* ===========================================================================
   5.5) מיקרוסקופ אטומי

   בהגדלה הזאת אין שום טעם לסמלץ בקבוק. מסמלצים קופסה של כמה ננומטרים
   בצפיפות האמיתית של מים — 33.4 מולקולות לננומטר מעוקב — ורואים אותה
   מקרוב. זה מה שמאפשר גודל אטום אמיתי: לא כוח גס, אלא לסמלץ רק את מה
   שנמצא בשדה הראייה. בקבוק שלם באותה רזולוציה הוא 10²⁵ מולקולות.

   כל האורכים כאן בננומטרים, לא ביחידות העולם.
   =========================================================================== */
const NM_RHO = 33.4;          /* מולקולות מים לננומטר מעוקב, בצפיפות אמיתית */
const NM_OO  = 0.290;         /* מרחק חמצן-חמצן במים נוזליים */
const NM_OH  = 0.0958;        /* אורך קשר חמצן-מימן */
const R_O    = 0.152;         /* רדיוסי ואן דר ואלס — הגודל שבו אטום "נוגע" */
const R_H    = 0.110;
const MICRO_MAX_N = 9000;

const MC = {
  on:false, L:4.0, n:0, cap:MICRO_MAX_N,
  x:new Float32Array(MICRO_MAX_N), y:new Float32Array(MICRO_MAX_N), z:new Float32Array(MICRO_MAX_N),
  vx:new Float32Array(MICRO_MAX_N), vy:new Float32Array(MICRO_MAX_N), vz:new Float32Array(MICRO_MAX_N),
  spin:new Float32Array(MICRO_MAX_N), axis:new Float32Array(MICRO_MAX_N*3),
  sp:new Array(MICRO_MAX_N),
  gs:null, gc:null, gcell:null, gorder:null, gn:0,
};

/* הרכב הקופסה נלקח מהמצב האמיתי של הסימולציה — אם יש מימן בבקבוק,
   הוא יופיע גם כאן, באותו יחס. */
function microMix(){
  const c={}; let tot=0;
  for (let i=0;i<mol.n;i++){ c[mol.sp[i]]=(c[mol.sp[i]]||0)+1; tot++; }
  if (!tot) return [['H2O',1]];
  return Object.entries(c).map(([k,v])=>[k,v/tot]);
}

function microFill(L){
  MC.L=L;
  const want=Math.min(MICRO_MAX_N, Math.round(NM_RHO*L*L*L));
  const mix=microMix();
  /* פריסה על סריג עם רעש: מתחילים מסידור תקין ונותנים לפותר לרפות
     אותו, אחרת אלפי מולקולות מתחילות חופפות ומתפוצצות */
  const side=Math.ceil(Math.cbrt(want)), step=L/side;
  MC.n=0;
  for (let a=0;a<side && MC.n<want;a++)
  for (let b=0;b<side && MC.n<want;b++)
  for (let c=0;c<side && MC.n<want;c++){
    const i=MC.n++;
    MC.x[i]=(a+0.5+rand(-.22,.22))*step;
    MC.y[i]=(b+0.5+rand(-.22,.22))*step;
    MC.z[i]=(c+0.5+rand(-.22,.22))*step;
    MC.vx[i]=MC.vy[i]=MC.vz[i]=0;
    MC.spin[i]=rand(0,6.28);
    const ax=v3.norm([rand(-1,1),rand(-1,1),rand(-1,1)]);
    MC.axis[i*3]=ax[0]; MC.axis[i*3+1]=ax[1]; MC.axis[i*3+2]=ax[2];
    let r=Math.random(), pick='H2O';
    for (const [k,f] of mix){ if ((r-=f)<=0){ pick=k; break; } }
    MC.sp[i]=pick;
  }
  microGrid();
}

/* רשת מחזורית: הקופסה נעטפת על עצמה, אחרת נוצרים קירות מלאכותיים
   באמצע נוזל אינסופי */
function microGrid(){
  const g=Math.max(3, Math.floor(MC.L/(NM_OO*1.05)));
  MC.gn=g;
  const nc=g*g*g;
  if (!MC.gs || MC.gs.length!==nc+1){
    MC.gs=new Int32Array(nc+1); MC.gc=new Int32Array(nc);
    MC.gcell=new Int32Array(MICRO_MAX_N); MC.gorder=new Int32Array(MICRO_MAX_N);
  }
}
const wrap=(v,L)=>v<0?v+L:v>=L?v-L:v;

function microStep(dt, T){
  const L=MC.L, g=MC.gn, cs=L/g;
  const gi=v=>{ let k=(v/cs)|0; return k<0?0:k>=g?g-1:k; };

  MC.gs.fill(0);
  for (let i=0;i<MC.n;i++){
    const c=(gi(MC.z[i])*g + gi(MC.y[i]))*g + gi(MC.x[i]);
    MC.gcell[i]=c; MC.gs[c+1]++;
  }
  for (let c=0;c<g*g*g;c++) MC.gs[c+1]+=MC.gs[c];
  MC.gc.set(MC.gs.subarray(0,g*g*g));
  for (let i=0;i<MC.n;i++) MC.gorder[MC.gc[MC.gcell[i]]++]=i;

  /* תנועה תרמית: ככל שחם יותר, המולקולות רועדות חזק יותר. זו בדיוק
     המשמעות של טמפרטורה בקנה המידה הזה. */
  const jig = Math.sqrt(Math.max(T+273.15, 1)/293) * 0.9;
  for (let i=0;i<MC.n;i++){
    MC.vx[i]+=rand(-1,1)*jig*dt*14; MC.vy[i]+=rand(-1,1)*jig*dt*14; MC.vz[i]+=rand(-1,1)*jig*dt*14;
    const k=Math.exp(-6*dt);
    MC.vx[i]*=k; MC.vy[i]*=k; MC.vz[i]*=k;
    MC.x[i]=wrap(MC.x[i]+MC.vx[i]*dt, L);
    MC.y[i]=wrap(MC.y[i]+MC.vy[i]*dt, L);
    MC.z[i]=wrap(MC.z[i]+MC.vz[i]*dt, L);
    MC.spin[i]+=dt*jig*3.0;
  }

  /* הפרדה: אותו פותר מיקום כמו בסימולציה הגדולה, רק שהמרחק כאן הוא
     המרחק האמיתי בין מולקולות מים */
  const half=L/2;
  for (let it=0;it<3;it++){
    for (let i=0;i<MC.n;i++){
      const cx=gi(MC.x[i]), cy=gi(MC.y[i]), cz=gi(MC.z[i]);
      for (let dz=-1;dz<=1;dz++) for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
        const c=(((cz+dz+g)%g)*g + ((cy+dy+g)%g))*g + ((cx+dx+g)%g);
        for (let q=MC.gs[c];q<MC.gs[c+1];q++){
          const j=MC.gorder[q];
          if (j<=i) continue;
          let ex=MC.x[i]-MC.x[j], ey=MC.y[i]-MC.y[j], ez=MC.z[i]-MC.z[j];
          if (ex> half) ex-=L; else if (ex<-half) ex+=L;
          if (ey> half) ey-=L; else if (ey<-half) ey+=L;
          if (ez> half) ez-=L; else if (ez<-half) ez+=L;
          const d2=ex*ex+ey*ey+ez*ez;
          if (d2>=NM_OO*NM_OO || d2<1e-12) continue;
          const d=Math.sqrt(d2), push=(NM_OO-d)*0.5*0.9;
          const ux=ex/d, uy=ey/d, uz=ez/d;
          MC.x[i]=wrap(MC.x[i]+ux*push,L); MC.y[i]=wrap(MC.y[i]+uy*push,L); MC.z[i]=wrap(MC.z[i]+uz*push,L);
          MC.x[j]=wrap(MC.x[j]-ux*push,L); MC.y[j]=wrap(MC.y[j]-uy*push,L); MC.z[j]=wrap(MC.z[j]-uz*push,L);
        }
      }
    }
  }
}

/* צורת המולקולה בננומטרים, עם הזוויות והאורכים האמיתיים */
const NM_SHAPE = {
  H2O:[['O',[0,0,0]],
       ['H',[ NM_OH*Math.sin(A), NM_OH*Math.cos(A),0]],
       ['H',[-NM_OH*Math.sin(A), NM_OH*Math.cos(A),0]]],
  H2: [['H',[-0.037,0,0]],['H',[0.037,0,0]]],
  O2: [['O',[-0.060,0,0]],['O',[0.060,0,0]]],
};
const NM_R = { O:R_O, H:R_H };

function microInstances(){
  let k=0;
  for (let i=0;i<MC.n;i++){
    const shape=NM_SHAPE[MC.sp[i]] || NM_SHAPE.H2O;
    const a=MC.spin[i], c=Math.cos(a), s=Math.sin(a);
    const ax=MC.axis[i*3], ay=MC.axis[i*3+1], az=MC.axis[i*3+2];
    for (const [el,off] of shape){
      const [ox,oy,oz]=off;
      const dt=ax*ox+ay*oy+az*oz;
      const cx=ay*oz-az*oy, cy=az*ox-ax*oz, cz=ax*oy-ay*ox;
      inst.off[k*3]  =MC.x[i]+ox*c+cx*s+ax*dt*(1-c);
      inst.off[k*3+1]=MC.y[i]+oy*c+cy*s+ay*dt*(1-c);
      inst.off[k*3+2]=MC.z[i]+oz*c+cz*s+az*dt*(1-c);
      const col=ELEM[el].col;
      inst.col[k*3]=col[0]; inst.col[k*3+1]=col[1]; inst.col[k*3+2]=col[2];
      inst.rad[k]=NM_R[el]; inst.kind[k]=1;
      k++;
    }
  }
  return k;
}

/* ===========================================================================
   6) מצלמה
   =========================================================================== */
const FOV=0.86;
const cam={ az:1.15, el:0.16, dist:7, target:[BOUNDS.cx,BOUNDS.cy,0], slice:0, zoom:1 };
/* לאן המצלמה צוללת כשמגדילים: לתוך הנוזל שבבקבוק. בלי זה הזום
   מתקרב למרכז המערכת, שהוא אוויר. */
const DIVE=[0, 0.40, 0];
const MAXZOOM=60;
function camTarget(){
  const t=clamp((1-cam.zoom)/0.80, 0, 1);
  return [BOUNDS.cx+(DIVE[0]-BOUNDS.cx)*t,
          BOUNDS.cy+(DIVE[1]-BOUNDS.cy)*t,
          DIVE[2]*t];
}
const SCENE_R=3.2;
const eyePos=()=>{
  const ce=Math.cos(cam.el);
  return [cam.target[0]+cam.dist*ce*Math.sin(cam.az),
          cam.target[1]+cam.dist*Math.sin(cam.el),
          cam.target[2]+cam.dist*ce*Math.cos(cam.az)];
};
function fitDistance(){
  const asp=(cv.clientWidth||1)/(cv.clientHeight||1);
  const halfV=Math.tan(FOV/2), halfH=halfV*asp;
  const ce=Math.cos(cam.el), se=Math.sin(cam.el);
  const sa=Math.sin(cam.az), ca=Math.cos(cam.az);
  const f=[-ce*sa,-se,-ce*ca], r=[ca,0,-sa], u=v3.cross(r,f);
  let d=0;
  for (const sx of [-1,1]) for (const sy of [-1,1]) for (const sz of [-1,1]){
    const c=[sx*BOUNDS.hx, sy*BOUNDS.hy, sz*BOUNDS.hz];
    const need=Math.max(Math.abs(v3.dot(c,r))/halfH, Math.abs(v3.dot(c,u))/halfV) - v3.dot(c,f);
    if (need>d) d=need;
  }
  return d*1.04;
}

let touches=new Map(), pinch0=0, slice0=0, last2=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (touches.size===2){
    const [a,b]=[...touches.values()];
    pinch0=Math.hypot(a.x-b.x,a.y-b.y); slice0=cam.zoom;
    last2={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }
});
cv.addEventListener('pointermove',e=>{
  const p=touches.get(e.pointerId); if(!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if (touches.size>=2){
    const [a,b]=[...touches.values()];
    const d=Math.max(Math.hypot(a.x-b.x,a.y-b.y), 1);
    const f=pinch0/d;
    if (MC.on){
      microFov=clamp(microFov*f, 1.2, 7.5); pinch0=d;
      if (microFov>=7.45) microExit();
      else if (microFov*1.5 > MC.L+0.9 || microFov*1.5 < MC.L-0.9) microFill(clamp(microFov*1.5,2.4,6.4));
      syncZoom();
    } else {
      cam.zoom=clamp(slice0*f, 1/(MAXZOOM*1.35), 1.15);
      if (cam.zoom <= 1/(MAXZOOM*1.3)) microEnter();
    }
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if (last2){ cam.az-=(mid.x-last2.x)*0.008; cam.el=clamp(cam.el+(mid.y-last2.y)*0.006,-0.55,1.25); }
    last2=mid; syncZoom();
  }
});
const release=e=>{ touches.delete(e.pointerId); if (touches.size<2) last2=null; };
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);

let mdown=false,mx=0,my=0;
cv.addEventListener('mousedown',e=>{mdown=true;mx=e.clientX;my=e.clientY;});
addEventListener('mouseup',()=>mdown=false);
addEventListener('mousemove',e=>{
  if(!mdown) return;
  cam.az-=(e.clientX-mx)*0.008; cam.el=clamp(cam.el+(e.clientY-my)*0.006,-0.55,1.25);
  mx=e.clientX; my=e.clientY;
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(e.deltaY*0.0016);
  if (MC.on){
    microFov=clamp(microFov*f, 1.2, 7.5);
    if (microFov>=7.45) microExit(); else syncZoom();
  } else {
    cam.zoom=clamp(cam.zoom*f, 1/(MAXZOOM*1.35), 1.15);
    if (cam.zoom <= 1/(MAXZOOM*1.3)) microEnter(); else syncZoom();
  }
},{passive:false});
cv.addEventListener('click',e=>{
  if (touches.size>1) return;
  const n=Math.round(26*MSCALE*MSCALE*MSCALE);
  /* שליש עליון של המסך = הקערה שלמעלה */
  addMolecules(picked, n, e.clientY/innerHeight<0.30 ? IN_FUNNEL
                        : e.clientX/innerWidth>0.56 ? IN_BEAKER : IN_FLASK);
});

/* ===========================================================================
   7) ציור
   =========================================================================== */
let W=0,H=0,FW=0,FH=0,SAMPLES=1;
let msFBO,msColor,msDepth;          /* כל הגאומטריה נכנסת לכאן, עם MSAA */
let sceneTex,sceneFBO;              /* אותה תמונה אחרי פתירה, כדי שהנוזל ידגום אותה */
let fdTex,fdRB,fdFBO, b1Tex,b1FBO, thTex,thFBO;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.75);
  const w=Math.max(1,(cv.clientWidth*dpr)|0), h=Math.max(1,(cv.clientHeight*dpr)|0);
  if (w===W && h===H) return;
  W=w; H=h; cv.width=w; cv.height=h;
  FW=Math.max(1,W>>1); FH=Math.max(1,H>>1);   /* הנוזל בחצי רזולוציה — הטשטוש מסתיר את זה */
  SAMPLES=Math.min(4, gl.getParameter(gl.MAX_SAMPLES)||1);

  for (const t of [sceneTex,fdTex,b1Tex,thTex]) if (t) gl.deleteTexture(t);
  for (const f of [msFBO,sceneFBO,fdFBO,b1FBO,thFBO]) if (f) gl.deleteFramebuffer(f);
  for (const r of [msColor,msDepth,fdRB]) if (r) gl.deleteRenderbuffer(r);

  const rb=(w,h,fmt,samples)=>{
    const r=gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER,r);
    if (samples>1) gl.renderbufferStorageMultisample(gl.RENDERBUFFER,samples,fmt,w,h);
    else gl.renderbufferStorage(gl.RENDERBUFFER,fmt,w,h);
    return r;
  };

  msColor=rb(W,H,gl.RGBA8,SAMPLES);
  msDepth=rb(W,H,gl.DEPTH_COMPONENT24,SAMPLES);
  msFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,msColor);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,msDepth);

  sceneTex=makeTex(W,H,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR);
  sceneFBO=makeFBO(sceneTex,null);

  if (FLOAT_FBO){
    fdRB =rb(FW,FH,gl.DEPTH_COMPONENT24,1);
    fdTex=makeTex(FW,FH,gl.R16F,gl.RED,gl.HALF_FLOAT,gl.LINEAR);
    b1Tex=makeTex(FW,FH,gl.R16F,gl.RED,gl.HALF_FLOAT,gl.LINEAR);
    thTex=makeTex(FW,FH,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,gl.LINEAR);
    fdFBO=makeFBO(fdTex,fdRB); b1FBO=makeFBO(b1Tex,null); thFBO=makeFBO(thTex,null);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

/* ---- מפת הצללים ----
   מקרינים את הסצנה מכיוון האור לתוך מפת עומק, ואז כל שיידר בודק מולה
   אם הנקודה שלו רואה את האור. אור מכיוון קבוע, ולכן הטלה אורתוגונלית. */
const SHADOW_SIZE = 1600;
let shadowTex, shadowFBO, LVP;

function initShadow(){
  shadowTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,shadowTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,SHADOW_SIZE,SHADOW_SIZE,0,
                gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
  /* השוואה בחומרה: הדגימה מחזירה כמה מארבעת הטקסלים עברו את המבחן,
     כלומר PCF דו-לינארי בחינם */
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  shadowFBO=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shadowTex,0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  const ortho=(hw,hh,n,f)=>new Float32Array([
    1/hw,0,0,0, 0,1/hh,0,0, 0,0,-2/(f-n),0, 0,0,-(f+n)/(f-n),1]);
  const L=v3.norm([0.38,0.86,0.34]), C=[0.9,0.35,-0.9];
  LVP=m4.mul(ortho(5.2,5.2,0.1,26), m4.lookAt(v3.add(C,v3.scale(L,13)), C, [0,1,0]));
}

function renderShadow(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFBO);
  gl.viewport(0,0,SHADOW_SIZE,SHADOW_SIZE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  /* מטילים רק פאות אחוריות: הצל נדחף לצד הרחוק של הגוף ואקנה נעלמת */
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
  gl.useProgram(shadowProg);
  gl.uniformMatrix4fv(shadowProg.u.uLVP,false,LVP);
  for (const m of [bench, props, rigMesh, burner, jack]){
    gl.bindVertexArray(m.vao);
    gl.drawElements(gl.TRIANGLES,m.n,m.type,0);
  }
  gl.disable(gl.CULL_FACE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function bindShadow(prog){
  gl.uniformMatrix4fv(prog.u.uLVP,false,LVP);
  gl.uniform1f(prog.u.uSTexel,1/SHADOW_SIZE);
  gl.uniform1i(prog.u.uShadow,7);
  gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D,shadowTex);
  gl.activeTexture(gl.TEXTURE0);
}

/* MSAA → דגימה בודדת. זו ההעתקה היחידה שמותרת מחוצץ מרובה־דגימות. */
function resolveTo(dstFBO){
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,dstFBO);
  gl.blitFramebuffer(0,0,W,H, 0,0,W,H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);
}

/* מספיק מקום לשני העולמות: הסימולציה הגדולה והקופסה של המיקרוסקופ */
const ISLOTS = Math.max(MAX*3, MICRO_MAX_N*3);
const inst={ off:new Float32Array(ISLOTS*3), col:new Float32Array(ISLOTS*3),
             rad:new Float32Array(ISLOTS),   kind:new Float32Array(ISLOTS) };

/* כמה גדול המודל המצויר ביחס למרווח האריזה. זה לא גודל האטום — זו
   ההחלטה כמה מקום המולקולה תופסת על המסך, וכך רואים את הרווח שבין
   מולקולה לשכנתה. במוצק הן צמודות, בנוזל יש רווח, בגז הרבה יותר. */
/* מולקולת מים היא באותו גודל בקרח, במים ובאדים. מה שמשתנה בין
   המצבים הוא המרווח ביניהן, ואת זה הפיזיקה כבר עושה. לצייר גז קטן
   יותר היה פשוט לא נכון.
   היחס עצמו כבר מדויק: רדיוס החמצן 0.082 חלקי מרווח 0.155 יוצא
   0.529, והמדידה האמיתית היא 0.152 חלקי 0.290 = 0.524. */
const MODEL = [1, 1, 1];
let showAir = false;

/* ---------------------------------------------------------------------------
   רמת הפירוט, ברצף.

   קודם היו שני מצבים ותו לא: או המעבדה, שבה כל מולקולה היא נקודה זעירה,
   או המיקרוסקופ, שבו הן כדורים ענקיים שנוגעים זה בזה. או הכל מפורק או
   הכל מחובר, בלי שום דבר באמצע, והמעבר ביניהם היה קפיצה.

   שני דברים משתנים עכשיו עם הזום, ושניהם ברצף:

   1) גודל המודל. מרחוק המולקולה מצוירת קטנה ויש רווח בין אחת לשנייה,
      וזה טוב כדי לראות מבנה. ככל שמתקרבים היא גדלה עד שהמולקולות
      נוגעות — וזה לא סגנון אלא האמת: במים אמיתיים המרחק בין מרכזים
      הוא 0.29 ננומטר ורדיוס החמצן 0.152, כלומר הן באמת נוגעות
      וחופפות. ברגע שהמיקרוסקופ נכנס, המעבדה כבר נראית כמוהו.

   2) מיזוג מרחוק. מולקולה שגודלה על המסך קטן מפיקסל אין טעם לצייר
      בנפרד — אי אפשר לראות אותה ממילא. קבוצות באותו תא מרחבי מתמזגות
      לכדור אחד גדול יותר, ומספרן יורד. עדיין רואים אותן, אבל לא
      סופרים כל אחת.
   --------------------------------------------------------------------------- */
const CL_CS = 0.30;
const CL_NX=Math.ceil(4.8/CL_CS), CL_NY=Math.ceil(5.2/CL_CS), CL_NZ=Math.ceil(2.6/CL_CS);
const CL_N = CL_NX*CL_NY*CL_NZ;
const clX=new Float32Array(CL_N*4), clY=new Float32Array(CL_N*4),
      clZ=new Float32Array(CL_N*4), clC=new Float32Array(CL_N*4);
const clTouched=new Int32Array(CL_N*4);
const SPI = { H2O:0, O2:1, H2:2, N2:3 };
const lodStats = { drawn:0, merged:0 };

/* 0 בזום מלא החוצה, 1 בסף המיקרוסקופ. לוגריתמי, כי זום הוא כפלי. */
function zoomU(){
  const zOut=1.15, zIn=1/(MAXZOOM*1.3);
  return clamp(Math.log(zOut/cam.zoom)/Math.log(zOut/zIn), 0, 1);
}

function buildAtoms(){
  let k=0;
  const eye=eyePos();
  /* פיקסלים לרדיאן — ככה אפשר לשאול "כמה גדולה המולקולה על המסך"
     במקום "כמה היא רחוקה", והתשובה נכונה בכל מסך ובכל זום */
  const PXR = (H*0.5)/Math.tan(FOV*0.5);

  let nFar=0;
  for (let g=0; g<CL_N*4; g++) clTouched[g]=0;

  for (let i=0;i<mol.n;i++){
    if (!showAir && mol.air[i]) continue;
    const S=SPECIES[mol.sp[i]];
    const md = MODEL[mol.phase[i]];

    const dx=mol.x[i]-eye[0], dy=mol.y[i]-eye[1], dz=mol.z[i]-eye[2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz) || 1e-4;
    /* גודל המולקולה על המסך, ברדיוס פיקסלים */
    const px = R0*md*PXR/d;

    if (px < 1.6){
      /* קטנה מכדי להיראות לבדה — נכנסת לאשכול */
      const cx=((mol.x[i]+1.5)/CL_CS)|0, cy=((mol.y[i]+0.4)/CL_CS)|0, cz=((mol.z[i]+1.3)/CL_CS)|0;
      if (cx>=0&&cy>=0&&cz>=0&&cx<CL_NX&&cy<CL_NY&&cz<CL_NZ){
        const sp=SPI[mol.sp[i]]|0;
        const g=(((cz*CL_NY+cy)*CL_NX+cx)<<2)|sp;
        if (!clTouched[g]){ clTouched[g]=1; clX[g]=clY[g]=clZ[g]=clC[g]=0; }
        clX[g]+=mol.x[i]; clY[g]+=mol.y[i]; clZ[g]+=mol.z[i]; clC[g]++;
        nFar++;
        continue;
      }
    }

    if (px < 3.2){
      /* נראית, אבל לא מספיק גדולה כדי להבחין באטומים שבתוכה */
      if (k>=MAX) break;
      const E=ELEM[S.atoms[0][0]];
      inst.off[k*3]=mol.x[i]; inst.off[k*3+1]=mol.y[i]; inst.off[k*3+2]=mol.z[i];
      const g = flash>0 && mol.sp[i]==='H2O' ? flash*1.6 : 0;
      inst.col[k*3]=Math.min(1,E.col[0]+g);
      inst.col[k*3+1]=Math.min(1,E.col[1]+g*.8);
      inst.col[k*3+2]=Math.min(1,E.col[2]+g*.5);
      inst.rad[k]=R0*md*0.62; inst.kind[k]=1;
      k++;
      continue;
    }

    /* קרובה — כל אטום בנפרד */
    const a=mol.spin[i], c=Math.cos(a), sn=Math.sin(a);
    const ax=mol.axis[i*3], ay=mol.axis[i*3+1], az=mol.axis[i*3+2];
    for (const [el,off] of S.atoms){
      if (k>=MAX) break;
      const E=ELEM[el], [ox,oy,oz]=off;
      const dt=ax*ox+ay*oy+az*oz;
      const cx=ay*oz-az*oy, cy=az*ox-ax*oz, cz=ax*oy-ay*ox;
      inst.off[k*3]  =mol.x[i]+(ox*c+cx*sn+ax*dt*(1-c))*md;
      inst.off[k*3+1]=mol.y[i]+(oy*c+cy*sn+ay*dt*(1-c))*md;
      inst.off[k*3+2]=mol.z[i]+(oz*c+cz*sn+az*dt*(1-c))*md;
      const g = flash>0 && mol.sp[i]==='H2O' ? flash*1.6 : 0;
      inst.col[k*3]  =Math.min(1,E.col[0]+g);
      inst.col[k*3+1]=Math.min(1,E.col[1]+g*.8);
      inst.col[k*3+2]=Math.min(1,E.col[2]+g*.5);
      inst.rad[k]=E.r*md; inst.kind[k]=1;
      k++;
    }
  }

  /* האשכולות. כדור אחד לכל תא, בנפח של כל מי שבתוכו — ולכן הוא
     תופס בערך את אותו מקום שהם תפסו יחד. */
  if (nFar){
    const SPK=['H2O','O2','H2','N2'];
    for (let g=0; g<CL_N*4; g++){
      if (!clTouched[g] || clC[g]<1) continue;
      if (k>=MAX) break;
      const n=clC[g];
      const E=ELEM[SPECIES[SPK[g&3]].atoms[0][0]];
      inst.off[k*3]=clX[g]/n; inst.off[k*3+1]=clY[g]/n; inst.off[k*3+2]=clZ[g]/n;
      inst.col[k*3]=E.col[0]; inst.col[k*3+1]=E.col[1]; inst.col[k*3+2]=E.col[2];
      inst.rad[k]=R0*0.62*Math.cbrt(n)*1.05; inst.kind[k]=1;
      k++;
    }
  }
  lodStats.drawn=k; lodStats.merged=nFar;
  return k;
}

function buildBlobs(){
  let k=0;
  for (let i=0;i<mol.n;i++){
    if (mol.air[i]) continue;              /* אוויר שקוף — רואים אותו רק במצג המולקולות */
    const S=SPECIES[mol.sp[i]];
    inst.off[k*3]=mol.x[i]; inst.off[k*3+1]=mol.y[i]; inst.off[k*3+2]=mol.z[i];
    const gas=mol.phase[i]===GAS;
    /* בועה היא גז שנוזל עוטף אותו — לא סתם גז. קודם צויר ככדור כל
       מה שהיה גז, ולכן "בועות" רחפו גם מעל פני המים וגם לאורך כל
       הסליל, במקומות שאין בהם טיפת נוזל. גז שפרץ אל מעל פני הנוזל
       הוא אדים: ערפל דליל, לא כדור. */
    const bubble = gas && mol.wet[i]>=4;
    /* ואדים שיצאו אל החדר הפתוח פשוט מתפזרים ונעלמים */
    if (gas && !bubble && mol.where[i]===IN_ROOM) continue;
    /* אדים לא נושאים את צבע הבליעה של החומר — הם ערפל לבן */
    if (gas){ inst.col[k*3]=0.10; inst.col[k*3+1]=0.11; inst.col[k*3+2]=0.125; }
    else { inst.col[k*3]=S.absorb[0]; inst.col[k*3+1]=S.absorb[1]; inst.col[k*3+2]=S.absorb[2]; }
    inst.rad[k]=(bubble?0.150:gas?0.088:0.104)/MSCALE;
    inst.kind[k]=gas?0:1;
    k++;
  }
  return k;
}
function upload(mesh,n,withKind){
  gl.bindVertexArray(mesh.vao);
  const put=(name,arr,size)=>{
    if (!mesh.inst[name]) return;
    gl.bindBuffer(gl.ARRAY_BUFFER,mesh.inst[name]);
    gl.bufferData(gl.ARRAY_BUFFER,arr.subarray(0,n*size),gl.DYNAMIC_DRAW);
  };
  put('aOff',inst.off,3); put('aCol',inst.col,3); put('aRad',inst.rad,1);
  if (withKind) put('aKind',inst.kind,1);
}


/* מפת החום. מציירים רק תאים שחורגים מטמפרטורת החדר, ולכן בחדר קר
   לא מצויר כלום ומעל הלהבה נראית עמודה. הצבע הוא הטמפרטורה: כחול
   קר, אדום חם, לבן לוהט. */
let heatView = false;

/* הצבע הוא הטמפרטורה, והבהירות היא כמה היא חורגת מהחדר. זה חשוב
   בגלל שהשכבה מצוירת בחיבור: תא בטמפרטורת החדר יוצא שחור, ושחור
   בחיבור לא מוסיף כלום — ולכן הוא לא מסתיר את מה שמאחוריו.
   ניסיון ראשון צייר כל תא ככדור אטום, וכשכל החדר התחמם ל-33 מעלות
   כל התאים עברו את הסף והמעבדה נעלמה מאחורי קיר של כדורים. */
function heatColor(T, out, o){
  const d = T - AMBIENT;
  const u = clamp(d/230, -1, 1);
  /* עקומה תלולה ולא ישרה. השכבה מצטברת בחיבור לאורך קו הראייה, ועם
     עקומה ישרה אלפי תאים פושרים מסתכמים ללבן ומוחקים את המעבדה.
     חריגה קטנה כמעט לא נראית, וחריגה גדולה בולטת. */
  const i = Math.pow(Math.min(1, Math.abs(d)/120), 1.30) * 0.60;
  let r,g,b;
  if (u < 0){ const v=-u; r=0.10; g=0.30+0.25*v; b=0.85+0.15*v; }
  else if (u < 0.45){ const v=u/0.45; r=0.25+0.75*v; g=0.22+0.34*v; b=0.72-0.62*v; }
  else { const v=(u-0.45)/0.55; r=1; g=0.56+0.44*v; b=0.10+0.85*v; }
  out[o]=r*i; out[o+1]=g*i; out[o+2]=b*i;
}

function buildHeat(){
  let k=0;
  const {nx,ny,nz,cs,x0,y0,z0,T,mat}=HF;
  for (let iz=0;iz<nz;iz++) for (let iy=0;iy<ny;iy++) for (let ix=0;ix<nx;ix++){
    const c=(iz*ny+iy)*nx+ix;
    const d=T[c]-AMBIENT;
    if (d>-6 && d<6) continue;              /* קרוב לטמפרטורת החדר — לא מצויר */
    if (k>=MAX) break;
    inst.off[k*3]  =x0+(ix+0.5)*cs;
    inst.off[k*3+1]=y0+(iy+0.5)*cs;
    inst.off[k*3+2]=z0+(iz+0.5)*cs;
    heatColor(T[c], inst.col, k*3);
    /* מוצק מצויר קטן וצפוף, אוויר גדול ורך: ככה רואים את ההבדל בין
       חום שיושב בחומר לבין חום שנישא באוויר */
    const hot = Math.min(1, Math.abs(d)/110);
    inst.rad[k]= (mat[c]===MAT_AIR ? cs*0.24 : cs*0.20) * (0.40+0.60*hot);
    inst.kind[k]=1;
    k++;
  }
  return k;
}

/* בחיבור, ובלי לכתוב עומק. השכבה נחסמת על ידי מה שלפניה אבל לא
   מסתירה אותו — כמו זוהר ולא כמו גוף. */
function drawHeat(proj, view, cvn, cvd){
  const n=buildHeat();
  if (!n) return 0;
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.depthMask(false);
  specOn = 0;
  drawAtoms(n, proj, view, cvn, cvd);
  specOn = 1;
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  return n;
}

let specOn = 1;
function drawAtoms(n, proj, view, cvn, cvd){
  gl.useProgram(impostorProg);
  gl.uniformMatrix4fv(impostorProg.u.uProj,false,proj);
  gl.uniformMatrix4fv(impostorProg.u.uView,false,view);
  gl.uniform4f(impostorProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
  gl.uniform1f(impostorProg.u.uSpec, specOn);
  /* כיוון האור מסובב למרחב המצלמה, כי שם חיים האימפוסטורים */
  const L=v3.norm([0.38,0.86,0.34]);
  gl.uniform3f(impostorProg.u.uLightView,
    view[0]*L[0]+view[4]*L[1]+view[8]*L[2],
    view[1]*L[0]+view[5]*L[1]+view[9]*L[2],
    view[2]*L[0]+view[6]*L[1]+view[10]*L[2]);
  upload(atomQuad,n,true);
  gl.drawElementsInstanced(gl.TRIANGLES,atomQuad.n,atomQuad.type,0,n);
}

let realView = FLOAT_FBO, wantReal = FLOAT_FBO;
/* מעבר ×5 המצלמה כבר בתוך הנוזל. שם אין פני שטח לשקף, ומה שכן יש
   לראות הוא המולקולות עצמן — אז המצג מתחלף לבד. זו כל הנקודה בזום. */
const MICRO = 0.20;

/* המרה בין יחידות העולם למטרים: בועת הבקבוק היא 0.90 יחידות, ובקבוק
   250 מ"ל אמיתי הוא כ-3.9 ס"מ רדיוס. */
const M_PER_UNIT = 0.0433;
const MACRO_VIEW_M = 0.307;        /* גובה שדה הראייה בזום מלא החוצה */
let microFov = 4.0;                /* שדה ראייה של המיקרוסקופ, בננומטרים */

function microEnter(){
  if (MC.on) return;
  MC.on = true;
  microFill(clamp(microFov*1.5, 2.4, 6.4));
  syncZoom();
}
function microExit(){
  if (!MC.on) return;
  MC.on = false; cam.zoom = 1/MAXZOOM; syncZoom();
}

/* בקנה מידה של ננומטרים אין חדר, אין זכוכית ואין שולחן — הכל נמצא
   בתוך הנוזל. מצג נפרד לגמרי, עם מערכת צירים משלו בננומטרים. */
function drawMicro(){
  resize();
  $('view').textContent='↩ '+T('exit');
  $('view').classList.remove('on');
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.viewport(0,0,W,H);
  gl.clearColor(0.030,0.062,0.086,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);

  const c=MC.L/2, ctr=[c,c,c];
  const dist=(microFov/2)/Math.tan(FOV/2);
  const ce=Math.cos(cam.el);
  const eye=[c+dist*ce*Math.sin(cam.az), c+dist*Math.sin(cam.el), c+dist*ce*Math.cos(cam.az)];
  const VP=m4.mul(m4.perspective(FOV, W/H, dist*0.02, dist*6), m4.lookAt(eye,ctr,[0,1,0]));

  /* אותו מישור חיתוך, בקנה המידה הזה */
  const fwd=v3.norm(v3.sub(ctr,eye));
  const pp=v3.add(ctr, v3.scale(fwd, MC.L*0.9*(2*cam.slice-1)));
  const clip=[fwd[0],fwd[1],fwd[2], v3.dot(pp,fwd)];

  const view=m4.lookAt(eye,ctr,[0,1,0]);
  const proj=m4.perspective(FOV, W/H, dist*0.02, dist*6);
  const cvn=[ view[0]*clip[0]+view[4]*clip[1]+view[8]*clip[2],
              view[1]*clip[0]+view[5]*clip[1]+view[9]*clip[2],
              view[2]*clip[0]+view[6]*clip[1]+view[10]*clip[2] ];
  const cvd=clip[3]-(view[12]*clip[0]+view[13]*clip[1]+view[14]*clip[2]);
  const n=microInstances();
  drawAtoms(n, proj, view, cvn, cvd);

  resolveTo(sceneFBO);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  gl.bindVertexArray(null);
  gl.useProgram(presentProg);
  gl.uniform1i(presentProg.u.uTex,0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.depthMask(true);
  return n;
}

function draw(){
  if (MC.on) return drawMicro();
  resize();
  const micro = cam.zoom < MICRO;
  realView = micro ? false : (wantReal && FLOAT_FBO);
  $('view').textContent = realView ? '👁 '+T('real')
                      : (micro ? '⚛ '+T('microscope') : '⚛ '+T('molecules'));
  $('view').classList.toggle('on', realView);
  /* האור והריהוט לא זזים לעולם, ולכן מפת הצללים נכונה לתמיד.
     ציור מחדש שלה בכל פריים הוא מעבר שלם על 1600² בלי שום סיבה. */
  if (!shadowFBO){ initShadow(); renderShadow(); }
  const want=fitDistance()*cam.zoom;
  cam.dist = cam.dist>0 ? cam.dist+(want-cam.dist)*0.16 : want;
  const tw=camTarget();
  for (let i=0;i<3;i++) cam.target[i]+=(tw[i]-cam.target[i])*0.16;

  const eye=eyePos();
  const asp=W/H;
  /* המישור הקרוב חייב להתכווץ עם הזום, אחרת בהגדלה עמוקה הוא חותך
     את מה שבאנו לראות */
  const proj=m4.perspective(FOV,asp,Math.max(0.0015,cam.dist*0.012),60);
  const view=m4.lookAt(eye,cam.target,[0,1,0]);
  const VP=m4.mul(proj,view);

  const fwd=v3.norm(v3.sub(cam.target,eye));
  const pp=v3.add(cam.target,v3.scale(fwd,SCENE_R*(2*cam.slice-1)));
  const clip=[fwd[0],fwd[1],fwd[2],v3.dot(pp,fwd)];
  /* אותו מישור, במרחב המצלמה — שם חיים שיידרי הנוזל */
  const cvn=[ view[0]*clip[0]+view[4]*clip[1]+view[8]*clip[2],
              view[1]*clip[0]+view[5]*clip[1]+view[9]*clip[2],
              view[2]*clip[0]+view[6]*clip[1]+view[10]*clip[2] ];
  const cvd=clip[3] - (view[12]*clip[0]+view[13]*clip[1]+view[14]*clip[2]);

  /* --- 1. החדר והשולחן --- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.viewport(0,0,W,H);
  gl.clearColor(0.020,0.023,0.030,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);

  gl.useProgram(roomProg);
  gl.uniformMatrix4fv(roomProg.u.uVP,false,VP);
  gl.uniform4fv(roomProg.u.uClip,clip);
  bindShadow(roomProg);
  gl.bindVertexArray(room.vao);
  gl.drawElements(gl.TRIANGLES,room.n,room.type,0);

  gl.useProgram(woodProg);
  gl.uniformMatrix4fv(woodProg.u.uVP,false,VP);
  gl.uniform4fv(woodProg.u.uClip,clip);
  gl.uniform3fv(woodProg.u.uEye,eye);
  gl.uniform2f(woodProg.u.uOccA,0,0);
  gl.uniform2f(woodProg.u.uOccB,BEAKER_X,0);
  bindShadow(woodProg);
  gl.bindVertexArray(bench.vao);
  gl.drawElements(gl.TRIANGLES,bench.n,bench.type,0);

  gl.useProgram(solidProg);
  gl.uniformMatrix4fv(solidProg.u.uVP,false,VP);
  gl.uniform4fv(solidProg.u.uClip,clip);
  gl.uniform3fv(solidProg.u.uEye,eye);
  bindShadow(solidProg);
  gl.uniform1f(solidProg.u.uEmissive,0);
  gl.uniformMatrix4fv(solidProg.u.uModel,false,IDENT);
  for (const m of [props, rigMesh, jack]){
    gl.bindVertexArray(m.vao);
    gl.drawElements(gl.TRIANGLES,m.n,m.type,0);
  }
  /* הרשת והחצובה מאדימות מעל החום — ברזל מתחיל לזהור סביב 500° */
  gl.uniform1f(solidProg.u.uEmissive, Math.abs(gasTap)*0.75);
  gl.uniform3f(solidProg.u.uEmCol, ...(gasTap<0 ? [0.42,0.72,1.0] : [1.0,0.26,0.05]));
  gl.bindVertexArray(burner.vao);
  gl.drawElements(gl.TRIANGLES,burner.n,burner.type,0);
  gl.uniform1f(solidProg.u.uEmissive,0);

  /* ידית הברז, מסובבת לפי מצבה */
  const ta=tap.a*Math.PI/2, cta=Math.cos(ta), sta=Math.sin(ta);
  gl.uniformMatrix4fv(solidProg.u.uModel,false,new Float32Array([
    cta,0,sta,0,  0,1,0,0,  -sta,0,cta,0,  FX,TAP_Y,0,1]));
  gl.bindVertexArray(handleMesh.vao);
  gl.drawElements(gl.TRIANGLES,handleMesh.n,handleMesh.type,0);
  gl.uniformMatrix4fv(solidProg.u.uModel,false,IDENT);

  let shown=0;

  if (realView && FLOAT_FBO){
    /* --- 2. פותרים את הרקע כדי שהנוזל יוכל לשבור אותו --- */
    resolveTo(sceneFBO);

    /* --- 3. עומק פני הנוזל --- */
    const n=buildBlobs(); shown=n;
    gl.bindFramebuffer(gl.FRAMEBUFFER,fdFBO);
    gl.viewport(0,0,FW,FH);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    gl.useProgram(fluidDepthProg);
    gl.uniformMatrix4fv(fluidDepthProg.u.uProj,false,proj);
    gl.uniformMatrix4fv(fluidDepthProg.u.uView,false,view);
    gl.uniform4f(fluidDepthProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
    upload(billboard,n,true);
    gl.drawElementsInstanced(gl.TRIANGLES,billboard.n,billboard.type,0,n);

    /* --- 3. טשטוש דו-צדדי: אלף כדורים → משטח אחד --- */
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(blurProg);
    gl.uniform1i(blurProg.u.uTex,0); gl.uniform1f(blurProg.u.uDepthFalloff,5.0);
    gl.activeTexture(gl.TEXTURE0);
    for (const [src,dst,dir] of [[fdTex,b1FBO,[1/FW,0]],[b1Tex,fdFBO,[0,1/FH]],
                                 [fdTex,b1FBO,[1.7/FW,0]],[b1Tex,fdFBO,[0,1.7/FH]]]){
      gl.bindFramebuffer(gl.FRAMEBUFFER,dst);
      gl.viewport(0,0,FW,FH);
      gl.bindTexture(gl.TEXTURE_2D,src);
      gl.uniform2f(blurProg.u.uDir,dir[0],dir[1]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }

    /* --- 4. עובי: כמה חומר יש בכל פיקסל, ובאיזה צבע --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER,thFBO);
    gl.viewport(0,0,FW,FH);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    gl.useProgram(fluidThickProg);
    gl.uniformMatrix4fv(fluidThickProg.u.uProj,false,proj);
    gl.uniformMatrix4fv(fluidThickProg.u.uView,false,view);
    gl.uniform4f(fluidThickProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
    upload(billboard2,n,true);
    gl.drawElementsInstanced(gl.TRIANGLES,billboard2.n,billboard2.type,0,n);
    gl.disable(gl.BLEND);

    /* --- 5. הרכבה חזרה לתוך חוצץ הגאומטריה. העומק שם נשאר שלם,
             ולכן הזכוכית שתצויר אחר כך עדיין תיחסם נכון על ידי השולחן. --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
    gl.viewport(0,0,W,H);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(compositeProg);
    const halfV=Math.tan(FOV/2);
    gl.uniform2f(compositeProg.u.uTan,halfV*asp,halfV);
    gl.uniform2f(compositeProg.u.uTexel,1/FW,1/FH);
    gl.uniform4fv(compositeProg.u.uClip,clip);
    const iv=m4.lookAt(eye,cam.target,[0,1,0]);
    gl.uniformMatrix4fv(compositeProg.u.uInvView,false,new Float32Array([
      iv[0],iv[4],iv[8],0, iv[1],iv[5],iv[9],0, iv[2],iv[6],iv[10],0, 0,0,0,1]));
    gl.uniform1i(compositeProg.u.uScene,0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
    gl.uniform1i(compositeProg.u.uDepth,1); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,fdTex);
    gl.uniform1i(compositeProg.u.uThick,2); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,thTex);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.activeTexture(gl.TEXTURE0);

    /* בועות ואדים, בחיבור מעל הנוזל שכבר הורכב */
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    gl.useProgram(bubbleProg);
    gl.uniformMatrix4fv(bubbleProg.u.uProj,false,proj);
    gl.uniformMatrix4fv(bubbleProg.u.uView,false,view);
    gl.uniform4f(bubbleProg.u.uClipView,cvn[0],cvn[1],cvn[2],cvd);
    gl.bindVertexArray(billboard2.vao);
    gl.drawElementsInstanced(gl.TRIANGLES,billboard2.n,billboard2.type,0,n);
    gl.disable(gl.BLEND); gl.depthMask(true);
  } else {
    /* מצג מולקולות: כל אטום ככדור */
    const n=buildAtoms(); shown=n;
    drawAtoms(n, proj, view, cvn, cvd);
  }
  if (heatView) drawHeat(proj, view, cvn, cvd);

  /* --- הלהבה. חיבור, בלי כתיבה לעומק. --- */
  if (gasTap > 0.02){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    gl.useProgram(flameProg);
    gl.uniformMatrix4fv(flameProg.u.uVP,false,VP);
    gl.uniform4fv(flameProg.u.uClip,clip);
    gl.uniform1f(flameProg.u.uTime,performance.now()/1000);
    gl.uniform1f(flameProg.u.uY0,FLAME_Y0);
    gl.uniform1f(flameProg.u.uY1,FLAME_Y1);
    gl.uniform1f(flameProg.u.uOn, clamp(gasTap*1.15,0,1));
    gl.bindVertexArray(flame.vao);
    gl.drawElements(gl.TRIANGLES,flame.n,flame.type,0);
    gl.depthMask(true); gl.disable(gl.BLEND);
  }

  /* --- 6. זכוכית מעל הכל --- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);
  gl.viewport(0,0,W,H);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(glassProg);
  gl.uniformMatrix4fv(glassProg.u.uVP,false,VP);
  gl.uniform3fv(glassProg.u.uEye,eye);
  gl.uniform4fv(glassProg.u.uClip,clip);
  const sorted=[...GLASS].sort((a,b)=>
    Math.hypot(b.ox-eye[0],eye[2])-Math.hypot(a.ox-eye[0],eye[2]));
  for (const g of sorted){
    gl.uniform1f(glassProg.u.uGlow, g.glow?clamp((heat-320)/1500,0,0.30):0);
    gl.uniform1f(glassProg.u.uAxisX, g.axis);
    gl.uniform4fv(glassProg.u.uMark, g.mark);
    gl.uniform1f(glassProg.u.uMarkAng, g.markAng||0);
    gl.bindVertexArray(g.mesh.vao);
    gl.drawElements(gl.TRIANGLES,g.mesh.n,g.mesh.type,0);
  }
  gl.disable(gl.BLEND); gl.depthMask(true);

  /* --- 7. פותרים את ה-MSAA ומציגים --- */
  resolveTo(sceneFBO);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  gl.bindVertexArray(null);
  gl.useProgram(presentProg);
  gl.uniform1i(presentProg.u.uTex,0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.depthMask(true);
  return shown;
}

/* ===========================================================================
   8) הממשק
   =========================================================================== */
const PT=[['H',1,1,1],['He',2,1,18],
  ['Li',3,2,1],['Be',4,2,2],['B',5,2,13],['C',6,2,14],['N',7,2,15],
  ['O',8,2,16],['F',9,2,17],['Ne',10,2,18],
  ['Na',11,3,1],['Mg',12,3,2],['Al',13,3,13],['Si',14,3,14],['P',15,3,15],
  ['S',16,3,16],['Cl',17,3,17],['Ar',18,3,18],
  ['K',19,4,1],['Ca',20,4,2],['Fe',26,4,8],['Cu',29,4,11],['Zn',30,4,12],
  ['Ag',47,5,11],['Au',79,6,11]];
const LIVE={H:'H2', O:'O2'};
let picked='H2';
const $=id=>document.getElementById(id);

(function(){
  const slot=new Map();
  for (const [sym,z,p,g] of PT) slot.set(p*100+g,[sym,z]);
  const html=[];
  for (let p=1;p<=6;p++) for (let g=1;g<=18;g++){
    const e=slot.get(p*100+g);
    if (!e){ html.push('<div class="pt gap"></div>'); continue; }
    const [sym,z]=e, sp=LIVE[sym];
    if (!sp){ html.push('<div class="pt off"></div>'); continue; }
    const c=ELEM[sym].col.map(v=>Math.round(v*255)).join(',');
    html.push(`<button class="pt live" data-sp="${sp}" data-sym="${sym}"
      style="--c:rgb(${c})"><i>${z}</i>${sym}</button>`);
  }
  $('ptable').innerHTML=html.join('');
  $('ptable').addEventListener('click',e=>{
    const b=e.target.closest('button[data-sp]');
    if (b){ picked=b.dataset.sp; syncPick(); closeSheet(); }
  });
})();

function syncPick(){
  const S=SPECIES[picked];
  $('pickName').textContent=nm(S.name);
  $('pickKey').textContent=S.key;
  $('pickDot').style.background='rgb('+ELEM[S.atoms[0][0]].col.map(v=>Math.round(v*255)).join(',')+')';
  for (const b of document.querySelectorAll('.pt.live')) b.classList.toggle('on', b.dataset.sp===picked);
}
/* ניצוץ מקומי: מחמם מעט מולקולות במקום אחד עד מעל סף ההצתה */
function spark(){
  flash=.5;
  let n=0;
  for (let i=0;i<mol.n && n<40;i++)
    if (mol.where[i]===IN_FLASK && mol.y[i]<1.1){ mol.T[i]=Math.max(mol.T[i],IGNITION+120); n++; }
}
function syncHeat(){
  const t=Math.round(heat);
  /* שתי טמפרטורות, ולא אחת: מה שבבקבוק, ולצידו החדר עצמו. הנר מחמם
     את כל החדר ולא רק את מה שמולו, וזה המספר שמראה את זה. */
  $('heatLbl').textContent = heatView
    ? t+'°  ·  '+Math.round(hfProbe(-3.5,4.5,-2.3,5.0,-3.3,2.0))+'° '+T('room')
    : t+'°';
  $('merc').style.height=clamp((t+40)/1240*100,0,100)+'%';
  $('knobDot').style.transform='rotate('+(gasTap*135)+'deg)';
  const g=Math.round(gasTap*100);
  $('burnPct').textContent=(g>0?'🔥':g<0?'❄':'')+Math.abs(g)+'%';
  $('knob').classList.toggle('cold', gasTap<0);
}
function syncCut(){
  $('cut').value=Math.round(cam.slice*100);
  $('cutLbl').textContent=T('cut')+' '+Math.round(cam.slice*100)+'%';
}
const human=v=>v>=1e9?(v/1e9).toFixed(0)+T('bil')
              :v>=1e6?(v/1e6).toFixed(0)+T('mil')
              :v>=1e3?(v/1e3).toFixed(0)+T('K'):Math.round(v);
function syncZoom(){
  if (MC.on){
    $('zoomBtn').textContent='⚛ '+microFov.toFixed(1)+' '+T('nm');
    $('fov').textContent=T('fov')+' '+microFov.toFixed(1)+' '+T('nm')+' · '+T('mag')+' ×'
      + human(MACRO_VIEW_M/(microFov*1e-9)) + ' · ' + MC.n + ' ' + T('realSize');
  } else {
    /* המספר שאומר כמה רחוקים מהאמת: כמה מולקולות אמיתיות כל כדור */
    const k=1/cam.zoom;
    $('zoomBtn').textContent='🔍 ×'+(k<9.5?k.toFixed(1):Math.round(k));
    const m=MACRO_VIEW_M*cam.zoom;
    const per = T('per')+': '+sci(repOf());
    $('fov').textContent = k>1.4
      ? T('fov')+' '+(m*1000).toFixed(m<0.01?2:1)+' '+T('mm')+' · '+per
      : per;
  }
}
function syncAtoms(){
  /* נבנה מרשימת היסודות, לא מרשימה קשיחה — חנקן נוסף ונפל ל-NaN */
  const c={}; for (const k of Object.keys(ELEM)) c[k]=0;
  for (let i=0;i<mol.n;i++) for (const [el,k] of Object.entries(SPECIES[mol.sp[i]].count)) c[el]+=k;
  /* כפול כמה מולקולות אמיתיות מייצג כל כדור. בלי זה פיצול לרזולוציה
     גבוהה יותר נראה כאילו הוא יוצר חומר יש מאין: אותם מים בדיוק,
     והמונה קופץ מ-5112 ל-20448. מה שהשתנה הוא כמה נקודות מתארות
     אותם, לא כמה אטומים יש. */
  const rep=repOf();
  $('atoms').innerHTML=Object.entries(c).filter(([,n])=>n>0).map(([el,n])=>{
    const rgb=ELEM[el].col.map(v=>Math.round(v*255)).join(',');
    return `<b style="background:rgba(${rgb},.13);color:rgb(${rgb})">${sci(n*rep)}<i>${el}</i></b>`;
  }).join('');
}
function addMolecules(sp,count,where){
  for (let i=0;i<count;i++){
    if (where===IN_BEAKER) spawn(sp, BEAKER_X+rand(-.4,.4), rand(.9,1.3), rand(-.4,.4), IN_BEAKER);
    else if (where===IN_FUNNEL) spawn(sp, FX+rand(-.18,.18), rand(BOWL_Y0+0.10,BOWL_Y1-0.12), rand(-.18,.18), IN_FUNNEL);
    else spawn(sp, rand(-.45,.45), rand(.5,1.5), rand(-.45,.45), IN_FLASK);
  }
  syncAtoms();
}
/* אוויר בכל חלל פנוי — גם בכלים וגם בחדר שמסביבם. הצפיפות מוגזמת
   בכוונה: אוויר אמיתי דליל פי אלף ממים, ובבקבוק הזה זה יוצא שתי
   מולקולות. מה שמדויק כאן הוא ההתנהגות, לא הספירה. */
function spawnAir(x,y,z,where){
  const i = spawn(Math.random()<0.78 ? 'N2' : 'O2', x, y, z, where);
  if (i>=0){ mol.air[i]=1; mol.phase[i]=GAS; }
  return i;
}
function fillAir(){
  const n = Math.max(60, Math.round(NMOL*0.09));
  for (let i=0;i<n;i++){
    const r = Math.random();
    if (r<0.55)      spawnAir(rand(-.55,.55), rand(1.05,2.25), rand(-.55,.55), IN_FLASK);
    else if (r<0.85) spawnAir(BEAKER_X+rand(-.45,.45), rand(.2,1.35), rand(-.45,.45), IN_BEAKER);
    else             spawnAir(FX+rand(-.16,.16), rand(BOWL_Y0+.1,BOWL_Y1-.15), rand(-.16,.16), IN_FUNNEL);
  }
  /* אוויר בצינור. בלעדיו האדים מתפשטים אל תוך ריק, וזה משנה גם את
     קצב המילוי וגם את מה שמעביר את החום אל הדופן. */
  for (let k=0;k<PATH.length;k+=2){
    const q=PATH[k];
    spawnAir(q[0]+rand(-.05,.05), q[1]+rand(-.05,.05), q[2]+rand(-.05,.05), IN_TUBE)
      >=0 && (mol.t[mol.n-1]=k);
  }
  fillRoomAir();
}

/* החדר עצמו. פרושׂ בהגרלה בתוך התיבה, וכל מה שנפל בתוך זכוכית
   נדחף החוצה — ככה האוויר יושב על הכלים במקום לחדור אותם. */
function fillRoomAir(){
  const target = Math.round(AIR_BASE * MSCALE*MSCALE*MSCALE);
  for (let k=0, made=0; k<target*6 && made<target; k++){
    const x=rand(ROOM.x0,ROOM.x1), y=rand(ROOM.y0,ROOM.y1), z=rand(ROOM.z0,ROOM.z1);
    const i=spawnAir(x,y,z,IN_ROOM);
    if (i<0) break;
    /* בפנים הכלי? זורקים ומגרילים שוב, במקום לדחוף ולקבל קליפה צפופה */
    const saveX=mol.x[i], saveY=mol.y[i], saveZ=mol.z[i];
    if (pushOutOfGlass(i)){
      mol.x[i]=saveX; mol.y[i]=saveY; mol.z[i]=saveZ;
      kill(i); continue;
    }
    made++;
  }
}

function reset(){
  mol.n=0; gasTap=0; heat=AMBIENT; flash=0; cam.slice=0;
  hfReset();
  /* מספר המולקולות נקבע מהנפח: במרווח אריזה של 0.155 הן ממלאות
     כשליש מהבועה, ונשארים פני נוזל שאפשר לראות */
  for (let i=0;i<NMOL;i++) spawn('H2O', rand(-.52,.52), rand(.10,1.02), rand(-.52,.52), IN_FLASK);
  fillAir();
  syncAtoms(); syncHeat(); syncCut(); syncZoom();
}

/* החוגה: גוררים סביבה, והזווית היא עוצמת הלהבה. שני הכיוונים. */
(function(){
  const k=$('knob'); let down=false, last=0;
  const ang=e=>{ const r=k.getBoundingClientRect();
    return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2)); };
  k.addEventListener('pointerdown',e=>{ down=true; last=ang(e); k.setPointerCapture(e.pointerId); });
  k.addEventListener('pointermove',e=>{
    if(!down) return;
    const a=ang(e); let d=a-last;
    if (d> Math.PI) d-=Math.PI*2;
    if (d<-Math.PI) d+=Math.PI*2;
    last=a;
    gasTap=clamp(gasTap + d/(Math.PI*1.5), -1, 1);
    syncHeat();
  });
  const up=e=>{ down=false; };
  k.addEventListener('pointerup',up); k.addEventListener('pointercancel',up);
})();
$('spark').addEventListener('click',spark);
$('cut').addEventListener('input',e=>{ cam.slice=+e.target.value/100; syncCut(); });
$('zoomBtn').addEventListener('click',()=>{ cam.zoom=cam.zoom<0.9?1:1/12; syncZoom(); });
$('tap').addEventListener('click',e=>{ tap.open=!tap.open; e.target.classList.toggle('on',tap.open); });
$('reset').addEventListener('click',reset);
$('pause').addEventListener('click',e=>{
  paused=!paused; e.target.textContent=paused?'▶':'⏸'; e.target.classList.toggle('on',paused);
});
$('view').addEventListener('click',()=>{
  if (MC.on){ microExit(); cam.zoom=1; syncZoom(); return; }
  if (cam.zoom < MICRO){ cam.zoom=1; syncZoom(); return; }   /* חזרה החוצה */
  if (FLOAT_FBO) wantReal=!wantReal;
});
if (!FLOAT_FBO){
  $('view').textContent='⚛ מולקולות';
  $('view').classList.remove('on');
  $('view').style.opacity='.45';
}
/* החלפת שפה: מרעננים כל טקסט וגם את כיוון הדף */
/* החלפת רמת פירוט: מחשבים מחדש את כל האורכים ובונים את העולם מהתחלה */
function setScale(k){
  applyScale(k);
  try { localStorage.setItem('rls.scale', k); } catch(e){}
  reset(); buildLevels();
}
function buildLevels(){
  $('levels').innerHTML = LEVELS.map(k=>{
    const n=Math.round(240*k*k*k);
    return `<button class="lvl${k===MSCALE?' on':''}" data-k="${k}">`
         + (k/LEVELS[0]).toFixed(1) + '× ' + T('smaller')
         + ' <i>· ' + n.toLocaleString('en') + '</i></button>';
  }).join('');
  for (const b of $('levels').querySelectorAll('.lvl'))
    b.addEventListener('click',()=>setScale(+b.dataset.k));
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang==='he' ? 'rtl' : 'ltr';
  $('spark').querySelector('b').textContent = T('spark');
  $('tap').querySelector('b').textContent   = T('tap');
  $('reset').textContent  = T('reset');
  $('pickUp').textContent = '▲ ' + T('table');
  $('sheetH').textContent = T('ptable');
  $('askT').textContent   = T('askT');
  $('askB').textContent   = T('askB');
  $('askQ').textContent   = T('askQ');
  $('hint').textContent   = T('hint');
  $('langT').textContent  = T('language');
  $('detT').textContent   = T('detail');
  $('airBtn').textContent = '💨 ' + T('air');
  $('heatBtn').textContent = '🌡️ ' + T('heat');
  buildLevels();
  for (const b of document.querySelectorAll('.lang:not(.opt)'))
    b.classList.toggle('on', b.dataset.l===lang);
  /* אחרי לולאת השפות, לא לפניה: הכפתור חולק איתן מחלקה לצורך עיצוב,
     והלולאה הייתה מכבה לו את הסימון בכל פעם מחדש. */
  $('airBtn').classList.toggle('on', showAir);
  $('heatBtn').classList.toggle('on', heatView);
  syncPick(); syncCut(); syncZoom(); syncHeat();
}
$('gear').addEventListener('click',()=>$('langBox').classList.toggle('on'));
$('airBtn').addEventListener('click',()=>{ showAir=!showAir; applyLang(); });
$('heatBtn').addEventListener('click',()=>{ heatView=!heatView; applyLang(); });
/* .opt הוא כפתור הגדרה רגיל שמתחזה לכפתור שפה כדי לקבל את אותו
   עיצוב. בלי הסינון הזה לחיצה עליו מציבה lang=undefined, וכל טקסט
   במשחק נופל בפעם הבאה שמישהו מבקש מחרוזת. */
for (const b of document.querySelectorAll('.lang:not(.opt)'))
  b.addEventListener('click',()=>{
    lang=b.dataset.l;
    try { localStorage.setItem('rls.lang', lang); } catch(e){}
    applyLang(); $('langBox').classList.remove('on');
  });

const openSheet=()=>{ $('sheet').classList.add('open'); $('scrim').classList.add('on'); };
const closeSheet=()=>{ $('sheet').classList.remove('open'); $('scrim').classList.remove('on'); };
$('pickBar').addEventListener('click',openSheet);
$('scrim').addEventListener('click',closeSheet);

/* ===========================================================================
   9) הלולאה
   =========================================================================== */
let last=performance.now(), acc=0, frames=0, fpsT=0, bank=0, speed=1;
const FIXED=1/60;

function loop(now){
  const dt=Math.min((now-last)/1000,0.25);
  last=now;
  /* צעד קבוע: מכשיר איטי מפיל פריימים, אבל הזמן בעולם ממשיך באותו קצב */
  if (!paused){
    bank+=dt*speed;
    if (MC.on){
      /* העולם הגדול עוצר: אתה מסתכל על קופסה של ננומטרים, ואין טעם
         להוציא את התקציב על בקבוק שלא נמצא בפריים */
      for (let i=0;i<3 && bank>=FIXED;i++){ microStep(FIXED, heat); bank-=FIXED; }
    } else {
      for (let i=0;i<5 && bank>=FIXED;i++){ step(FIXED); bank-=FIXED; }
    }
    if (bank>FIXED*5) bank=FIXED*5;
  }
  const shown=draw();
  frames++; fpsT+=dt;
  if (fpsT>0.5){
    $('fps').textContent=Math.round(frames/fpsT)+' fps · '+(MC.on?MC.n:mol.n)+' '+T('mols');
    frames=0; fpsT=0;
  }
  acc+=dt;
  /* המדחום צריך להתעדכן מעצמו. קודם הוא נכתב רק כשנגעו בחוגה, ולכן
     הוא הראה את המעלות של הרגע שבו נגעת ולא של עכשיו. */
  if (acc>0.25){ syncAtoms(); syncHeat(); acc=0; }
  lodFollowZoom();
  requestAnimationFrame(loop);
}

/* אחרי שכל ההצהרות רצו — קודם לכן הקבועים הנגזרים עוד בתחום המת */
applyScale(MSCALE);
hfPaint(); hfWallCells();
reset(); syncPick(); syncZoom(); applyLang();
setTimeout(()=>$('hint').classList.add('gone'),100);
requestAnimationFrame(loop);

/* ווים לבדיקות ולהקלטה */
window.RLS = {
  orbit(d,e){ cam.az+=d; cam.el=clamp(cam.el+e,-0.55,1.25); },
  setSlice(t){ cam.slice=clamp(t,0,1); syncCut(); },
  setZoom(z){ if (MC.on) microExit(); cam.zoom=clamp(z,1/MAXZOOM,1.15); syncZoom(); },
  micro(nm){ microFov=clamp(nm,1.2,7.5); microEnter(); microFill(clamp(microFov*1.5,2.4,6.4)); syncZoom(); },
  macro(){ microExit(); cam.zoom=1; syncZoom(); },
  setHeat(v){ /* לתאימות: ממפה מעלות לעוצמת להבה */ gasTap = v>=AMBIENT ? clamp((v-AMBIENT)/900,0,1) : clamp((v-AMBIENT)/240,-1,0); syncHeat(); },
  setView(real){ wantReal=real&&FLOAT_FBO; },
  setSpeed(v){ speed=v; },
  tune(st,it){ STIFF=st; ITERS=it; },
  add(sp,n,where){ addMolecules(sp,n, where==='beaker'?IN_BEAKER
                                   : where==='funnel'?IN_FUNNEL : IN_FLASK); },
  spark, setBurner(v){ gasTap=clamp(v,-1,1); syncHeat(); },
  tap(o){ tap.open=o; $('tap').classList.toggle('on',o); },
  state(){
    const c={}; for (const k of Object.keys(ELEM)) c[k]=0;
    const by={}, ph=[0,0,0], w=[0,0,0,0,0]; let nAir=0;
    for (let i=0;i<mol.n;i++){
      by[mol.sp[i]]=(by[mol.sp[i]]||0)+1;
      ph[mol.phase[i]]++; w[mol.where[i]]++; if (mol.air[i]) nAir++;
      for (const [el,k] of Object.entries(SPECIES[mol.sp[i]].count)) c[el]+=k;
    }
    return { atoms:c, species:by, n:mol.n, heat:Math.round(heat), realView, floatFBO:FLOAT_FBO,
             phase:{gas:ph[0],liquid:ph[1],solid:ph[2]},
             where:{flask:w[0],tube:w[1],beaker:w[2],funnel:w[3],room:w[4]},
             air:nAir, lod:{...lodStats, step:lodStepOf(), mscale:MSCALE, rep:repOf(), zoom:cam.zoom}, wall:{flask:wallT[W_FLASK+2], tubeIn:wallT[W_TUBE+1],
                             tubeOut:wallT[W_TUBE+WALL_N-2], beaker:wallT[W_BEAKER+2]},
             tap:tap.open,
             field:{ cells:HF.n, room:hfProbe(-3.5,4.5,-2.3,5.0,-3.3,2.0) } };
  },
};
</script>
