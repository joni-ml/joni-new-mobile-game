<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hex Empire</title>
<style>
  :root {
    color-scheme: dark;
    --bar: #042342;
    --panel: rgba(12, 38, 68, 0.94);
    --stroke: #17456f;
    --accent: #2f6bb3;
    --accent-hi: #3d82d4;
    --ink: #eaf1f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #061424; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }

  /* ---- MAP ---- */
  #viewport {
    position: fixed; inset: 0; overflow: hidden;
    background: #0d2233;               /* shows between tiles as hex outlines */
    touch-action: none;
  }
  #board {
    position: absolute; top: 50%; left: 50%;
    transform-origin: top left;
    will-change: transform;
    backface-visibility: hidden;
  }
  .hex {
    position: absolute;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    overflow: hidden;
  }
  /* Terrain decorations drawn on top of the tile color */
  .feat { position: absolute; }
  /* A layered conifer with a trunk, drawn as ONE clip-path (1 node/tree) */
  .pine { clip-path: polygon(50% 0%, 72% 28%, 60% 28%, 80% 56%, 66% 56%, 88% 84%,
          57% 84%, 57% 100%, 43% 100%, 43% 84%, 12% 84%, 34% 56%, 20% 56%,
          40% 28%, 28% 28%); }
  /* A two-peak mountain range silhouette */
  .mtn  { clip-path: polygon(0% 100%, 22% 42%, 38% 66%, 56% 20%, 76% 60%, 100% 100%); }
  .cap  { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
  .hill { border-radius: 50% 50% 0 0; }
  .rock { border-radius: 40% 45% 35% 50%; }

  /* Resource badge, like Unciv's circular tile icons */
  .res {
    position: absolute;
    border-radius: 50%;
    background: #10151c;
    border: 2px solid #f2f4f7;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
  }
  /* Unit token */
  .unit {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4d86d6, #1f4c8f);
    border: 2px solid #cfe0f5;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    box-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 6px 7px rgba(0,0,0,0.45);
    z-index: 6;
  }
  #cursor {
    position: absolute;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: rgba(255,255,255,0.22);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.75);
    pointer-events: none; display: none; z-index: 5;
  }

  /* ---- TOP BAR ---- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: var(--bar);
    border-bottom: 1px solid #0a2f52;
    padding: calc(env(safe-area-inset-top, 0px) + 6px) 8px 4px;
  }
  #toprow { display: flex; align-items: center; gap: 8px; }
  #menuBtn {
    background: none; border: none; color: var(--ink); font-size: 18px;
    padding: 2px 4px; line-height: 1;
  }
  #civ { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  #civ .emblem {
    width: 20px; height: 20px; border-radius: 50%;
    background: #1e5fa8; display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  #stats {
    flex: 1; display: flex; justify-content: center; gap: 10px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
    overflow-x: auto; scrollbar-width: none;
  }
  #stats::-webkit-scrollbar { display: none; }
  #stats .stat { display: flex; align-items: center; gap: 3px; }
  #stats .delta { font-size: 10px; opacity: 0.85; }
  #overviewBtn {
    background: #123a63; color: var(--ink); border: 1px solid var(--stroke);
    border-radius: 14px; padding: 5px 12px; font-size: 12px; font-weight: 600;
  }
  #turnline { text-align: center; font-size: 11px; opacity: 0.85; padding-top: 2px; }

  /* ---- SIDE PANELS ---- */
  #research {
    position: fixed; left: 8px; z-index: 25;
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 8px;
    padding: 6px 8px; display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  #research .ricon {
    width: 26px; height: 26px; border-radius: 6px; background: #0b2c4c;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  #research .rname { font-weight: 600; }
  #research .rturns { opacity: 0.75; font-size: 11px; }

  #nextTurn {
    position: fixed; right: 8px; z-index: 25;
    background: var(--accent); color: #fff; border: 1px solid var(--accent-hi);
    border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 0 #1b4576;
  }
  #nextTurn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1b4576; }

  #notice {
    position: fixed; right: 8px; z-index: 25; max-width: 62%;
    background: #f3f6fa; color: #10233a; border-radius: 12px;
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    display: none;
  }

  #unitsBar {
    position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    z-index: 25; background: var(--panel); border: 1px solid var(--stroke);
    border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600;
  }
  #unitsBar .nav { opacity: 0.7; }
  #unitsBar .uname { min-width: 92px; text-align: center; }

  #minimapWrap {
    position: fixed; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    z-index: 25; background: var(--panel); border: 1px solid var(--stroke);
    border-radius: 8px; padding: 4px;
  }
  #minimap { display: block; border-radius: 4px; }
  #mmView {
    position: absolute; border: 1px solid #fff; border-radius: 2px;
    pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
  }

  #fps {
    position: fixed; left: 8px; z-index: 25;
    background: rgba(0,0,0,0.5); color: #4ade80;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700;
    padding: 3px 6px; border-radius: 5px;
  }
  #tileInfo {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    z-index: 25; background: var(--panel); border: 1px solid var(--stroke);
    border-radius: 8px; padding: 5px 12px; font-size: 12px; display: none;
  }
</style>
</head>
<body>

<div id="viewport"><div id="board"></div></div>

<div id="topbar">
  <div id="toprow">
    <button id="menuBtn">☰</button>
    <div id="civ"><span class="emblem">⚜</span><span id="civName">France</span></div>
    <div id="stats"></div>
    <button id="overviewBtn">Overview</button>
  </div>
  <div id="turnline"><span id="turnText">⏳ 1 | 4000 BC</span></div>
</div>

<div id="research">
  <div class="ricon">🏺</div>
  <div>
    <div class="rname">Pottery</div>
    <div class="rturns">4 turns</div>
  </div>
</div>

<button id="nextTurn">✔ Next turn</button>
<div id="notice"></div>

<div id="unitsBar">
  <span class="nav">◀</span><span class="uname" id="unitName">Warrior</span><span class="nav">▶</span>
</div>

<div id="minimapWrap">
  <canvas id="minimap" width="132" height="112"></canvas>
  <div id="mmView"></div>
</div>

<div id="fps">— FPS</div>
<div id="tileInfo"></div>

<script>
(function () {
  "use strict";

  // ---- CONFIG ----
  const COLS = 30, ROWS = 30;
  const BASE_HEX = 100;

  const viewportEl = document.getElementById('viewport');
  const boardEl = document.getElementById('board');
  const cursorEl = document.createElement('div');
  cursorEl.id = 'cursor';

  // ---- HEX GEOMETRY (flat-top, odd-q vertical layout — same as Unciv) ----
  const H_RATIO = 0.8660254;
  function computeLayout(hexW) {
    const hexH = hexW * H_RATIO, stepX = hexW * 0.75;
    const positions = []; let maxX = 0, maxY = 0;
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = 0; r < ROWS; r++) {
        const cx = c * stepX + hexW / 2;
        const cy = r * hexH + (c % 2 ? hexH : hexH / 2);
        col.push({ cx, cy });
        maxX = Math.max(maxX, cx + hexW / 2);
        maxY = Math.max(maxY, cy + hexH / 2);
      }
      positions.push(col);
    }
    return { hexW, hexH, positions, boardW: maxX, boardH: maxY };
  }
  const layout = computeLayout(BASE_HEX);

  // ---- TERRAIN PALETTE (colors sampled from Unciv) ----
  const TERRA = {
    ocean:     { name: 'Ocean',     col: '#3d8a97' },
    coast:     { name: 'Coast',     col: '#5fb0b8' },
    snow:      { name: 'Snow',      col: '#e2f2f2' },
    tundra:    { name: 'Tundra',    col: '#9fa892' },
    grassland: { name: 'Grassland', col: '#6d9a44' },
    plains:    { name: 'Plains',    col: '#b0a055' },
    desert:    { name: 'Desert',    col: '#c69a70' },
    mountain:  { name: 'Mountains', col: '#8b9698' },
  };

  // ---- MAP GENERATION ----
  // Two independent random fields, both built from scattered "seeds" that
  // neighbouring hexes blend toward (inverse-distance), so features come out
  // as random blobs — Minecraft-style, not latitude bands.
  //   heat  -> snow / tundra / grassland / plains / desert
  //   elev  -> water (low), hills, mountains (high)
  let heatGrid = [], elevGrid = [], tiles = [];
  let startHex = { c: (COLS / 2) | 0, r: (ROWS / 2) | 0 };

  function blobField(seedSpecs) {
    const seeds = [];
    for (const [n, lo, hi] of seedSpecs) {
      for (let i = 0; i < n; i++) {
        seeds.push({ c: Math.random() * (COLS - 1), r: Math.random() * (ROWS - 1),
                     v: lo + Math.random() * (hi - lo) });
      }
    }
    const grid = [];
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = 0; r < ROWS; r++) {
        let ws = 0, vs = 0;
        for (const s of seeds) {
          const dc = s.c - c, dr = s.r - r;
          const w = 1 / (dc * dc + dr * dr + 1.2);
          ws += w; vs += w * s.v;
        }
        let v = vs / ws;
        v += (Math.sin(c * 1.7 + r * 0.9) + Math.sin((c - r) * 1.3)) * 0.025;
        col.push(Math.max(0, Math.min(1, v)));
      }
      grid.push(col);
    }
    return grid;
  }

  function generateMap() {
    heatGrid = blobField([[3, 0.85, 1.0], [3, 0.0, 0.15], [4, 0.35, 0.65]]);
    elevGrid = blobField([[3, 0.85, 1.0], [4, 0.0, 0.18], [4, 0.35, 0.6]]);

    tiles = [];
    let bestC = 0, bestR = 0, bestScore = -Infinity;
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = 0; r < ROWS; r++) {
        const heat = heatGrid[c][r], elev = elevGrid[c][r];
        // One solid continent: ocean only rings the outside of the map, so
        // no lakes or seas ever break up the middle. The shoreline wobbles
        // with the elevation field so the coast isn't a straight rectangle.
        const edge = Math.min(c, r, COLS - 1 - c, ROWS - 1 - r);
        const shore = 2.4 + (elev - 0.5) * 2.2;
        let t, feature = null;
        if (edge < shore - 1.1) { t = TERRA.ocean; }
        else if (edge < shore)  { t = TERRA.coast; }
        else if (elev > 0.86) { t = TERRA.mountain; feature = 'mtn'; }
        else {
          if (heat < 0.15)      t = TERRA.snow;
          else if (heat < 0.32) t = TERRA.tundra;
          else if (heat < 0.58) t = TERRA.grassland;
          else if (heat < 0.78) t = TERRA.plains;
          else                  t = TERRA.desert;
          if (elev > 0.72) feature = 'hill';
          // Forests grow on cool-to-mild land, never in desert/snow.
          else if (heat > 0.22 && heat < 0.62 && Math.random() < 0.22) feature = 'forest';
          else if (t === TERRA.desert && Math.random() < 0.12) feature = 'rock';
        }
        const water = (t === TERRA.ocean || t === TERRA.coast);
        col.push({ terrain: t, feature, heat, elev, water });

        // Best start: temperate grassland, no feature, away from the edges.
        if (!water && t === TERRA.grassland && !feature) {
          const score = -Math.abs(heat - 0.45) * 4 + Math.min(edge, 5);
          if (score > bestScore) { bestScore = score; bestC = c; bestR = r; }
        }
      }
      tiles.push(col);
    }
    startHex = { c: bestC, r: bestR };

    // A few resource badges scattered on land, like Unciv's tile resources.
    const RES = ['🐑', '🐄', '🍇', '🪨'];
    let placed = 0, guard = 0;
    while (placed < 14 && guard++ < 600) {
      const c = (Math.random() * COLS) | 0, r = (Math.random() * ROWS) | 0;
      const tl = tiles[c][r];
      if (tl.water || tl.res || tl.feature === 'mtn') continue;
      tl.res = RES[(Math.random() * RES.length) | 0];
      placed++;
    }
  }

  // ---- BUILD BOARD (once) ----
  // Tiles are drawn slightly smaller than their cell so the dark background
  // shows through as thin hex outlines — Unciv's tile borders, for free.
  function buildBoard() {
    boardEl.style.width = layout.boardW + 'px';
    boardEl.style.height = layout.boardH + 'px';
    boardEl.innerHTML = '';
    const tileW = layout.hexW * 0.985, tileH = layout.hexH * 0.985;

    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const tl = tiles[c][r], p = layout.positions[c][r];
        const hex = document.createElement('div');
        hex.className = 'hex';
        hex.style.width = tileW + 'px';
        hex.style.height = tileH + 'px';
        hex.style.left = (p.cx - tileW / 2) + 'px';
        hex.style.top = (p.cy - tileH / 2) + 'px';
        hex.style.background = shade(tl.terrain.col, c, r);
        addFeature(hex, tl, tileW, tileH);
        if (tl.res) addResource(hex, tl.res, tileW, tileH);
        boardEl.appendChild(hex);
      }
    }
    cursorEl.style.width = tileW + 'px';
    cursorEl.style.height = tileH + 'px';
    boardEl.appendChild(cursorEl);
    buildUnit(tileW);
  }

  // Slight per-tile lightness jitter so a biome isn't a flat slab.
  function shade(hexCol, c, r) {
    const v = (Math.sin(c * 1.3 + r * 0.7) + Math.sin((c - r) * 0.9)) * 3.2;
    const n = parseInt(hexCol.slice(1), 16);
    const f = 1 + v / 100;
    const cl = x => Math.max(0, Math.min(255, Math.round(x * f)));
    return `rgb(${cl((n >> 16) & 255)}, ${cl((n >> 8) & 255)}, ${cl(n & 255)})`;
  }

  function mk(cls, parent, css) {
    const d = document.createElement('div');
    d.className = 'feat ' + cls;
    Object.assign(d.style, css);
    parent.appendChild(d);
    return d;
  }

  function addFeature(hex, tl, w, h) {
    if (tl.feature === 'mtn') {
      // A back ridge and a lighter front range, with a snow cap on the peak.
      mk('mtn', hex, { left: w * 0.10 + 'px', top: h * 0.16 + 'px',
        width: w * 0.58 + 'px', height: h * 0.62 + 'px', background: '#6d777a' });
      mk('mtn', hex, { left: w * 0.34 + 'px', top: h * 0.24 + 'px',
        width: w * 0.60 + 'px', height: h * 0.56 + 'px', background: '#9aa4a6' });
      mk('cap', hex, { left: w * 0.55 + 'px', top: h * 0.245 + 'px',
        width: w * 0.15 + 'px', height: h * 0.14 + 'px', background: '#eef6f6' });
    } else if (tl.feature === 'hill') {
      mk('hill', hex, { left: w * 0.18 + 'px', top: h * 0.46 + 'px',
        width: w * 0.36 + 'px', height: h * 0.26 + 'px', background: 'rgba(0,0,0,0.20)' });
      mk('hill', hex, { left: w * 0.46 + 'px', top: h * 0.40 + 'px',
        width: w * 0.38 + 'px', height: h * 0.30 + 'px', background: 'rgba(0,0,0,0.13)' });
      mk('hill', hex, { left: w * 0.50 + 'px', top: h * 0.42 + 'px',
        width: w * 0.16 + 'px', height: h * 0.12 + 'px', background: 'rgba(255,255,255,0.16)' });
    } else if (tl.feature === 'forest') {
      // Three layered conifers, staggered and slightly different sizes/greens.
      const trees = [
        { x: 0.18, y: 0.34, s: 0.30, col: '#2f5b2a' },
        { x: 0.44, y: 0.20, s: 0.36, col: '#3d7034' },
        { x: 0.60, y: 0.42, s: 0.28, col: '#345f2c' },
      ];
      for (const t of trees) {
        mk('pine', hex, { left: w * t.x + 'px', top: h * t.y + 'px',
          width: w * t.s + 'px', height: h * (t.s * 1.5) + 'px', background: t.col });
      }
    } else if (tl.feature === 'rock') {
      mk('rock', hex, { left: w * 0.30 + 'px', top: h * 0.46 + 'px',
        width: w * 0.20 + 'px', height: h * 0.16 + 'px', background: 'rgba(255,255,255,0.30)' });
      mk('rock', hex, { left: w * 0.56 + 'px', top: h * 0.54 + 'px',
        width: w * 0.14 + 'px', height: h * 0.12 + 'px', background: 'rgba(255,255,255,0.22)' });
    }
  }

  function addResource(hex, emoji, w, h) {
    const d = document.createElement('div');
    d.className = 'res';
    const size = w * 0.40;
    Object.assign(d.style, {
      width: size + 'px', height: size + 'px',
      left: (w * 0.54) + 'px', top: (h * 0.10) + 'px',
      fontSize: (size * 0.60) + 'px',
    });
    d.textContent = emoji;
    hex.appendChild(d);
  }

  // ---- UNIT ----
  let unit = { c: 0, r: 0, name: 'Warrior', icon: '🗡' };
  let unitEl = null;
  function buildUnit(tileW) {
    unit.c = startHex.c; unit.r = startHex.r;
    unitEl = document.createElement('div');
    unitEl.className = 'unit';
    const size = tileW * 0.40;
    unitEl.style.width = size + 'px';
    unitEl.style.height = size + 'px';
    unitEl.style.fontSize = (size * 0.55) + 'px';
    unitEl.textContent = unit.icon;
    boardEl.appendChild(unitEl);
    placeUnit();
    document.getElementById('unitName').textContent = unit.name;
  }
  function placeUnit() {
    const p = layout.positions[unit.c][unit.r];
    const s = parseFloat(unitEl.style.width);
    unitEl.style.left = (p.cx - s / 2) + 'px';
    unitEl.style.top = (p.cy - s / 2) + 'px';
  }

  // ---- PAN / ZOOM ----
  let cellSize = BASE_HEX, panX = 0, panY = 0, minCell = 20, maxCell = 200;

  function computeZoomBounds() {
    const shortSide = Math.min(viewportEl.clientWidth, viewportEl.clientHeight);
    minCell = shortSide / (Math.min(COLS, ROWS) * 0.9);
    maxCell = shortSide / 2.2;
  }
  function clampPan() {
    const s = cellSize / BASE_HEX;
    const margin = BASE_HEX * s;
    const cX = (layout.boardW / 2) * (1 - s), cY = (layout.boardH / 2) * (1 - s);
    const sx = Math.max(margin, (layout.boardW * s - viewportEl.clientWidth) / 2 + margin);
    const sy = Math.max(margin, (layout.boardH * s - viewportEl.clientHeight) / 2 + margin);
    panX = Math.max(cX - sx, Math.min(cX + sx, panX));
    panY = Math.max(cY - sy, Math.min(cY + sy, panY));
  }
  function applyTransform() {
    const s = cellSize / BASE_HEX;
    boardEl.style.transform =
      `translate(-50%, -50%) translate(${panX}px, ${panY}px) scale(${s}) translateZ(0)`;
    updateMinimapView();
  }
  let scheduled = false;
  function scheduleTransform() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; clampPan(); applyTransform(); });
  }
  function setZoom(newCell, ax, ay) {
    newCell = Math.max(minCell, Math.min(maxCell, newCell));
    const rect = viewportEl.getBoundingClientRect();
    if (ax === undefined) { ax = rect.left + rect.width / 2; ay = rect.top + rect.height / 2; }
    const vx = ax - rect.left - rect.width / 2, vy = ay - rect.top - rect.height / 2;
    const os = cellSize / BASE_HEX;
    const bx = (vx - panX + layout.boardW / 2) / os, by = (vy - panY + layout.boardH / 2) / os;
    cellSize = newCell;
    const s = cellSize / BASE_HEX;
    panX = vx - s * bx + layout.boardW / 2;
    panY = vy - s * by + layout.boardH / 2;
    clampPan(); scheduleTransform();
  }
  function centerOnHex(c, r) {
    const s = cellSize / BASE_HEX, p = layout.positions[c][r];
    panX = layout.boardW / 2 - s * p.cx;
    panY = layout.boardH / 2 - s * p.cy;
    clampPan();
  }

  // ---- HIT TESTING ----
  function hexAtClient(x, y) {
    const rect = viewportEl.getBoundingClientRect();
    const s = cellSize / BASE_HEX;
    const vx = x - rect.left - rect.width / 2, vy = y - rect.top - rect.height / 2;
    const bx = (vx - panX + layout.boardW / 2) / s, by = (vy - panY + layout.boardH / 2) / s;
    let best = null, bd = Infinity;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const p = layout.positions[c][r];
        const dc = p.cx - bx, dr = p.cy - by, d = dc * dc + dr * dr;
        if (d < bd) { bd = d; best = { c, r }; }
      }
    }
    if (!best || Math.sqrt(bd) > layout.hexW * 0.6) return null;
    return best;
  }

  const infoEl = document.getElementById('tileInfo');
  function selectHex(c, r) {
    const p = layout.positions[c][r];
    cursorEl.style.left = (p.cx - parseFloat(cursorEl.style.width) / 2) + 'px';
    cursorEl.style.top = (p.cy - parseFloat(cursorEl.style.height) / 2) + 'px';
    cursorEl.style.display = 'block';
    const tl = tiles[c][r];
    const bits = [tl.terrain.name];
    if (tl.feature === 'forest') bits.push('Forest');
    if (tl.feature === 'hill') bits.push('Hills');
    if (tl.res) bits.push(tl.res);
    bits.push('🌡 ' + Math.round(tl.heat * 100) + '%');
    infoEl.textContent = bits.join(' · ');
    infoEl.style.display = 'block';
  }

  // ---- INPUT ----
  let lastPan = null, lastPinch = null, moved = false, downPt = null, downT = 0;
  function dist(a, b) { const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY; return Math.hypot(dx, dy); }

  viewportEl.addEventListener('touchstart', (e) => {
    moved = false;
    if (e.touches.length === 1) {
      lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      downPt = lastPan; downT = Date.now(); lastPinch = null;
    } else if (e.touches.length === 2) { lastPinch = dist(e.touches[0], e.touches[1]); lastPan = null; }
  }, { passive: true });

  viewportEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && lastPan) {
      const dx = e.touches[0].clientX - lastPan.x, dy = e.touches[0].clientY - lastPan.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      panX += dx; panY += dy;
      lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      scheduleTransform();
    } else if (e.touches.length === 2) {
      moved = true;
      const d = dist(e.touches[0], e.touches[1]);
      const mid = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
      if (lastPinch) setZoom(cellSize * Math.pow(d / lastPinch, 1.4), mid.x, mid.y);
      lastPinch = d;
    }
  }, { passive: true });

  viewportEl.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      if (!moved && downPt && Date.now() - downT < 300) {
        const h = hexAtClient(downPt.x, downPt.y);
        if (h) selectHex(h.c, h.r);
      }
      lastPan = null; lastPinch = null;
    } else if (e.touches.length === 1) {
      lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY }; lastPinch = null;
    }
  }, { passive: true });

  let mDown = false, mMoved = false, mLast = null, mDownPt = null;
  viewportEl.addEventListener('mousedown', (e) => {
    mDown = true; mMoved = false; mLast = { x: e.clientX, y: e.clientY }; mDownPt = mLast;
  });
  window.addEventListener('mousemove', (e) => {
    if (!mDown) return;
    const dx = e.clientX - mLast.x, dy = e.clientY - mLast.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) mMoved = true;
    panX += dx; panY += dy;
    mLast = { x: e.clientX, y: e.clientY };
    scheduleTransform();
  });
  window.addEventListener('mouseup', () => {
    if (mDown && !mMoved && mDownPt) {
      const h = hexAtClient(mDownPt.x, mDownPt.y);
      if (h) selectHex(h.c, h.r);
    }
    mDown = false; mLast = null;
  });
  viewportEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    setZoom(cellSize * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });

  // ---- TOP BAR STATS + TURNS ----
  const STAT_DEFS = [
    { key: 'gold',    icon: '🪙', color: '#f2c94c' },
    { key: 'food',    icon: '🍎', color: '#7ec8e3' },
    { key: 'happy',   icon: '😊', color: '#f2c94c' },
    { key: 'culture', icon: '🎵', color: '#c58cf5' },
    { key: 'science', icon: '🔬', color: '#7ec8e3' },
  ];
  const state = {
    turn: 1, year: 4000,
    gold: 15, goldD: 5, food: 4, happy: 5, culture: 3, science: 0,
  };
  function renderStats() {
    document.getElementById('stats').innerHTML = STAT_DEFS.map(s => {
      const v = state[s.key];
      const d = s.key === 'gold' ? ` <span class="delta">+${state.goldD}</span>` : '';
      return `<span class="stat" style="color:${s.color}">${s.icon} ${v}${d}</span>`;
    }).join('');
    document.getElementById('turnText').textContent =
      `⏳ ${state.turn} | ${state.year > 0 ? state.year + ' BC' : (-state.year) + ' AD'}`;
  }
  function showNotice(msg) {
    const n = document.getElementById('notice');
    n.textContent = msg; n.style.display = 'block';
    clearTimeout(showNotice._t);
    showNotice._t = setTimeout(() => { n.style.display = 'none'; }, 3200);
  }
  document.getElementById('nextTurn').addEventListener('click', () => {
    state.turn++;
    state.year -= 40;
    state.gold += state.goldD;
    state.science += 1;
    if (state.turn % 4 === 0) state.culture += 1;
    renderStats();
    showNotice('Turn ' + state.turn + ' — your empire grows!');
  });

  // ---- MINIMAP ----
  const mm = document.getElementById('minimap');
  const mmView = document.getElementById('mmView');
  function drawMinimap() {
    const ctx = mm.getContext('2d');
    const sx = mm.width / layout.boardW, sy = mm.height / layout.boardH;
    ctx.fillStyle = '#0d2233';
    ctx.fillRect(0, 0, mm.width, mm.height);
    const w = layout.hexW * sx * 1.1, h = layout.hexH * sy * 1.1;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const p = layout.positions[c][r];
        ctx.fillStyle = tiles[c][r].terrain.col;
        ctx.fillRect(p.cx * sx - w / 2, p.cy * sy - h / 2, w, h);
      }
    }
  }
  const MM_PAD = 4; // #minimapWrap padding — the canvas's offset inside it
  function updateMinimapView() {
    const s = cellSize / BASE_HEX;
    const sx = mm.width / layout.boardW, sy = mm.height / layout.boardH;
    // Board-local coords currently at the viewport's top-left corner.
    const vw = viewportEl.clientWidth, vh = viewportEl.clientHeight;
    const bx = (-vw / 2 - panX + layout.boardW / 2) / s;
    const by = (-vh / 2 - panY + layout.boardH / 2) / s;
    const x0 = Math.max(0, Math.min(mm.width, bx * sx));
    const y0 = Math.max(0, Math.min(mm.height, by * sy));
    mmView.style.left = (MM_PAD + x0) + 'px';
    mmView.style.top = (MM_PAD + y0) + 'px';
    mmView.style.width = Math.max(4, Math.min(mm.width - x0, (vw / s) * sx)) + 'px';
    mmView.style.height = Math.max(4, Math.min(mm.height - y0, (vh / s) * sy)) + 'px';
  }

  // ---- FPS ----
  function startFps() {
    const el = document.getElementById('fps');
    let f = 0, t0 = performance.now();
    (function loop(now) {
      f++;
      if (now - t0 >= 500) { el.textContent = Math.round(f * 1000 / (now - t0)) + ' FPS'; f = 0; t0 = now; }
      requestAnimationFrame(loop);
    })(performance.now());
  }

  // Keep the floating panels clear of the top bar.
  function layoutPanels() {
    const barH = document.getElementById('topbar').offsetHeight;
    document.getElementById('research').style.top = (barH + 8) + 'px';
    document.getElementById('nextTurn').style.top = (barH + 8) + 'px';
    document.getElementById('notice').style.top = (barH + 74) + 'px';
    document.getElementById('fps').style.top = (barH + 62) + 'px';
  }

  // ---- INIT ----
  function init() {
    computeZoomBounds();
    cellSize = Math.min(maxCell, minCell * 2.2);   // start zoomed in, Unciv-like
    generateMap();
    buildBoard();
    centerOnHex(startHex.c, startHex.r);
    selectHex(startHex.c, startHex.r);
    applyTransform();
    renderStats();
    drawMinimap();
    layoutPanels();
    updateMinimapView();
    startFps();
    showNotice('Your Warrior stands on fertile Grassland.');
  }
  window.addEventListener('resize', () => {
    computeZoomBounds();
    cellSize = Math.max(minCell, Math.min(maxCell, cellSize));
    clampPan(); applyTransform(); layoutPanels();
  });

  init();
})();
</script>
</body>
</html>
