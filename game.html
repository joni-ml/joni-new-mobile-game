  function renderMoves() {
    for (const d of dotEls) { dropRow(d); d.remove(); }
    dotEls = [];
    if (!colWrap.length || !unitSelected) return;
    const size = layout.hexW * 0.26;
    for (const k of reachable.keys()) {
      const [c, r] = k.split(',').map(Number);
      const p = layout.positions[c][r];
      const d = document.createElement('div');
      d.className = 'movedot';
      Object.assign(d.style, {
        width: size + 'px', height: size + 'px',
        left: (p.cx - size / 2) + 'px', top: (p.cy - size / 2) + 'px',
      });
      colWrap[c].appendChild(d);
      setRow(d, r);
      dotEls.push(d);
    }
  }

  // Tapping: a unit's tile selects it (or toggles it off), a reachable tile
  // moves the selected unit, and anything else is ignored while one is
  // selected so the dots never get cancelled by a stray tap.
  function onTapHex(c, r) {
    const idx = units.findIndex(u => u.c === c && u.r === r);
    if (idx >= 0) {
      if (idx === sel) unitSelected = !unitSelected;
      else { sel = idx; unitSelected = true; }
      if (unitSelected) computeReachable();
      renderMoves();
      updateUnitBar();
      selectHex(c, r);
      return;
    }
    if (unitSelected) {
      const k = c + ',' + r;
      if (!reachable.has(k)) return;
      const u = curUnit();
      u.moves -= reachable.get(k);
      u.c = c; u.r = r;
      placeUnit(u);
      updateFog();
      computeReachable();
      renderMoves();
      updateUnitBar();
      if (u.moves <= 0) { unitSelected = false; renderMoves(); }
      selectHex(c, r);
      return;
    }
    selectHex(c, r);       // nothing selected — just inspect the tile
  }

  // ---- PAN / ZOOM ----
  let cellSize = BASE_HEX, panX = 0, panY = 0, minCell = 20, maxCell = 200;

  function computeZoomBounds() {
    const vw = viewportEl.clientWidth, vh = viewportEl.clientHeight;
    // Because the world wraps with a single copy of each column, you can never
    // zoom out past one full world width — otherwise the world would be
    // narrower than the screen and leave empty strips at the seam.
    // 1.35 so a column only ever jumps to its other copy well outside the
    // screen — at exactly one world width the jump happens on the edge and
    // you see tiles popping while panning or zooming.
    minCell = Math.max(BASE_HEX * vw / layout.worldW,
                       BASE_HEX * vh / layout.worldH) * 1.35;
    maxCell = Math.min(vw, vh) / 2.2;
    if (maxCell < minCell * 1.4) maxCell = minCell * 1.4;
  }
  function clampPan() {
    const s = cellSize / BASE_HEX;
    // The world is a torus — neither axis is clamped. Pan is only kept inside
    // one world so the numbers can't drift.
    //
    // What gets wrapped is the pan MINUS half the board, because that is the
    // quantity the transform actually uses: a tile lands at
    //   screen = viewportCentre + tile * s + pan - board / 2
    // and board/2 is in unscaled pixels. Wrapping the raw pan instead threw
    // that offset away, and once you zoomed out far enough that one world was
    // narrower than board/2, no value of pan could put the map back on screen
    // and it went black.
    const wpx = layout.worldW * s, hpx = layout.worldH * s;
    // Wrap into a CENTRED interval, [-half a world, +half a world), not
    // [0, one world). updateWrap only looks one world either side, so if the
    // offset is allowed to grow to a full world the copy it needs can be two
    // worlds away and the far side of the seam goes black.
    const wrap = (v, m) => { const x = ((v % m) + m) % m; return x > m / 2 ? x - m : x; };
    panX = layout.boardW / 2 + wrap(panX - layout.boardW / 2, wpx);
    panY = layout.boardH / 2 + wrap(panY - layout.boardH / 2, hpx);
  }

  // Each column lives in its own wrapper. Whichever copy of a column (one
  // world to the left, here, or one to the right) is nearest the viewport is
  // the one we draw — so you can keep dragging forever and the map repeats
  // seamlessly, with no visible edge. Only 30 transforms, no cloned tiles.
  let colWrap = [], hexEls = [], sandEls = [];
  // Horizontal wrap is done by shifting a whole column wrapper. Vertical wrap
  // can't use the same trick (a column spans every row), so instead every
  // element remembers which ROW it belongs to and gets its own translateY.
  // Rows only flip when the seam is crossed, so this writes very rarely.
  let rowEls = [], rowM = [];

  function setRow(el, r) {
    if (el._row !== undefined && rowEls[el._row]) {
      const arr = rowEls[el._row], i = arr.indexOf(el);
      if (i >= 0) arr.splice(i, 1);
    }
    el._row = r;
    if (!rowEls[r]) rowEls[r] = [];
    rowEls[r].push(el);
    el.style.transform = rowM[r] ? 'translateY(' + (rowM[r] * layout.worldH) + 'px)' : '';
  }
  function dropRow(el) {
    if (el._row !== undefined && rowEls[el._row]) {
      const arr = rowEls[el._row], i = arr.indexOf(el);
      if (i >= 0) arr.splice(i, 1);
    }
    el._row = undefined;
  }

  function updateWrap() {
    if (!colWrap.length) return;
    const s = cellSize / BASE_HEX;
    // Half a viewport plus one hex of slack, so a column is already in place
    // before any of it can appear at the edge of the screen.
    const half = viewportEl.clientWidth / 2 + layout.hexW * s * 1.2;
    for (let c = 0; c < COLS; c++) {
      const cx = layout.positions[c][0].cx;
      let bestK = 0, bestD = Infinity;
      for (let k = -1; k <= 1; k++) {
        const d = Math.abs((cx + k * layout.worldW) * s + panX - layout.boardW / 2);
        if (d < bestD) { bestD = d; bestK = k; }
      }
      const w = colWrap[c];
      if (w._k !== bestK) {
        w._k = bestK;
        w.style.transform = bestK ? 'translateX(' + (bestK * layout.worldW) + 'px)' : '';
      }
      // A column you cannot see costs nothing to skip and a lot to composite.
      // On a 200-wide world only a handful of columns are ever on screen, so
      // dropping the rest keeps the frame cost tied to the viewport instead of
      // to how much of the map you have explored.
      const on = bestD < half;
      if (w._on !== on) { w._on = on; w.style.display = on ? '' : 'none'; }
    }
    for (let r = 0; r < ROWS; r++) {
      const cy = layout.positions[0][r].cy;
      let bestM = 0, bestD = Infinity;
      for (let m = -1; m <= 1; m++) {
        const d = Math.abs((cy + m * layout.worldH) * s + panY - layout.boardH / 2);
        if (d < bestD) { bestD = d; bestM = m; }
      }
      if (rowM[r] !== bestM) {
        rowM[r] = bestM;
        const t = bestM ? 'translateY(' + (bestM * layout.worldH) + 'px)' : '';
        const arr = rowEls[r];
        if (arr) for (const el of arr) el.style.transform = t;
      }
    }
  }
  // How many tiles may be on screen before each step down. What costs a frame
  // is the NUMBER of tiles being drawn, not how far out the zoom is: on the
  // same viewport, 108 tiles held 57 fps at full detail and 155 fell to 44.
  // Counting tiles also means that early in a game, when you have explored
  // almost nothing, the full artwork survives however far out you zoom —
  // there is hardly anything on screen to draw.
  let FULL_MAX = 110, MID_MAX = 330, FAR_MAX = 2000, ATLAS_MAX = 480;
  function drawnTiles() {
    const sc = cellSize / BASE_HEX;
    const onScreen = Math.ceil(viewportEl.clientWidth / (layout.hexW * 0.75 * sc))
                   * Math.ceil(viewportEl.clientHeight / (layout.hexH * sc));
    return revealAll ? onScreen : Math.min(onScreen, seenList.length);
  }
  // ---- THE ATLAS: the far-zoom view ----
  // Zoomed right out on a big world there are twelve thousand tiles on screen
  // and one element each is more than the browser will composite smoothly —
  // it measured seventeen frames a second. None of that detail survives at
  // seven pixels a tile anyway, so past a certain count the board is hidden
  // and the same tiles are painted as flat rectangles onto one canvas.
  //
  // This is the opposite of the right answer close in: a canvas has to repaint
  // every tile every frame, where the board is composited by the GPU and costs
  // nothing to move. It only wins once the tile count is high enough that the
  // per-element cost dominates, which is exactly where it is switched on.
  const atlasEl = document.getElementById('atlas');
  const dimCache = {};
  // The haze over a tile you are only being shown. The height map lifts it to
  // 0.78 because at 0.42 the elevation ramp stops measuring clean — the steps
  // collapse into each other and the dark end sinks into the page.
  function dimCol(col) {
    const f = heightMap ? 0.78 : 0.42;
    const key = col + f;
    if (!dimCache[key]) {
      const n = parseInt(col.slice(1), 16);
      dimCache[key] = `rgb(${Math.round(((n >> 16) & 255) * f)},` +
                      `${Math.round(((n >> 8) & 255) * f)},${Math.round((n & 255) * f)})`;
    }
    return dimCache[key];
  }
  function drawAtlas() {
    const vw = viewportEl.clientWidth, vh = viewportEl.clientHeight;
    if (atlasEl.width !== vw || atlasEl.height !== vh) { atlasEl.width = vw; atlasEl.height = vh; }
    const ctx = atlasEl.getContext('2d');
    ctx.fillStyle = '#05090f';
    ctx.fillRect(0, 0, vw, vh);
    const sc = cellSize / BASE_HEX;
    // Hexagons are drawn a touch under size so the dark ground shows between
    // them as the same thin outline the board has. Rectangles are drawn a
    // touch over, because at that size an outline is just noise and a gap
    // would show as a grid of dark lines.
    const asHex = layout.hexW * sc > 14;
    const grow = asHex ? 0.97 : 1.02;
    const w = layout.hexW * sc * grow, h = layout.hexH * sc * grow;
    const bx = vw / 2 + panX - layout.boardW / 2, by = vh / 2 + panY - layout.boardH / 2;
    // While tiles are big enough for the shape to read they are drawn as
    // hexagons, so switching to the atlas does not visibly change the map.
    // Once they are a few pixels across a hexagon and a rectangle are the
    // same picture, and rectangles are cheaper.
    for (let c = 0; c < COLS; c++) {
      const wrap = colWrap[c];
      if (!wrap || !wrap._on) continue;
      const cx = bx + (layout.positions[c][0].cx + wrap._k * layout.worldW) * sc;
      for (let r = 0; r < ROWS; r++) {
        const tl = tiles[c][r];
        if (!tl.seen && !revealAll) continue;
        const cy = by + (layout.positions[c][r].cy + rowM[r] * layout.worldH) * sc;
        if (cy < -h || cy > vh + h) continue;
        const col = heightMap ? ELEV_RAMP[elevBand(tl.elev)] : tl.terrain.col;
        ctx.fillStyle = tl.seen ? col : dimCol(col);
        if (asHex) {
          ctx.beginPath();
          ctx.moveTo(cx - w / 2, cy);
          ctx.lineTo(cx - w / 4, cy - h / 2);
          ctx.lineTo(cx + w / 4, cy - h / 2);
          ctx.lineTo(cx + w / 2, cy);
          ctx.lineTo(cx + w / 4, cy + h / 2);
          ctx.lineTo(cx - w / 4, cy + h / 2);
          ctx.fill();
        } else {
          ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
        }
      }
    }
    // Your own pieces stay findable — at this size they are the only thing
    // worth picking out.
    const dot = (c, r, col, rad) => {
      const p = layout.positions[c][r];
      const wr = colWrap[c];
      if (!wr || !wr._on) return;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(bx + (p.cx + wr._k * layout.worldW) * sc,
              by + (p.cy + rowM[r] * layout.worldH) * sc, rad, 0, 6.2832);
      ctx.fill();
    };
    for (const ct of cities) dot(ct.c, ct.r, '#ffd76a', Math.max(3, w * 0.5));
    for (const u of units) dot(u.c, u.r, '#5aa9ff', Math.max(3, w * 0.42));
  }

  function applyTransform() {
    const s = cellSize / BASE_HEX;
    // Each step is cumulative: tiny implies far implies mid. Past the top rung
    // the board is put away entirely and the atlas is drawn instead.
    const n = drawnTiles();
    const detail = n > ATLAS_MAX ? 4 : n > FAR_MAX ? 3 : n > MID_MAX ? 2
                 : n > FULL_MAX ? 1 : 0;
    if (boardEl._detail !== detail) {
      boardEl._detail = detail;
      boardEl.classList.toggle('mid', detail >= 1);
      boardEl.classList.toggle('far', detail >= 2);
      boardEl.classList.toggle('tiny', detail >= 3);
      boardEl.classList.toggle('atlas', detail >= 4);
      viewportEl.classList.toggle('atlas', detail >= 4);
    }
    boardEl.style.transform =
      `translate(-50%, -50%) translate(${panX}px, ${panY}px) scale(${s}) translateZ(0)`;
    updateWrap();
    if (boardEl._detail >= 4) drawAtlas();   // needs updateWrap's column copies
    else ensureViewport();                   // ditto
    updateMinimapView();
  }
  let scheduled = false;
  function scheduleTransform() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; clampPan(); applyTransform(); });
  }
  function setZoom(newCell, ax, ay) {
    newCell = Math.max(minCell, Math.min(maxCell, newCell));
    const rect = viewportEl.getBoundingClientRect();
    if (ax === undefined) { ax = rect.left + rect.width / 2; ay = rect.top + rect.height / 2; }
    const vx = ax - rect.left - rect.width / 2, vy = ay - rect.top - rect.height / 2;
    const os = cellSize / BASE_HEX;
    const bx = (vx - panX + layout.boardW / 2) / os, by = (vy - panY + layout.boardH / 2) / os;
    cellSize = newCell;
    const s = cellSize / BASE_HEX;
    panX = vx - s * bx + layout.boardW / 2;
    panY = vy - s * by + layout.boardH / 2;
    clampPan(); scheduleTransform();
  }
  function centerOnHex(c, r) {
    const s = cellSize / BASE_HEX, p = layout.positions[c][r];
    panX = layout.boardW / 2 - s * p.cx;
    panY = layout.boardH / 2 - s * p.cy;
    clampPan();
  }

  // ---- HIT TESTING ----
  function hexAtClient(x, y) {
    const rect = viewportEl.getBoundingClientRect();
    const s = cellSize / BASE_HEX;
    const vx = x - rect.left - rect.width / 2, vy = y - rect.top - rect.height / 2;
    let bx = (vx - panX + layout.boardW / 2) / s;
    let by = (vy - panY + layout.boardH / 2) / s;
    bx = ((bx % layout.worldW) + layout.worldW) % layout.worldW;   // wrap the tap
    by = ((by % layout.worldH) + layout.worldH) % layout.worldH;
    let best = null, bd = Infinity;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const p = layout.positions[c][r];
        let dc = p.cx - bx;
        if (dc >  layout.worldW / 2) dc -= layout.worldW;
        if (dc < -layout.worldW / 2) dc += layout.worldW;
        let dr = p.cy - by;
        if (dr >  layout.worldH / 2) dr -= layout.worldH;
        if (dr < -layout.worldH / 2) dr += layout.worldH;
        const d = dc * dc + dr * dr;
        if (d < bd) { bd = d; best = { c, r }; }
      }
    }
    if (!best || Math.sqrt(bd) > layout.hexW * 0.6) return null;
    return best;
  }

  const infoEl = document.getElementById('tileInfo');
  function selectHex(c, r) {
    const p = layout.positions[c][r];
    cursorEl.style.left = (p.cx - parseFloat(cursorEl.style.width) / 2) + 'px';
    cursorEl.style.top = (p.cy - parseFloat(cursorEl.style.height) / 2) + 'px';
    cursorEl.style.display = 'block';
    if (cursorEl.parentNode !== colWrap[c]) colWrap[c].appendChild(cursorEl);
    setRow(cursorEl, r);
    const tl = tiles[c][r];
    const bits = [tl.terrain.name];
    if (tl.feature === 'forest') bits.push('Forest');
    if (tl.feature === 'hill') bits.push('Hills');
    if (tl.river) bits.push('River');
    if (tl.res) {
      if (isKnown(tl.res)) {
        const d = resDef(tl.res);
        const glyph = (d.icon && !d.icon.startsWith('data:')) ? d.icon + ' ' : '';
        bits.push(glyph + d.name +
                  ' (+' + d.food + '🍎 +' + d.prod + '⚒ +' + d.gold + '🪙)');
      } else {
        bits.push('❓ unidentified');
      }
    }
    bits.push('🌡 ' + Math.round(tl.heat * 100) + '%');
    bits.push('⛰ ' + Math.round(tl.elev * 100) + '%');
    infoEl.textContent = bits.join(' · ');
    infoEl.style.display = 'block';
  }

  // ---- INPUT ----
  let lastPan = null, lastPinch = null, moved = false, downPt = null, downT = 0;
  let lastTouchAt = 0;   // guards against tap-synthesised mouse events
  function dist(a, b) { const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY; return Math.hypot(dx, dy); }

  // Flick momentum. Dragging a finger's width at a time across a world two
  // hundred tiles wide is a great deal of dragging, so letting go of a moving
  // drag keeps the map gliding and slowing, the way a map is expected to.
  let velX = 0, velY = 0, glideId = 0, lastMoveT = 0;
  function trackVel(dx, dy) {
    const now = performance.now(), dt = Math.max(8, now - lastMoveT);
    lastMoveT = now;
    // Blended over roughly the last 90ms, so one jittery final frame can't
    // decide the throw on its own.
    const k = Math.min(1, dt / 90);
    velX = velX * (1 - k) + (dx / dt) * 16 * k;
    velY = velY * (1 - k) + (dy / dt) * 16 * k;
  }
  function stopGlide() { if (glideId) cancelAnimationFrame(glideId); glideId = 0; velX = velY = 0; }
  function startGlide() {
    if (Math.hypot(velX, velY) < 6) { velX = velY = 0; return; }   // a drag, not a flick
    const step = () => {
      panX += velX; panY += velY;
      velX *= 0.94; velY *= 0.94;
      clampPan(); applyTransform();
      glideId = Math.hypot(velX, velY) > 0.4 ? requestAnimationFrame(step) : 0;
    };
    glideId = requestAnimationFrame(step);
  }

  viewportEl.addEventListener('touchstart', (e) => {
    lastTouchAt = Date.now();
    stopGlide();
    lastMoveT = performance.now();
    moved = false;
    if (e.touches.length === 1) {
      lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      downPt = lastPan; downT = Date.now(); lastPinch = null;
    } else if (e.touches.length === 2) { lastPinch = dist(e.touches[0], e.touches[1]); lastPan = null; }
  }, { passive: true });

  viewportEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && lastPan) {
      const dx = e.touches[0].clientX - lastPan.x, dy = e.touches[0].clientY - lastPan.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      panX += dx; panY += dy;
      trackVel(dx, dy);
      lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      scheduleTransform();
    } else if (e.touches.length === 2) {
      moved = true;
      const d = dist(e.touches[0], e.touches[1]);
      const mid = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
      velX = velY = 0;                       // a pinch never launches a throw
      if (lastPinch) setZoom(cellSize * Math.pow(d / lastPinch, 1.4), mid.x, mid.y);
      lastPinch = d;
    }
  }, { passive: true });

  viewportEl.addEventListener('touchend', (e) => {
    lastTouchAt = Date.now();
    if (e.touches.length === 0) {
      if (!moved && downPt && Date.now() - downT < 300) {
        const h = hexAtClient(downPt.x, downPt.y);
        if (h) onTapHex(h.c, h.r);
      }
      if (moved) startGlide();
      lastPan = null; lastPinch = null;
    } else if (e.touches.length === 1) {
      lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY }; lastPinch = null;
      velX = velY = 0;                         // second finger lifted, not a throw
    }
  }, { passive: true });

  let mDown = false, mMoved = false, mLast = null, mDownPt = null;
  viewportEl.addEventListener('mousedown', (e) => {
    if (Date.now() - lastTouchAt < 700) return;   // synthesised from a tap
    stopGlide();
    lastMoveT = performance.now();
    mDown = true; mMoved = false; mLast = { x: e.clientX, y: e.clientY }; mDownPt = mLast;
  });
  window.addEventListener('mousemove', (e) => {
    if (!mDown) return;
    const dx = e.clientX - mLast.x, dy = e.clientY - mLast.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) mMoved = true;
    panX += dx; panY += dy;
    trackVel(dx, dy);
    mLast = { x: e.clientX, y: e.clientY };
    scheduleTransform();
  });
  window.addEventListener('mouseup', () => {
    if (Date.now() - lastTouchAt < 700) { mDown = false; mLast = null; return; }
    if (mDown && !mMoved && mDownPt) {
      const h = hexAtClient(mDownPt.x, mDownPt.y);
      if (h) onTapHex(h.c, h.r);
    }
    if (mDown && mMoved) startGlide();
    mDown = false; mLast = null;
  });
  viewportEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    setZoom(cellSize * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });

  // ---- TOP BAR STATS + TURNS ----
  const state = {
    turn: 1, year: 1500,   // 1500 BC
    gold: 15, goldD: 5, food: 4, happy: 5, culture: 3, science: 0,
  };
  // The counters along the top are gone; the turn and the year are all the
  // bar carries now. The values themselves are still tracked — cities still
  // earn gold and food each turn — they are simply not on screen.
  function renderStats() {
    document.getElementById('turnText').textContent =
      `⏳ ${state.turn} | ${state.year > 0 ? state.year + ' BC' : (1 - state.year) + ' AD'}`;
  }
  function showNotice(msg) {
    const n = document.getElementById('notice');
    n.textContent = msg; n.style.display = 'block';
    clearTimeout(showNotice._t);
    showNotice._t = setTimeout(() => { n.style.display = 'none'; }, 3200);
  }
  document.getElementById('nextTurn').addEventListener('click', () => {
    state.turn++;
    state.year -= 5;      // five years pass every turn
    // Only resources you have identified are worth anything — an unknown
    // thing sitting in your borders earns you nothing until you study it.
    let resGold = 0, resFood = 0;
    for (const ct of cities) {
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          const tl = tiles[c][r];
          if (!tl.res || !isKnown(tl.res)) continue;
          if (hexDist(ct.c, ct.r, c, r) > 1) continue;
          resGold += resDef(tl.res).gold;
          resFood += resDef(tl.res).food;
        }
      }
    }
    state.gold += state.goldD + cities.length * 2 + resGold;
    state.food = 4 + resFood;
    state.science += 1 + cities.length;
    if (state.turn % 4 === 0) state.culture += 1;
    for (const u of units) u.moves = u.max;
    if (unitSelected) computeReachable();
    renderMoves();
    updateUnitBar();
    renderStats();
    showNotice('Turn ' + state.turn + ' — all units refreshed.');
  });

  let citySel = 0;
  function updateCityBar() {
    const bar = document.getElementById('citiesBar');
    bar.classList.toggle('on', cities.length > 0);
    if (!cities.length) return;
    citySel = Math.min(citySel, cities.length - 1);
    document.getElementById('cityLabel').textContent = '🏠 ' + cities[citySel].name;
  }
  function cycleCity(dir) {
    if (!cities.length) return;
    citySel = (citySel + dir + cities.length) % cities.length;
    updateCityBar();
    const ct = cities[citySel];
    centerOnHex(ct.c, ct.r);
    applyTransform();
    selectHex(ct.c, ct.r);
  }
  document.getElementById('prevCity').addEventListener('click', () => cycleCity(-1));
  document.getElementById('nextCity').addEventListener('click', () => cycleCity(1));

  document.getElementById('prevUnit').addEventListener('click', () => cycleUnit(-1));
  document.getElementById('nextUnit').addEventListener('click', () => cycleUnit(1));
  document.getElementById('labelsBtn').addEventListener('click', (e) => {
    devLabels = !devLabels;
    e.currentTarget.classList.toggle('on', devLabels);
    repaintAllResources();
    showNotice(devLabels ? 'Names shown on every missing texture (build aid).'
                         : 'Names hidden again — unknown resources stay a mystery.');
  });
  document.getElementById('revealBtn').addEventListener('click', (e) => {
    const on = !revealAll;
    e.currentTarget.classList.toggle('on', on);
    setRevealAll(on);
    showNotice(on ? 'Whole map shown. Tap again for just what you have explored.'
                  : 'Back to your own map — anywhere you have not walked is hidden.');
  });
  document.getElementById('heightBtn').addEventListener('click', (e) => {
    heightMap = !heightMap;
    e.currentTarget.classList.toggle('on', heightMap);
    boardEl.classList.toggle('heights', heightMap);
    document.getElementById('heightKey').classList.toggle('on', heightMap);
    if (boardEl._detail >= 4) drawAtlas();   // the atlas repaints on demand
    showNotice(heightMap ? 'Every tile coloured by how high the ground is.'
                         : 'Back to the terrain.');
  });
  document.getElementById('examineBtn').addEventListener('click', examineResource);
  document.getElementById('foundCity').addEventListener('click', () => {
    const u = curUnit();
    if (u && u.type === 'settler' && canFoundCity(u.c, u.r)) foundCity(u);
  });

  // ---- MINIMAP ----
  const mm = document.getElementById('minimap');
  const mmView = document.getElementById('mmView');
  // Repainting forty thousand tiles on every move would cost more than the
  // rest of the turn put together, so the minimap keeps what it has drawn and
  // only paints the tiles that were just revealed. Passing no list repaints
  // everything you have explored, which is what a fresh map needs.
  function drawMinimap(fresh) {
    const ctx = mm.getContext('2d');
    const sx = mm.width / layout.boardW, sy = mm.height / layout.boardH;
    const w = Math.max(1, layout.hexW * sx * 1.1), h = Math.max(1, layout.hexH * sy * 1.1);
    let list = fresh;
    if (!list) {
      ctx.fillStyle = '#0a1a29';
      ctx.fillRect(0, 0, mm.width, mm.height);
      if (revealAll) {
        list = [];
        for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) list.push({ c, r });
      } else list = seenList;
    }
    for (const t of list) {
      const p = layout.positions[t.c][t.r];
      ctx.fillStyle = tiles[t.c][t.r].terrain.col;
      ctx.fillRect(p.cx * sx - w / 2, p.cy * sy - h / 2, w, h);
    }
  }

  const MM_PAD = 4; // #minimapWrap padding — the canvas's offset inside it
  // One box per wrapped copy of the camera: here, one map to the left, one
  // map up, and the diagonal.
  const mmViews = [mmView];
  for (let i = 1; i < 4; i++) {
    const d = mmView.cloneNode();
    d.removeAttribute('id');
    d.className = 'mmview';   // without this the copy loses #mmView's rules
                              // and falls back into normal flow, stretching
                              // the minimap panel out of shape
    mmView.parentNode.appendChild(d);
    mmViews.push(d);
  }
  function updateMinimapView() {
    const s = cellSize / BASE_HEX;
    const sx = mm.width / layout.boardW, sy = mm.height / layout.boardH;
    const vw = viewportEl.clientWidth, vh = viewportEl.clientHeight;
    // Board-local coords of the viewport's top-left corner, brought back
    // inside one world since the pan can sit a whole world either side.
    const wrap = (v, m) => ((v % m) + m) % m;
    const bx = wrap((-vw / 2 - panX + layout.boardW / 2) / s, layout.worldW);
    const by = wrap((-vh / 2 - panY + layout.boardH / 2) / s, layout.worldH);
    const x0 = bx * sx, y0 = by * sy;
    const bw = Math.max(4, (vw / s) * sx), bh = Math.max(4, (vh / s) * sy);
    // The world wraps, so the camera box can run off one edge of the minimap
    // and back in at the other. Draw it up to four times, offset by a map
    // width and height, and let the minimap's own edge clip the parts that
    // fall outside. Squeezing it to fit instead made the box shrink and slide
    // whenever the camera crossed a seam.
    mmViews.forEach((el, i) => {
      const dx = (i & 1) ? -mm.width : 0, dy = (i & 2) ? -mm.height : 0;
      el.style.left = (MM_PAD + x0 + dx) + 'px';
      el.style.top = (MM_PAD + y0 + dy) + 'px';
      el.style.width = bw + 'px';
      el.style.height = bh + 'px';
    });
  }

  // ---- FPS ----
  function startFps() {
    const el = document.getElementById('fps');
    let f = 0, t0 = performance.now();
    (function loop(now) {
      f++;
      if (now - t0 >= 500) { el.textContent = Math.round(f * 1000 / (now - t0)) + ' FPS'; f = 0; t0 = now; }
      requestAnimationFrame(loop);
    })(performance.now());
  }

  // Keep the floating panels clear of the top bar.
  function layoutPanels() {
    const barH = document.getElementById('topbar').offsetHeight;
    document.getElementById('research').style.top = (barH + 8) + 'px';
    document.getElementById('nextTurn').style.top = (barH + 8) + 'px';
    document.getElementById('notice').style.top = (barH + 74) + 'px';
    document.getElementById('fps').style.top = (barH + 62) + 'px';
    document.getElementById('labelsBtn').style.top = (barH + 88) + 'px';
    document.getElementById('revealBtn').style.top = (barH + 114) + 'px';
    document.getElementById('heightBtn').style.top = (barH + 140) + 'px';
    document.getElementById('heightKey').style.top = (barH + 168) + 'px';
  }

  // ---- INIT ----
  function init() {
    computeZoomBounds();
    // Open on something that reads as a map. A fixed size, not a multiple of
    // the zoom-out limit: on a world this wide that limit is only a few pixels
    // a hex, so scaling off it would start the game almost fully zoomed out.
    cellSize = Math.max(minCell, Math.min(maxCell, BASE_HEX * 0.48));
    generateMap();
    buildTextures();
    buildBoard();
    buildFog();
    updateFog();
    centerOnHex(startHex.c, startHex.r);
    selectHex(startHex.c, startHex.r);
    applyTransform();
    renderStats();
    drawMinimap();
    layoutPanels();
    updateMinimapView();
    startFps();
    showNotice('Nothing is labelled. Stand on a marker and tap Study this to learn what it is.');
  }
  window.addEventListener('resize', () => {
    computeZoomBounds();
    cellSize = Math.max(minCell, Math.min(maxCell, cellSize));
    clampPan(); applyTransform(); layoutPanels();
  });

  // Read-only snapshot of the generated world, used to check the resource
  // distribution rules from a test harness.
  window.__mapStats = () => {
    const out = { crops: [], rivers: 0, land: 0 };
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const tl = tiles[c][r];
        if (!tl.water) out.land++;
        if (tl.river) out.rivers++;
        if (tl.res) out.crops.push({ c, r, key: tl.res, river: !!tl.river, forest: tl.feature === 'forest',
                                     terrain: tl.terrain.name });
      }
    }
    out.dist = (a, b, x, y) => 0;
    return out;
  };
  window.__regen = () => generateMap();
  // Reveal a radius around the start, so a test can measure what the map
  // costs late in a game rather than only on turn one.
  window.__reveal = (rad) => {
    for (let dc = -rad; dc <= rad; dc++) {
      const c = ((startHex.c + dc) % COLS + COLS) % COLS;
      for (let dr = -rad; dr <= rad; dr++) {
        const r = ((startHex.r + dr) % ROWS + ROWS) % ROWS;
        if (tiles[c][r].seen) continue;
        tiles[c][r].seen = true; ensureTile(c, r); seenList.push({ c, r });
        const el = fogEls[c][r]; el._o = 0; el.style.display = 'none';
      }
    }
    drawMinimap();
    return seenList.length;
  };
  window.__centerOn = (c, r) => { centerOnHex(c, r); applyTransform(); };
  window.__knowAll = () => { RESOURCES.forEach(x => resInfo[x.key].known = true);
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++)
      if (resEls[c][r]) paintResource(resEls[c][r], tiles[c][r].res); };
  window.__state = () => ({ cell: +cellSize.toFixed(1), minCell: +minCell.toFixed(1),
    panX: Math.round(panX), panY: Math.round(panY),
    boardW: Math.round(layout.boardW), boardH: Math.round(layout.boardH),
    wpx: Math.round(layout.worldW * cellSize / BASE_HEX), hpx: Math.round(layout.worldH * cellSize / BASE_HEX) });
  window.__units = () => units.map(u => ({ c: u.c, r: u.r, moves: u.moves, kind: u.kind }));
  window.__select = (c, r) => selectHex(c, r);
  window.__reach = () => { const u = curUnit(); if (!u) return [];
    return [...getReachable(u).keys()].map(k => ({ c: +k.split(',')[0], r: +k.split(',')[1] })); };
  window.__moveTo = (c, r) => onTapHex(c, r);
  window.__turn = () => turn;
  window.__seen = () => seenList.length;
  window.__teleport = (c, r) => { const u = units[0]; u.c = c; u.r = r;
    placeUnits(); updateFog(); centerOnHex(c, r); applyTransform(); };
  window.__setZoom = (v) => { cellSize = Math.max(minCell, Math.min(maxCell, v));
    clampPan(); applyTransform(); };
  window.__units = () => units.map(u => ({ c: u.c, r: u.r, moves: u.moves, type: u.type }));
  window.__select = (c, r) => { selectHex(c, r); onTapHex(c, r); };
  window.__reach = () => [...reachable.keys()].map(k => {
    const a = k.split(','); return { c: +a[0], r: +a[1] }; });
  window.__moveTo = (c, r) => onTapHex(c, r);
  window.__turn = () => state.turn;
  window.__seen = () => seenList.length;
  window.__teleport = (c, r) => { const u = units[0]; u.c = c; u.r = r;
    dropRow(u.el); u.el.remove(); colWrap[c].appendChild(u.el); placeUnit(u);
    updateFog(); centerOnHex(c, r); applyTransform(); };
  window.__setZoom = (v) => { cellSize = Math.max(minCell, Math.min(maxCell, v));
    clampPan(); applyTransform(); };
  window.__screenOf = (c, r) => {
    const sc = cellSize / BASE_HEX, pt = layout.positions[c][r];
    // Pick the wrapped copy nearest the screen, the way updateWrap does.
    const near = (v, period) => { let best = v;
      for (const k of [-1, 0, 1]) { const q = v + k * period * sc;
        if (Math.abs(q) < Math.abs(best)) best = q; } return best; };
    return { x: innerWidth / 2 + near(pt.cx * sc + panX - layout.boardW / 2, layout.worldW),
             y: innerHeight / 2 + near(pt.cy * sc + panY - layout.boardH / 2, layout.worldH) };
  };
  window.__nudge = (dx, dy) => { panX += dx; panY += dy; clampPan(); applyTransform(); };
  window.__tiers = (a, b, c, d) => { FULL_MAX = a; MID_MAX = b; FAR_MAX = c;
    if (d !== undefined) ATLAS_MAX = d;
    boardEl._detail = null; applyTransform(); };
  window.__neighbors = (c, r) => neighbors(c, r);
  window.__tile = (c, r) => { const t = tiles[c][r];
    return { terrain: t.terrain.name, water: !!t.water, river: !!t.river, res: t.res, shore: t.shore }; };
  window.__hexAt = (x, y) => hexAtClient(x, y);
  window.__revealed = () => revealAll;
  window.__tileState = (c, r) => ({ seen: !!tiles[c][r].seen, built: !!hexEls[c][r],
    fog: fogEls[c][r] ? fogEls[c][r]._o : null });
  window.__atlasDiag = () => {
    const vw = viewportEl.clientWidth, vh = viewportEl.clientHeight;
    const sc = cellSize / BASE_HEX;
    const w = layout.hexW * sc * 1.02, h = layout.hexH * sc * 1.02;
    const bx = vw / 2 + panX - layout.boardW / 2, by = vh / 2 + panY - layout.boardH / 2;
    const xs = [];
    for (let c = 0; c < COLS; c++) {
      const wr = colWrap[c]; if (!wr || !wr._on) continue;
      xs.push({ c, x: +(bx + (layout.positions[c][0].cx + wr._k * layout.worldW) * sc).toFixed(2), k: wr._k });
    }
    xs.sort((a, b) => a.x - b.x);
    let gaps = [];
    for (let i = 1; i < xs.length; i++) {
      const d = xs[i].x - xs[i-1].x;
      if (d > w) gaps.push(`cols ${xs[i-1].c}(k${xs[i-1].k})@${xs[i-1].x} -> ${xs[i].c}(k${xs[i].k})@${xs[i].x}  step ${d.toFixed(2)} vs tile ${w.toFixed(2)}`);
    }
    const ys = [];
    for (let r = 0; r < ROWS; r++) {
      const y = by + (layout.positions[0][r].cy + rowM[r] * layout.worldH) * sc;
      if (y > -h && y < vh + h) ys.push({ r, y: +y.toFixed(2), m: rowM[r] });
    }
    ys.sort((a, b) => a.y - b.y);
    let ygaps = [];
    for (let i = 1; i < ys.length; i++) {
      const d = ys[i].y - ys[i-1].y;
      if (d > h) ygaps.push(`rows ${ys[i-1].r}(m${ys[i-1].m})@${ys[i-1].y} -> ${ys[i].r}(m${ys[i].m})@${ys[i].y}  step ${d.toFixed(2)} vs tile ${h.toFixed(2)}`);
    }
    return 'COLUMN GAPS:\n' + (gaps.join('\n') || 'none') +
           '\nROW GAPS:\n' + (ygaps.join('\n') || 'none') +
           `\ncolumns drawn ${xs.length}, rows in band ${ys.length}, viewport ${vw}x${vh}`;
  };
  window.__elevs = () => { const o=[]; for(let c=0;c<COLS;c+=3) for(let r=0;r<ROWS;r+=3) o.push(tiles[c][r].elev); return o; };
  window.__heights = () => heightMap;
  window.__mix = () => {
    const n = COLS * ROWS, o = { sea: 0, lake: 0, river: 0, ice: 0, desert: 0, normal: 0, mountain: 0 };
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
      const t = tiles[c][r];
      if (t.terrain === TERRA.ocean || t.terrain === TERRA.coast) o.sea++;
      else if (t.terrain === TERRA.lake) o.lake++;
      else if (t.river) o.river++;
      else if (t.terrain === TERRA.snow) o.ice++;
      else if (t.terrain === TERRA.desert) o.desert++;
      else if (t.feature === 'mtn') o.mountain++;
      else o.normal++;
    }
    const pc = k => +(o[k] / n * 100).toFixed(1);
    return { sea: pc('sea'), lakeRiver: +(pc('lake') + pc('river')).toFixed(1),
             water: +(pc('sea') + pc('lake') + pc('river')).toFixed(1),
             ice: pc('ice'), desert: pc('desert'),
             normal: +(pc('normal') + pc('mountain')).toFixed(1),
             land: +(pc('ice') + pc('desert') + pc('normal') + pc('mountain')).toFixed(1) };
  };
  window.__landmass = () => {
    const seen = new Set([startHex.c+','+startHex.r]); const q=[startHex]; let n=0;
    while(q.length){ const t=q.pop(); n++;
      for(const nb of neighbors(t.c,t.r)){ const k=nb.c+','+nb.r;
        if(seen.has(k)) continue; const x=tiles[nb.c][nb.r];
        if(x.water && !x.river) continue; seen.add(k); q.push(nb); } }
    return n;
  };
  window.__hexDist = hexDist;
  window.__dims = { COLS, ROWS };

  // Nothing is generated until a size is chosen — the whole world, its
  // textures and its board all depend on it.
  const sizeList = document.getElementById('sizeList');
  for (const sz of MAP_SIZES) {
    const btn = document.createElement('button');
    btn.className = 'sizeBtn';
    btn.innerHTML = `<span>${sz.name}</span><span class="blurb">${sz.blurb}</span>` +
                    `<span class="dim">${sz.n}\u00d7${sz.n}</span>`;
    btn.addEventListener('click', () => {
      document.getElementById('startScreen').remove();
      setMapSize(sz.n);
      init();
    });
    sizeList.appendChild(btn);
  }
  // A test harness can skip the screen and go straight in at a given size.
  window.__start = (n) => {
    const el = document.getElementById('startScreen');
    if (el) el.remove();
    setMapSize(n || 200);
    init();
  };
})();
</script>
</body>
</html>
