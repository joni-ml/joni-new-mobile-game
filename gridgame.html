  function renderCityMenuStats(city) {
    cityMenuStats.innerHTML = '';
    const yields = computeCityYields(city); // food & production come from worked tiles
    CITY_STAT_TYPES.forEach(stat => {
      const pill = document.createElement('div');
      pill.className = 'stat-pill';

      const icon = document.createElement('div');
      icon.className = 'stat-pill-icon';
      const iconImg = document.createElement('img');
      iconImg.src = stat.icon;
      iconImg.alt = stat.key;
      icon.appendChild(iconImg);

      const value = document.createElement('div');
      value.className = 'stat-pill-value';
      let amount;
      if (stat.key === 'food' || stat.key === 'production') {
        amount = yields[stat.key];
      } else {
        amount = (city.stats && city.stats[stat.key] !== undefined) ? city.stats[stat.key] : 0;
      }
      value.textContent = amount;

      pill.appendChild(icon);
      pill.appendChild(value);
      cityMenuStats.appendChild(pill);
    });
  }

  // Placeholder sections/rows for the city menu — edit this structure to
  // change what shows up. Each section is a collapsible blue header;
  // rows underneath show an icon circle, title, subtext, and a small
  // accessory button on the right.
  const CITY_MENU_SECTIONS = [
    {
      id: 'overview',
      label: 'Overview',
      items: [
        { title: 'Population', sub: '1' },
        { title: 'Food', sub: '0' },
      ],
    },
    {
      id: 'production',
      label: 'Production',
      items: [], // rendered live from PRODUCTION_ITEMS instead
    },
    {
      id: 'buildings',
      label: 'Buildings',
      items: [
        { title: 'Granary', sub: 'Not built' },
        { title: 'Walls', sub: 'Not built' },
      ],
    },
    {
      id: 'units',
      label: 'Units',
      items: [
        { title: 'No units stationed', sub: '' },
      ],
    },
    {
      id: 'trade',
      label: 'Trade',
      items: [
        { title: 'No trade routes', sub: '' },
      ],
    },
  ];

  let expandedMenuSections = new Set([CITY_MENU_SECTIONS[0].id]);
  let currentMenuCity = null;

  function renderCityMenuAccordion() {
    cityMenuAccordion.innerHTML = '';
    CITY_MENU_SECTIONS.forEach(section => {
      const wrap = document.createElement('div');
      wrap.className = 'menu-section' + (expandedMenuSections.has(section.id) ? ' expanded' : '');

      const header = document.createElement('button');
      header.className = 'menu-section-header';
      header.innerHTML = `<span>${section.label}</span><span class="chevron">&#9662;</span>`;
      header.addEventListener('click', () => {
        if (expandedMenuSections.has(section.id)) {
          expandedMenuSections.delete(section.id);
        } else {
          expandedMenuSections.add(section.id);
        }
        renderCityMenuAccordion();
      });
      wrap.appendChild(header);

      // Overview's items are computed live from the city's real state
      // (population, food stored/needed to grow) rather than static text.
      let sectionItems = section.items;
      let useProductionItems = false;
      if (section.id === 'overview' && currentMenuCity) {
        const threshold = getGrowthThreshold(currentMenuCity.population);
        sectionItems = [
          { title: 'Population', sub: String(currentMenuCity.population) },
          {
            title: 'Food',
            sub: threshold !== undefined
              ? `${currentMenuCity.foodStored} / ${threshold} to grow`
              : `${currentMenuCity.foodStored} (no further growth defined)`,
          },
        ];
      } else if (section.id === 'production' && currentMenuCity) {
        useProductionItems = true;
      }

      const itemsWrap = document.createElement('div');
      itemsWrap.className = 'menu-section-items';

      if (useProductionItems) {
        const city = currentMenuCity;
        const prod = computeCityYields(city).production || 0;
        PRODUCTION_ITEMS.forEach(item => {
          const row = document.createElement('div');
          row.className = 'menu-row';

          const icon = document.createElement('div');
          icon.className = 'menu-row-icon';
          if (item.icon) {
            const iconImg = document.createElement('img');
            iconImg.src = item.icon;
            iconImg.alt = item.title;
            iconImg.style.width = '100%';
            iconImg.style.height = '100%';
            iconImg.style.objectFit = 'cover';
            iconImg.style.borderRadius = '50%';
            icon.appendChild(iconImg);
          }

          const text = document.createElement('div');
          text.className = 'menu-row-text';
          const title = document.createElement('div');
          title.className = 'menu-row-title';
          title.textContent = item.title;
          text.appendChild(title);

          const sub = document.createElement('div');
          sub.className = 'menu-row-sub';
          const isQueued = city.currentProduction === item.key;
          const turns = prod > 0 ? Math.ceil((item.cost - (isQueued ? city.productionProgress : 0)) / prod) : '∞';
          sub.textContent = isQueued
            ? `🔨 ${city.productionProgress}/${item.cost}  ⏱ ${turns}`
            : `🔨 ${item.cost}  ⏱ ${prod > 0 ? Math.ceil(item.cost / prod) : '∞'}`;
          text.appendChild(sub);

          const accessory = document.createElement('div');
          accessory.className = 'menu-row-accessory';
          accessory.textContent = isQueued ? '⏳' : '+';
          if (!isQueued) {
            accessory.addEventListener('click', () => {
              city.currentProduction = item.key;
              city.productionProgress = 0;
              renderCityMenuAccordion();
            });
          }

          row.appendChild(icon);
          row.appendChild(text);
          row.appendChild(accessory);
          itemsWrap.appendChild(row);
        });
      } else {
        const isStatSection = section.id === 'overview';
        sectionItems.forEach(item => {
          const row = document.createElement('div');
          row.className = 'menu-row';

          const icon = document.createElement('div');
          icon.className = 'menu-row-icon';

          const text = document.createElement('div');
          text.className = 'menu-row-text';
          const title = document.createElement('div');
          title.className = 'menu-row-title';
          title.textContent = item.title;
          text.appendChild(title);
          if (item.sub) {
            const sub = document.createElement('div');
            sub.className = 'menu-row-sub';
            sub.textContent = item.sub;
            text.appendChild(sub);
          }

          row.appendChild(icon);
          row.appendChild(text);
          if (!isStatSection) {
            const accessory = document.createElement('div');
            accessory.className = 'menu-row-accessory';
            accessory.textContent = '+';
            row.appendChild(accessory);
          }
          itemsWrap.appendChild(row);
        });
      }

      wrap.appendChild(itemsWrap);

      cityMenuAccordion.appendChild(wrap);
    });
  }

  function openCityMenu(city) {
    currentMenuCity = city;
    cityMenuTitle.textContent = city.name;
    renderCityMenuStats(city);
    expandedMenuSections = new Set([CITY_MENU_SECTIONS[0].id]);
    renderCityMenuAccordion();
    cityMenuOverlay.classList.add('visible');
  }
  function closeCityMenu() {
    cityMenuOverlay.classList.remove('visible');
  }
  cityMenuCloseBtn.addEventListener('click', closeCityMenu);
  cityMenuOverlay.addEventListener('click', (e) => {
    if (e.target === cityMenuOverlay) closeCityMenu();
  });

  // Clicking anything other than a pressed city's own name resets it back
  // to normal (the name label's own click handler stops propagation, so
  // this only fires for clicks elsewhere).
  document.addEventListener('click', () => {
    if (pressedCityId) {
      pressedCityId = null;
      render();
    }
  });

  // ---- INIT ----
  function init() {
    boardEl.style.width = hexLayout.boardW + 'px';
    boardEl.style.height = hexLayout.boardH + 'px';
    computeZoomBounds();
    // Start a bit more zoomed in than the max zoom-out level, centered
    // on the player's characters rather than the land's geometric center.
    cellSize = Math.min(maxCellSize, minCellSize * 1.15);
    applyPerfClasses();
    render();
    centerOnPlayer();
    applyTransform();
    applyWaterBlur();
    updateTurnUI();
    startFpsMeter();
    startSettingsPanel();
  }

  // Live FPS, shared with the settings panel readout. Updated by the meter
  // loop; fpsMin tracks the worst 500ms window since the last reset.
  let fpsCurrent = 0;
  let fpsMin = Infinity;

  // ---- FPS / FPM METER ----
  // A small on-screen readout of how smoothly the game is rendering, so
  // performance can be judged on the real device. FPS is averaged over a
  // ~500ms window; FPM (frames per minute) is that rate extrapolated. Tap
  // the meter to hide it.
  function startFpsMeter() {
    const el = document.createElement('div');
    el.id = 'fpsmeter';
    el.textContent = '— FPS';
    el.addEventListener('click', () => { el.style.display = 'none'; });
    document.body.appendChild(el);

    let frames = 0;
    let windowStart = performance.now();
    function loop(now) {
      frames++;
      const elapsed = now - windowStart;
      if (elapsed >= 500) {
        const fps = (frames * 1000) / elapsed;
        fpsCurrent = fps;
        if (fps < fpsMin) fpsMin = fps;
        el.textContent = `${Math.round(fps)} FPS · ${Math.round(fps * 60)} FPM`;
        frames = 0;
        windowStart = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // ---- SETTINGS / PERFORMANCE DIAGNOSTIC PANEL ----
  // A gear button opens a panel that shows live FPS, runs a repeatable
  // pan+zoom benchmark, and lets each rendering cost be switched off one at
  // a time — so the biggest source of lag can be pinned down by comparing
  // the benchmark score with each feature on vs off.
  function startSettingsPanel() {
    const gear = document.createElement('button');
    gear.id = 'gearBtn';
    gear.textContent = '⚙️';
    gear.setAttribute('aria-label', 'Settings');
    document.body.appendChild(gear);

    const panel = document.createElement('div');
    panel.id = 'settingsPanel';
    document.body.appendChild(panel);

    const TOGGLES = [
      { key: 'waterBlur',      label: 'Water blur',        desc: 'Soft blur over the whole sea' },
      { key: 'waterGradient',  label: 'Water tile dots',   desc: 'Highlight dots on each sea tile' },
      { key: 'hexClip',        label: 'Hexagon clipping',  desc: 'clip-path shape on all ~900 tiles' },
      { key: 'charShadow',     label: 'Character shadows',  desc: 'Drop-shadow glow on units' },
      { key: 'charTransition', label: 'Character animation',desc: 'Scale transition on select/move' },
      { key: 'boardLayer',     label: 'GPU board layer',    desc: 'translateZ compositor promotion' },
      { key: 'coalesce',       label: 'Batch pan writes',   desc: 'One transform write per frame' },
      { key: 'hex3d',          label: '3D raised tiles',    desc: 'Side walls give land real depth (heavier)' },
    ];

    let benchmarking = false;

    panel.innerHTML =
      '<h2>Performance <button class="panel-close" aria-label="Close">✕</button></h2>' +
      '<div class="perf-readout" id="perfReadout">—</div>' +
      '<button class="bench" id="benchBtn">Run 3s benchmark</button>' +
      '<div class="row-actions">' +
        '<button id="perfAllOn">All on</button>' +
        '<button id="perfAllOff">All off (fastest)</button>' +
      '</div>' +
      TOGGLES.map(t =>
        `<div class="toggle-row"><label for="perf_${t.key}">${t.label}<small>${t.desc}</small></label>` +
        `<input type="checkbox" id="perf_${t.key}" ${PERF[t.key] ? 'checked' : ''}></div>`
      ).join('');

    const readout = panel.querySelector('#perfReadout');
    let lastBench = null;
    function refreshReadout() {
      const cur = Math.round(fpsCurrent);
      const mn = fpsMin === Infinity ? '—' : Math.round(fpsMin);
      let html = `Live: ${cur} FPS · ${cur * 60} FPM<br>Min (session): <span class="worst">${mn} FPS</span>`;
      if (lastBench) {
        html += `<br>Benchmark: ${lastBench.fps} FPS avg · worst <span class="worst">${lastBench.worst} ms</span>`;
      }
      readout.innerHTML = html;
    }
    setInterval(refreshReadout, 400);
    refreshReadout();

    function syncLive() {
      applyPerfClasses();
      // hex3d changes the static terrain itself, so rebuild it.
      staticBoardBuilt = false;
      render();
      applyTransform();
      applyWaterBlur();
    }

    TOGGLES.forEach(t => {
      panel.querySelector('#perf_' + t.key).addEventListener('change', (e) => {
        PERF[t.key] = e.target.checked;
        savePerf();
        syncLive();
      });
    });

    function setAll(v) {
      Object.keys(PERF).forEach(k => { PERF[k] = v; });
      TOGGLES.forEach(t => { panel.querySelector('#perf_' + t.key).checked = v; });
      savePerf();
      syncLive();
    }
    panel.querySelector('#perfAllOn').addEventListener('click', () => setAll(true));
    panel.querySelector('#perfAllOff').addEventListener('click', () => setAll(false));

    gear.addEventListener('click', () => { panel.classList.add('open'); fpsMin = Infinity; });
    panel.querySelector('.panel-close').addEventListener('click', () => panel.classList.remove('open'));

    // Repeatable benchmark: pan in a circle while zooming in/out for 3s,
    // driving the real transform path so the current quality flags are
    // reflected, then report average FPS and the worst single frame.
    const benchBtn = panel.querySelector('#benchBtn');
    benchBtn.addEventListener('click', () => {
      if (benchmarking) return;
      benchmarking = true;
      benchBtn.disabled = true;
      benchBtn.textContent = 'Benchmarking…';
      const savedPan = { x: panX, y: panY }, savedCell = cellSize;
      const cx = panX, cy = panY, baseCell = cellSize;
      let frames = 0, worst = 0, last = performance.now();
      const start = last;
      function step(now) {
        const dt = now - last; last = now; frames++;
        if (dt > worst) worst = dt;
        const t = (now - start) / 1000;
        panX = cx + Math.sin(t * 2) * 90;
        panY = cy + Math.cos(t * 2) * 90;
        cellSize = Math.max(minCellSize, Math.min(maxCellSize, baseCell * (1 + 0.22 * Math.sin(t * 3))));
        clampPan();
        applyTransform();
        if (now - start < 3000) {
          requestAnimationFrame(step);
        } else {
          panX = savedPan.x; panY = savedPan.y; cellSize = savedCell;
          clampPan(); applyTransform();
          const fps = frames / ((now - start) / 1000);
          lastBench = { fps: Math.round(fps), worst: Math.round(worst) };
          benchmarking = false;
          benchBtn.disabled = false;
          benchBtn.textContent = 'Run 3s benchmark';
          refreshReadout();
        }
      }
      requestAnimationFrame(step);
    });
  }

  window.addEventListener('resize', () => {
    computeZoomBounds();
    cellSize = Math.max(minCellSize, Math.min(maxCellSize, cellSize));
    clampPan();
    applyTransform();
  });

  init();
</script>
</body>
</html>
