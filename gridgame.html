<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grid Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #0a0b0d;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
  }
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
    background: hsl(202, 48%, 43%); /* matches the darkest water band, so the hex ring's outer edge blends into a flat, straight-edged sea beyond it */
  }
  .cell-water {
    background-image:
      radial-gradient(circle at 25% 20%, rgba(255,255,255,0.12) 0, rgba(255,255,255,0.12) 8%, transparent 9%),
      radial-gradient(circle at 70% 65%, rgba(0,40,55,0.15) 0, rgba(0,40,55,0.15) 9%, transparent 10%);
  }
  #board {
    position: absolute;
    top: 50%; left: 50%;
    background: transparent;
    transform-origin: top left;
    z-index: 2;
    /* Keep the whole board on its own GPU compositor layer so pan/zoom is a
       pure transform (no main-thread repaint of the 900 hex tiles). Crucial
       on mobile Safari, which otherwise repaints on every gesture frame. */
    will-change: transform;
    backface-visibility: hidden;
    /* width/height set once by JS to the board's base pixel size;
       transform (translate + scale) set by JS on every pan/zoom */
  }
  #fpsmeter {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    margin: 6px;
    z-index: 30;
    background: rgba(0, 0, 0, 0.55);
    color: #4ade80;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    padding: 4px 7px;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }

  /* ---- Performance settings: each class strips one rendering cost ---- */
  body.perf-no-hexclip .cell { clip-path: none !important; }
  body.perf-no-watergrad .cell-water { background-image: none !important; }
  body.perf-no-charshadow .char-body { filter: none !important; }
  body.perf-no-charshadow .char.char-selected { filter: none !important; }
  body.perf-no-chartransition .char { transition: none !important; }

  #gearBtn {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    margin: 6px;
    z-index: 31;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    color: #eee;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  #settingsPanel {
    position: fixed;
    top: 0; right: 0;
    height: 100%;
    width: min(82%, 320px);
    z-index: 40;
    background: rgba(18, 20, 24, 0.97);
    backdrop-filter: blur(6px);
    box-shadow: -4px 0 18px rgba(0, 0, 0, 0.5);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 16px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #settingsPanel.open { transform: translateX(0); }
  #settingsPanel h2 {
    margin: 0;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #settingsPanel .panel-close { background: none; border: none; color: #aaa; font-size: 20px; }
  #settingsPanel .perf-readout {
    background: #0d0f12;
    border: 1px solid #2a2e36;
    border-radius: 8px;
    padding: 10px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #4ade80;
  }
  #settingsPanel .perf-readout .worst { color: #f87171; }
  #settingsPanel button.bench {
    background: #2563eb; color: #fff; border: none;
    border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700;
    touch-action: manipulation;
  }
  #settingsPanel button.bench:disabled { opacity: 0.5; }
  #settingsPanel .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 2px;
    border-bottom: 1px solid #23262d;
    font-size: 13px;
  }
  #settingsPanel .toggle-row small { display: block; color: #8b909a; font-size: 10px; margin-top: 2px; }
  #settingsPanel .toggle-row label { flex: 1; }
  #settingsPanel .row-actions { display: flex; gap: 8px; margin-top: 4px; }
  #settingsPanel .row-actions button {
    flex: 1; background: #33373f; color: #eee; border: none;
    border-radius: 8px; padding: 9px; font-size: 12px; touch-action: manipulation;
  }
  #settingsPanel input[type="checkbox"] { width: 20px; height: 20px; flex: none; }
  .cell {
    position: absolute;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .cell-label {
    position: absolute;
    bottom: 2%;
    right: 3%;
    font-size: 9px;
    opacity: 0.55;
    pointer-events: none;
    white-space: nowrap;
  }
  .char {
    width: 78%;
    height: 78%;
    z-index: 5;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease;
  }
  .char.char-selected {
    transform: scale(1.12);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
  }
  .char.char-locked {
    opacity: 0.45;
    filter: grayscale(60%);
  }
  .char-stack {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .char-stack:has(.char-stacked) {
    gap: 2%;
  }
  .char.char-stacked {
    width: 52%;
    height: 52%;
  }
  .char.char-stacked.char-selected {
    transform: scale(1.2);
  }
  .char-body {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  .char-body img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .move-dot {
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    z-index: 4;
  }
  .move-dot.move-dot-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40%;
    height: 40%;
    background: rgba(255, 255, 255, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    z-index: 6;
    pointer-events: none;
  }

  #zoomctl {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    right: 0;
    margin: 0 16px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 20;
  }
  #zoomctl button {
    width: 46px;
    height: 46px;
    background: rgba(36, 39, 46, 0.85);
    backdrop-filter: blur(4px);
    border: 1px solid #3a3d44;
    color: #eee;
    border-radius: 10px;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  #zoomctl button:active { background: rgba(52, 56, 63, 0.9); }

  #info {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    opacity: 0.45;
    padding: 8px 0;
    pointer-events: none;
    z-index: 20;
  }

  #turnbar {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 0;
    z-index: 20;
  }
  #turnLabel {
    display: none;
  }
  #endTurnBtn {
    display: none;
    background: #2f6f4f;
    border: 1px solid #418a63;
    color: #eee;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 12px;
    touch-action: manipulation;
  }
  #endTurnBtn.visible { display: block; }

  #createCityBtn {
    display: none;
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
    left: 60%;
    transform: translateX(-50%);
    background: #7a2323;
    border: 1px solid #a83a3a;
    color: #eee;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 12px;
    touch-action: manipulation;
    z-index: 21;
  }
  #createCityBtn.visible { display: block; }
  #createCityBtn:active { background: #611b1b; }

  #fortifyBtn {
    display: none;
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
    left: 40%;
    transform: translateX(-50%);
    background: #2a4d7a;
    border: 1px solid #3a6aa8;
    color: #eee;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 12px;
    touch-action: manipulation;
    z-index: 21;
  }
  #fortifyBtn.visible { display: block; }
  #fortifyBtn:active { background: #1e3a5c; }

  .fortify-badge {
    position: absolute;
    bottom: -4%;
    right: -4%;
    background: #2a4d7a;
    border: 1.5px solid #6fa8e0;
    color: #eaf2ff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 999px;
    z-index: 8;
    white-space: nowrap;
  }

  .city-edge-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }
  #endTurnBtn:active { background: #275c41; }

  .city-name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 7;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8), 0 0 4px rgba(0,0,0,0.6);
    background: rgba(20, 20, 20, 0.55);
    padding: 3px 8px;
    border-radius: 8px;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.12s ease;
    touch-action: manipulation;
  }
  .city-name.pressed {
    transform: translate(-50%, -50%) translateY(5px);
  }

  #cityMenuOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 30;
    align-items: center;
    justify-content: center;
  }
  #cityMenuOverlay.visible { display: flex; }
  #cityMenuPanel {
    background: #14161c;
    border: 1px solid #3a3d44;
    border-radius: 14px;
    width: min(480px, 96vw);
    max-height: min(560px, 85vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #cityMenuHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #2c3038;
    flex-shrink: 0;
  }
  #cityMenuHeader h3 {
    margin: 0;
    font-size: 15px;
    color: #eee;
  }
  #cityMenuCloseBtn {
    background: #2f3540;
    border: 1px solid #454b56;
    color: #eee;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    touch-action: manipulation;
  }
  #cityMenuCloseBtn:active { background: #3a4049; }

  #cityMenuStats {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 14px;
    border-bottom: 1px solid #2c3038;
    flex-shrink: 0;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #1c1f26;
    border: 1px solid #2c3038;
    border-radius: 999px;
    padding: 3px 8px 3px 3px;
    flex-shrink: 0;
  }
  .stat-pill-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: #0c141f;
  }
  .stat-pill-icon img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .stat-pill-value {
    color: #eee;
    font-size: 12px;
    font-weight: 600;
  }

  #cityMenuAccordion {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .menu-section-header {
    width: 100%;
    background: #2a5a96;
    border: none;
    color: #eaf1fb;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    touch-action: manipulation;
  }
  .menu-section-header:active { background: #244d80; }
  .menu-section-header .chevron {
    transition: transform 0.15s ease;
    font-size: 11px;
  }
  .menu-section.expanded .menu-section-header .chevron {
    transform: rotate(180deg);
  }

  .menu-section-items {
    display: none;
    flex-direction: column;
    gap: 2px;
    margin-top: 6px;
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
  }
  .menu-section.expanded .menu-section-items { display: flex; }

  .menu-row {
    background: #1c1f26;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
  }
  .menu-row-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #3a3f4a;
    flex-shrink: 0;
  }
  .menu-row-text {
    flex: 1;
    min-width: 0;
  }
  .menu-row-title {
    color: #eee;
    font-size: 13px;
    font-weight: 600;
  }
  .menu-row-sub {
    color: #8a8f98;
    font-size: 11px;
    margin-top: 2px;
  }
  .menu-row-accessory {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #2f3540;
    border: 1px solid #454b56;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="board"></div>

  </div>
</div>

<div id="info">Tap your character, then tap a circle to move · pinch to zoom</div>

<div id="turnbar">
  <span id="turnLabel">Turn 1</span>
  <button id="endTurnBtn">Next turn</button>
</div>

<button id="createCityBtn">Create new city</button>
<button id="fortifyBtn">Fortify</button>

<div id="cityMenuOverlay">
  <div id="cityMenuPanel">
    <div id="cityMenuHeader">
      <h3 id="cityMenuTitle">City</h3>
      <button id="cityMenuCloseBtn">Close</button>
    </div>
    <div id="cityMenuStats"></div>
    <div id="cityMenuAccordion"></div>
  </div>
</div>

<script>
  // ---- CONFIG ----
  // Change this single value later to make the grid bigger.
  const GRID_SIZE = 30;
  // How many rows of hexes on each side (top/bottom/left/right) are water
  // instead of land.
  const WATER_BORDER = 6;

  // ---- CITY NAMES ----
  // Add, remove, or edit names here — a random one from this list is
  // picked automatically every time a new city is founded.
  const CITY_NAMES = [
    'Rivermoor',
    'Stonehaven',
    'Oakford',
    'Ashgate',
    'Winterholt',
    'Brightmere',
    'Fallowreach',
    'Thornwick',
  ];

  // ---- TERRAIN ----
  // Instead of picking each tile's terrain independently (which just
  // looks like speckled noise), scatter a handful of random "biome seeds"
  // per terrain type across the land, each with its own random size —
  // every tile near a seed joins that biome's patch. Whatever isn't
  // claimed by a patch stays grass, keeping grass dominant overall.
  const BIOME_TERRAINS = ['hills', 'mountains', 'forest', 'jungle', 'desert'];
  const BIOME_SEEDS_PER_TERRAIN = [2, 3]; // random count in this range, per terrain
  const BIOME_RADIUS_RANGE = [1, 3]; // random patch radius (in hex steps), per seed

  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function generateBiomeSeeds() {
    const seeds = [];
    const landMin = WATER_BORDER;
    const landMax = GRID_SIZE - WATER_BORDER - 1;
    BIOME_TERRAINS.forEach(terrain => {
      const count = randInt(BIOME_SEEDS_PER_TERRAIN[0], BIOME_SEEDS_PER_TERRAIN[1]);
      for (let i = 0; i < count; i++) {
        seeds.push({
          terrain,
          x: randInt(landMin, landMax),
          y: randInt(landMin, landMax),
          radius: randInt(BIOME_RADIUS_RANGE[0], BIOME_RADIUS_RANGE[1]),
        });
      }
    });
    return seeds;
  }

  // A tile joins whichever biome patch it's closest to (and within range
  // of); if it's outside every patch, it's just grass.
  function pickTerrainForTile(x, y, seeds) {
    let best = null;
    let bestDist = Infinity;
    for (const seed of seeds) {
      const d = hexDistance(x, y, seed.x, seed.y);
      if (d <= seed.radius && d < bestDist) {
        bestDist = d;
        best = seed.terrain;
      }
    }
    return best || 'grass';
  }

  // ---- GRID DATA ----
  function makeEmptyGrid(size) {
    const biomeSeeds = generateBiomeSeeds();
    const grid = [];
    for (let y = 0; y < size; y++) {
      const row = [];
      for (let x = 0; x < size; x++) {
        const isWater = x < WATER_BORDER || y < WATER_BORDER
          || x >= size - WATER_BORDER || y >= size - WATER_BORDER;
        const terrain = isWater ? 'water' : pickTerrainForTile(x, y, biomeSeeds);
        const walkable = !isWater && terrain !== 'mountains';
        row.push({ walkable, isWater, terrain, color: null, label: '', cityMarked: false });
      }
      grid.push(row);
    }
    return grid;
  }

  let grid = makeEmptyGrid(GRID_SIZE);

  // ---- HEX GEOMETRY (flat-top hexagons, odd-q vertical offset) ----
  // Given a hex width in px, returns each hex's center position plus the
  // board's total pixel size at that width. Called fresh whenever the
  // zoom level (hex size) changes, the same way the old square grid just
  // set its cell size directly rather than scaling a fixed layout.
  function rawHexCenter(x, y, hexWidth) {
    const hexHeight = hexWidth * 0.8660254;
    const horizSpacing = hexWidth * 0.75;
    const vertSpacing = hexHeight;
    const cx = x * horizSpacing + hexWidth / 2;
    const cy = y * vertSpacing + (x % 2 === 1 ? vertSpacing / 2 : 0) + vertSpacing / 2;
    return { cx, cy };
  }

  function computeHexLayout(hexWidth) {
    const hexHeight = hexWidth * 0.8660254; // sqrt(3)/2 * width

    const positions = [];
    let minCx = Infinity, minCy = Infinity, maxCx = -Infinity, maxCy = -Infinity;
    for (let y = 0; y < GRID_SIZE; y++) {
      const row = [];
      for (let x = 0; x < GRID_SIZE; x++) {
        const c = rawHexCenter(x, y, hexWidth);
        row.push({ cx: c.cx, cy: c.cy });
        minCx = Math.min(minCx, c.cx - hexWidth / 2);
        minCy = Math.min(minCy, c.cy - hexHeight / 2);
        maxCx = Math.max(maxCx, c.cx + hexWidth / 2);
        maxCy = Math.max(maxCy, c.cy + hexHeight / 2);
      }
      positions.push(row);
    }
    // Normalize so the bounding box starts at (0,0)
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        positions[y][x].cx -= minCx;
        positions[y][x].cy -= minCy;
      }
    }
    return {
      positions,
      hexWidth,
      hexHeight,
      boardW: maxCx - minCx,
      boardH: maxCy - minCy,
      minCx,
      minCy,
    };
  }

  const BASE_HEX_SIZE = 100; // fixed internal hex width; zoom is done via CSS scale(), never by rebuilding the grid
  let hexLayout = computeHexLayout(BASE_HEX_SIZE);

  // Offset (odd-q) <-> cube coordinate conversion, used for hex distance
  // and range calculations (movement).
  function offsetToCube(col, row) {
    const x = col;
    const z = row - (col - (col & 1)) / 2;
    const y = -x - z;
    return { x, y, z };
  }
  function cubeToOffset(x, y, z) {
    const col = x;
    const row = z + (x - (x & 1)) / 2;
    return { col, row };
  }
  function hexDistance(x1, y1, x2, y2) {
    const a = offsetToCube(x1, y1), b = offsetToCube(x2, y2);
    return (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + Math.abs(a.z - b.z)) / 2;
  }

  // How many rings deep a water tile sits into the border (1 = right at
  // the coast next to land, WATER_BORDER = the outermost edge of the
  // grid) — used to shade shallow water near the coast lighter than the
  // open sea further out.
  function waterCoastDepth(x, y) {
    const distX = Math.min(x, GRID_SIZE - 1 - x);
    const distY = Math.min(y, GRID_SIZE - 1 - y);
    const distFromEdge = Math.min(distX, distY);
    return WATER_BORDER - distFromEdge;
  }

  // Blended shallow-to-deep water color, banded by coast distance with the
  // same sine-blend technique landColor() uses so tiles of the same band
  // still shift gradually into each other instead of looking flat/tiled.
  function waterColor(x, y, coastDistance) {
    const band = Math.min(coastDistance, 3);
    const bandHue = { 1: 178, 2: 190, 3: 198 }[band];
    const bandSat = { 1: 55, 2: 50, 3: 48 }[band];
    const bandLight = { 1: 62, 2: 50, 3: 40 }[band];
    const n = Math.sin(x * 0.9 + y * 0.5) * 0.5
            + Math.sin(x * 0.35 - y * 0.8) * 0.3
            + Math.sin((x + y) * 0.6) * 0.2;
    const t = (n + 1) / 2;
    return `hsl(${(bandHue + t * 8).toFixed(1)}, ${bandSat}%, ${(bandLight + t * 6).toFixed(0)}%)`;
  }

  // All walkable hexes within `range` steps of (x,y), INCLUDING the
  // center hex itself. Used for things like marking a city's footprint,
  // as opposed to getReachableCells() which is movement-specific and
  // excludes the character's own square.
  function hexesWithinRange(x, y, range) {
    const center = offsetToCube(x, y);
    const results = [];
    for (let dx = -range; dx <= range; dx++) {
      const dyMin = Math.max(-range, -dx - range);
      const dyMax = Math.min(range, -dx + range);
      for (let dy = dyMin; dy <= dyMax; dy++) {
        const dz = -dx - dy;
        const off = cubeToOffset(center.x + dx, center.y + dy, center.z + dz);
        const nx = off.col, ny = off.row;
        if (nx < 0 || ny < 0 || nx >= GRID_SIZE || ny >= GRID_SIZE) continue;
        if (!grid[ny][nx].walkable) continue;
        results.push({ x: nx, y: ny });
      }
    }
    return results;
  }

  // Neighbor offsets for flat-top hexagons in odd-q vertical layout,
  // each tagged with which of the hex's 6 edges it sits behind. Used to
  // figure out which edges of a marked hex are on the OUTSIDE of a
  // claimed region (so only the outer boundary gets a red line, not
  // every internal hex-to-hex edge too).
  const HEX_NEIGHBORS_EVEN_COL = [
    { dc: 0, dr: -1, edge: 'N' },
    { dc: 1, dr: -1, edge: 'NE' },
    { dc: 1, dr: 0, edge: 'SE' },
    { dc: 0, dr: 1, edge: 'S' },
    { dc: -1, dr: 0, edge: 'SW' },
    { dc: -1, dr: -1, edge: 'NW' },
  ];
  const HEX_NEIGHBORS_ODD_COL = [
    { dc: 0, dr: -1, edge: 'N' },
    { dc: 1, dr: 0, edge: 'NE' },
    { dc: 1, dr: 1, edge: 'SE' },
    { dc: 0, dr: 1, edge: 'S' },
    { dc: -1, dr: 1, edge: 'SW' },
    { dc: -1, dr: 0, edge: 'NW' },
  ];
  // Edge endpoints in the same 0-100 percentage space as the hex's
  // clip-path polygon, so they line up with the visible hex shape exactly.
  const HEX_EDGE_COORDS = {
    N: [25, 0, 75, 0],
    NE: [75, 0, 100, 50],
    SE: [100, 50, 75, 100],
    S: [75, 100, 25, 100],
    SW: [25, 100, 0, 50],
    NW: [0, 50, 25, 0],
  };

  function getExternalCityEdges(x, y) {
    const table = (x % 2 === 1) ? HEX_NEIGHBORS_ODD_COL : HEX_NEIGHBORS_EVEN_COL;
    const external = [];
    for (const dir of table) {
      const nx = x + dir.dc, ny = y + dir.dr;
      const neighborMarked = (nx >= 0 && ny >= 0 && nx < GRID_SIZE && ny < GRID_SIZE)
        ? grid[ny][nx].cityMarked
        : false;
      if (!neighborMarked) external.push(dir.edge);
    }
    return external;
  }

  function buildCityEdgeOverlay(externalEdges) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.classList.add('city-edge-overlay');
    externalEdges.forEach(edge => {
      const [x1, y1, x2, y2] = HEX_EDGE_COORDS[edge];
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#d81c1c');
      line.setAttribute('stroke-width', '6');
      line.setAttribute('stroke-linecap', 'round');
      svg.appendChild(line);
    });
    return svg;
  }

  // ---- CHARACTERS ----
  // Multiple named units, each with its own icon and position. Add
  // `canMoveOnWater: true` to a character once a water-capable unit
  // exists — it makes water tiles render crisp (unblurred) while that
  // unit is selected and choosing where to move.
  let characters = [
    { id: 'settler', name: 'Settler', icon: ICONS.pathfinder, x: 14, y: 14, hasMovedThisTurn: false, moveRange: 1, type: 'settler', categories: [] },
    { id: 'spearman', name: 'Ancient Spearman', icon: ICONS.spearmen, x: 15, y: 14, hasMovedThisTurn: false, moveRange: 2, type: 'spearman', categories: ['melee'], fortified: false, fortifyTurns: 0 },
  ];
  let selectedCharId = null; // id of the character currently "picked up"
  let turnNumber = 1;
  let nextUnitId = 1; // for units spawned later (e.g. produced by a city)

  // ---- CITIES ----
  let cities = []; // { id, name, x, y }
  let nextCityId = 1;
  let pressedCityId = null; // city whose name label is in the "pressed down" state


  // ---- ELEMENTS ----
  const viewportEl = document.getElementById('viewport');
  const boardEl = document.getElementById('board');

  // ---- ZOOM / PAN STATE ----
  // scale is expressed as "cell size in px". We compute min/max cell size
  // so that zoomed all the way out shows the whole grid, and zoomed all
  // the way in shows a 2x2 area.
  let cellSize = 0;
  let minCellSize = 0;
  let maxCellSize = 0;
  let panX = 0;
  let panY = 0;

  // `cellSize` is the desired on-screen hex width in px. The grid itself
  // is built once at BASE_HEX_SIZE and never resized — zoom is just a CSS
  // scale() of that fixed board, and pan is just a translate(). Neither
  // needs to touch the DOM, which is what keeps them fluid at 900+ tiles.
  function computeZoomBounds() {
    const vw = viewportEl.clientWidth;
    const vh = viewportEl.clientHeight;
    const shortSide = Math.min(vw, vh);
    // Zoomed out fully: shows a bit LESS than the whole land area (not
    // the whole grid, which includes the wide water border) — land is
    // GRID_SIZE minus the water border on both sides.
    const landSize = GRID_SIZE - WATER_BORDER * 2;
    minCellSize = shortSide / (landSize * 0.85);
    // Zoomed in fully: a slightly wider area than 2x2 fits, so it's not
    // quite as tight a zoom-in as before
    maxCellSize = shortSide / 3;
  }

  function clampPan() {
    // Keep the board within about one hex's distance of the viewport edges.
    // Important: with scale-based zoom, the pan value that actually
    // centers the board is NOT zero (it's boardSize/2 * (1 - scale)) — so
    // the allowed range has to be built around THAT value, not around 0,
    // or this clamp silently drags the board off-screen at low zoom.
    const scale = cellSize / BASE_HEX_SIZE;
    const renderedW = hexLayout.boardW * scale;
    const renderedH = hexLayout.boardH * scale;
    const margin = BASE_HEX_SIZE * scale; // one hex's worth of overscroll allowed
    const centerPanX = (hexLayout.boardW / 2) * (1 - scale);
    const centerPanY = (hexLayout.boardH / 2) * (1 - scale);
    const slackX = Math.max(margin, (renderedW - viewportEl.clientWidth) / 2 + margin);
    const slackY = Math.max(margin, (renderedH - viewportEl.clientHeight) / 2 + margin);
    panX = Math.max(centerPanX - slackX, Math.min(centerPanX + slackX, panX));
    panY = Math.max(centerPanY - slackY, Math.min(centerPanY + slackY, panY));
  }

  // ---- PERFORMANCE / QUALITY SETTINGS ----
  // Each flag turns one rendering cost on/off live, so the biggest source of
  // lag can be found by toggling them one at a time and watching the FPS.
  // Persisted so a chosen configuration survives a reload.
  const PERF = {
    // Water blur and the sea-tile dots were measured on-device as the two
    // biggest sources of lag (a full-board filtered layer + a radial gradient
    // painted on every one of ~576 sea tiles), so they default OFF. The
    // settings panel can switch them back on for the softer look.
    waterBlur: false,     // soft blur over the whole sea (a filtered layer)
    waterGradient: false, // the little highlight/shadow dots on each sea tile
    hexClip: true,        // the hexagon clip-path on every tile
    charShadow: true,     // drop-shadow glow on characters
    charTransition: true, // CSS transition when a character is selected/moves
    boardLayer: true,     // promote the board to its own GPU layer (translateZ)
    coalesce: true,       // batch pan/zoom writes to one per frame
    hex3d: true,          // raised 3D tiles with side walls (heavier to draw)
  };
  try {
    const saved = JSON.parse(localStorage.getItem('gridgame_perf') || '{}');
    Object.keys(PERF).forEach(k => { if (typeof saved[k] === 'boolean') PERF[k] = saved[k]; });
  } catch (e) {}

  function savePerf() {
    try { localStorage.setItem('gridgame_perf', JSON.stringify(PERF)); } catch (e) {}
  }

  // Reflect the CSS-driven flags as classes on <body>; the JS-driven ones
  // (waterBlur, boardLayer, coalesce) are read directly where they apply.
  function applyPerfClasses() {
    const b = document.body;
    b.classList.toggle('perf-no-watergrad', !PERF.waterGradient);
    b.classList.toggle('perf-no-hexclip', !PERF.hexClip);
    b.classList.toggle('perf-no-charshadow', !PERF.charShadow);
    b.classList.toggle('perf-no-chartransition', !PERF.charTransition);
  }

  function applyTransform() {
    const scale = cellSize / BASE_HEX_SIZE;
    // translateZ(0) forces the board onto its own compositor layer so the
    // browser can pan/zoom it on the GPU without repainting the tiles.
    const z = PERF.boardLayer ? ' translateZ(0)' : '';
    boardEl.style.transform = `translate(-50%, -50%) translate(${panX}px, ${panY}px) scale(${scale})${z}`;
  }

  // Touch devices fire pan/pinch events faster than the screen refreshes
  // (up to 120Hz on modern iPhones), so writing the transform on every event
  // does redundant work and causes jank. Coalesce them: the state (panX/panY,
  // cellSize) updates synchronously on each event, but the actual transform
  // write happens at most once per animation frame.
  let transformScheduled = false;
  function scheduleTransform() {
    if (!PERF.coalesce) { clampPan(); applyTransform(); return; }
    if (transformScheduled) return;
    transformScheduled = true;
    requestAnimationFrame(() => {
      transformScheduled = false;
      clampPan();
      applyTransform();
    });
  }

  function centerOnPlayer() {
    // Reset pan so the average position of all characters is centered
    const scale = cellSize / BASE_HEX_SIZE;
    const avgCx = characters.reduce((sum, c) => sum + hexLayout.positions[c.y][c.x].cx, 0) / characters.length;
    const avgCy = characters.reduce((sum, c) => sum + hexLayout.positions[c.y][c.x].cy, 0) / characters.length;
    panX = hexLayout.boardW / 2 - scale * avgCx;
    panY = hexLayout.boardH / 2 - scale * avgCy;
    clampPan();
  }

  // ---- REACHABLE CELLS ----
  // Hex range: every hex up to `character.moveRange` steps away (proper
  // hex distance, not square/diagonal distance). Characters can pass
  // through and land on the same hex as one another.
  function getReachableCells(character) {
    // A fortified unit stays movable even after its move is "used" by
    // staying put — moving is the only way to wake it (clears fortify).
    if (!character || (character.hasMovedThisTurn && !character.fortified)) return [];
    const range = character.moveRange || 1;
    const center = offsetToCube(character.x, character.y);
    const options = [];
    for (let dx = -range; dx <= range; dx++) {
      const dyMin = Math.max(-range, -dx - range);
      const dyMax = Math.min(range, -dx + range);
      for (let dy = dyMin; dy <= dyMax; dy++) {
        const dz = -dx - dy;
        if (dx === 0 && dy === 0 && dz === 0) continue;
        const off = cubeToOffset(center.x + dx, center.y + dy, center.z + dz);
        const nx = off.col, ny = off.row;
        if (nx < 0 || ny < 0 || nx >= GRID_SIZE || ny >= GRID_SIZE) continue;
        if (!grid[ny][nx].walkable) continue;
        options.push({ x: nx, y: ny });
      }
    }
    return options;
  }

  // Smoothly-blended terrain color per hex: layered sine waves so
  // neighboring hexes shift gradually into each other rather than looking
  // randomly speckled, evoking natural terrain instead of a flat fill.
  // Same blending technique for every terrain, just a different palette.
  const TERRAIN_PALETTES = {
    grass: { hue: [96, 30], sat: [45, 15], light: [28, 16] },
    hills: { hue: [55, 20], sat: [40, 15], light: [32, 14] },
    forest: { hue: [115, 15], sat: [55, 15], light: [16, 12] },
    jungle: { hue: [125, 15], sat: [65, 15], light: [14, 10] },
    desert: { hue: [40, 10], sat: [55, 15], light: [55, 13] },
    mountains: { hue: [212, 10], sat: [8, 10], light: [45, 15] },
  };
  function landColor(x, y, terrain) {
    const palette = TERRAIN_PALETTES[terrain] || TERRAIN_PALETTES.grass;
    const n = Math.sin(x * 0.9 + y * 0.5) * 0.5
            + Math.sin(x * 0.35 - y * 0.8) * 0.3
            + Math.sin((x + y) * 0.6) * 0.2;
    const t = (n + 1) / 2; // normalize roughly to 0..1
    const hue = palette.hue[0] + t * palette.hue[1];
    const sat = palette.sat[0] + t * palette.sat[1];
    const light = palette.light[0] + t * palette.light[1];
    return `hsl(${hue.toFixed(1)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
  }

  // ---- RENDER ----
  // The board is drawn in two layers. The STATIC layer (water + every land
  // hex background and its coordinate label) is the expensive part — ~900
  // clip-path tiles — so it is built exactly once by buildStaticBoard() and
  // never torn down again. The DYNAMIC layer (characters, move-dots, city
  // border overlays, city names) is the only thing render() rebuilds, which
  // is a handful of nodes instead of the whole grid on every game action.
  let staticBoardBuilt = false;
  let waterLayerEl = null;
  let dynamicLayerEl = null;

  // While the player is actively panning/pinching, the whole-board water
  // blur is the single most expensive thing to keep re-rasterizing (a big
  // filtered layer that can't stay GPU-composited). So we drop it during a
  // gesture and restore it a moment after the gesture (and any inertia)
  // ends — the sea looks identical at rest, but scrolls/zooms smoothly.
  let interacting = false;
  let interactEndTimer = null;

  function applyWaterBlur() {
    if (!waterLayerEl) return;
    if (!PERF.waterBlur) { waterLayerEl.style.filter = 'none'; return; }
    if (interacting) { waterLayerEl.style.filter = 'none'; return; }
    // Water is only crisp for a unit that can actually move on it; none can
    // yet, so at rest the sea is blurred to soften the hex grid lines.
    const sel = characters.find(c => c.id === selectedCharId) || null;
    const crisp = !!(sel && sel.canMoveOnWater);
    waterLayerEl.style.filter = crisp ? 'none' : `blur(${hexLayout.hexWidth * 0.07}px)`;
  }

  function beginInteract() {
    if (interactEndTimer) { clearTimeout(interactEndTimer); interactEndTimer = null; }
    if (!interacting) { interacting = true; applyWaterBlur(); }
  }

  function endInteractSoon() {
    if (interactEndTimer) clearTimeout(interactEndTimer);
    interactEndTimer = setTimeout(() => {
      interactEndTimer = null;
      interacting = false;
      applyWaterBlur();
    }, 180);
  }

  function tileMetrics() {
    // A tiny overlap on every hex tile so adjacent hexes' edges overlap by
    // a fraction of a pixel instead of leaving hairline gaps (which show
    // the page background through as black slivers) between them.
    const overlap = hexLayout.hexWidth * 0.02;
    return { w: hexLayout.hexWidth + overlap, h: hexLayout.hexHeight + overlap };
  }

  // Darken an hsl() color by scaling its lightness — used for 3D side walls.
  function darkenColor(col, factor) {
    const m = /hsl\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)/i.exec(col);
    if (!m) return col;
    const l = Math.max(0, parseFloat(m[3]) * factor);
    return `hsl(${m[1]}, ${m[2]}%, ${l.toFixed(0)}%)`;
  }

  function buildStaticBoard() {
    boardEl.innerHTML = '';
    const { w: tileW, h: tileH } = tileMetrics();

    // Water tiles' edges are blurred so the hex grid lines dissolve into a
    // smoother sea. The blur is applied ONCE to a single container holding
    // every water tile — applying `filter: blur()` to each water tile
    // individually (hundreds of them) forces a separate compositing layer
    // per tile, expensive enough to make a phone browser choke. render()
    // only toggles this container's blur; it never rebuilds it.
    waterLayerEl = document.createElement('div');
    waterLayerEl.className = 'water-layer';
    waterLayerEl.style.position = 'absolute';
    waterLayerEl.style.left = '0';
    waterLayerEl.style.top = '0';
    waterLayerEl.style.width = hexLayout.boardW + 'px';
    waterLayerEl.style.height = hexLayout.boardH + 'px';
    boardEl.appendChild(waterLayerEl);

    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const cellData = grid[y][x];
        const pos = hexLayout.positions[y][x];

        if (cellData.isWater) {
          const cell = document.createElement('div');
          cell.className = 'cell cell-water';
          cell.style.width = tileW + 'px';
          cell.style.height = tileH + 'px';
          cell.style.left = (pos.cx - tileW / 2) + 'px';
          cell.style.top = (pos.cy - tileH / 2) + 'px';
          cell.style.backgroundColor = cellData.color || waterColor(x, y, waterCoastDepth(x, y));
          waterLayerEl.appendChild(cell);
          continue;
        }

        const baseColor = cellData.color || landColor(x, y, cellData.terrain);

        // Real 3D: a darker copy of the hex, shifted down, sits BEHIND the
        // top face so only its lower rim shows — the tile's "side wall",
        // making land read as a raised block above the flat sea. Drawn first
        // (and rows go top→bottom) so nearer tiles occlude the walls behind.
        if (PERF.hex3d) {
          const depth = tileH * 0.16;
          const wall = document.createElement('div');
          wall.className = 'cell cell-wall';
          wall.style.width = tileW + 'px';
          wall.style.height = tileH + 'px';
          wall.style.left = (pos.cx - tileW / 2) + 'px';
          wall.style.top = (pos.cy - tileH / 2 + depth) + 'px';
          wall.style.background = darkenColor(baseColor, 0.6);
          boardEl.appendChild(wall);
        }

        const cell = document.createElement('div');
        cell.className = 'cell walkable-' + cellData.walkable;
        cell.dataset.x = x;
        cell.dataset.y = y;
        cell.style.width = tileW + 'px';
        cell.style.height = tileH + 'px';
        cell.style.left = (pos.cx - tileW / 2) + 'px';
        cell.style.top = (pos.cy - tileH / 2) + 'px';
        cell.style.background = baseColor;

        if (cellData.label) {
          const label = document.createElement('div');
          label.className = 'cell-label';
          label.textContent = cellData.label;
          cell.appendChild(label);
        }

        boardEl.appendChild(cell);
      }
    }

    // The dynamic overlay sits above the tiles but is click-through
    // (pointer-events:none), so taps still hit the .cell beneath and resolve
    // to that hex's coordinates; interactive bits inside (city names)
    // re-enable pointer events on themselves.
    dynamicLayerEl = document.createElement('div');
    dynamicLayerEl.className = 'dynamic-layer';
    dynamicLayerEl.style.position = 'absolute';
    dynamicLayerEl.style.left = '0';
    dynamicLayerEl.style.top = '0';
    dynamicLayerEl.style.width = hexLayout.boardW + 'px';
    dynamicLayerEl.style.height = hexLayout.boardH + 'px';
    dynamicLayerEl.style.pointerEvents = 'none';
    boardEl.appendChild(dynamicLayerEl);

    staticBoardBuilt = true;
  }

  function render() {
    if (!staticBoardBuilt) buildStaticBoard();
    dynamicLayerEl.innerHTML = '';

    const selectedChar = characters.find(c => c.id === selectedCharId) || null;
    const reachable = getReachableCells(selectedChar);
    const { w: tileW, h: tileH } = tileMetrics();

    // Whichever character is selected (if any) determines whether water
    // tiles should render crisp instead of blurred. Only matters for a
    // character that can actually move on water; nothing can yet, so this
    // stays inactive until one exists. Toggling the persistent water layer's
    // blur is cheap — no rebuild.
    applyWaterBlur();

    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const cellData = grid[y][x];
        if (cellData.isWater) continue;

        const charsHere = characters.filter(c => c.x === x && c.y === y);
        const isReachable = reachable.some(c => c.x === x && c.y === y);
        const cityEdges = cellData.cityMarked ? getExternalCityEdges(x, y) : [];
        if (charsHere.length === 0 && !isReachable && cityEdges.length === 0) continue;

        const pos = hexLayout.positions[y][x];
        const slot = document.createElement('div');
        slot.className = 'hex-slot';
        slot.style.position = 'absolute';
        slot.style.width = tileW + 'px';
        slot.style.height = tileH + 'px';
        slot.style.left = (pos.cx - tileW / 2) + 'px';
        slot.style.top = (pos.cy - tileH / 2) + 'px';
        slot.style.display = 'flex';
        slot.style.alignItems = 'center';
        slot.style.justifyContent = 'center';

        if (cityEdges.length > 0) {
          slot.appendChild(buildCityEdgeOverlay(cityEdges));
        }

        if (charsHere.length > 0) {
          const stack = document.createElement('div');
          stack.className = 'char-stack';
          charsHere.forEach(ch => {
            const charEl = document.createElement('div');
            charEl.className = 'char';
            if (charsHere.length > 1) charEl.classList.add('char-stacked');
            if (ch.id === selectedCharId) charEl.classList.add('char-selected');
            // While a character is selected, every other character is
            // locked (not clickable/selectable) until it deselects.
            if (selectedCharId && ch.id !== selectedCharId) {
              charEl.classList.add('char-locked');
            }

            const body = document.createElement('div');
            body.className = 'char-body';
            const iconImg = document.createElement('img');
            iconImg.src = ch.icon;
            iconImg.alt = ch.name;
            body.appendChild(iconImg);

            charEl.appendChild(body);

            if (ch.fortified) {
              const badge = document.createElement('div');
              badge.className = 'fortify-badge';
              badge.textContent = '🛡+' + getFortifyBonusPercent(ch) + '%';
              charEl.appendChild(badge);
            }

            stack.appendChild(charEl);
          });
          slot.appendChild(stack);
        }

        // Show the move-dot for any reachable square, even one already
        // occupied by another character — it overlays on top so you can
        // still see it's a valid destination and stack characters there.
        if (isReachable) {
          const dot = document.createElement('div');
          dot.className = 'move-dot';
          if (charsHere.length > 0) dot.classList.add('move-dot-overlay');
          slot.appendChild(dot);
        }

        dynamicLayerEl.appendChild(slot);
      }
    }

    // City name labels are rendered directly on the overlay (not inside a
    // hex cell) so they aren't clipped by the hexagon shape/overflow — they
    // sit on top of the grid, free to extend past the hex edges. They opt
    // back into pointer events since the overlay itself is click-through.
    cities.forEach(city => {
      const pos = hexLayout.positions[city.y][city.x];
      const nameEl = document.createElement('div');
      nameEl.className = 'city-name' + (pressedCityId === city.id ? ' pressed' : '');
      nameEl.textContent = `${city.name} (${city.population})`;
      nameEl.style.left = pos.cx + 'px';
      nameEl.style.top = pos.cy + 'px';
      nameEl.style.pointerEvents = 'auto';
      nameEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (pressedCityId === city.id) {
          openCityMenu(city);
          pressedCityId = null;
        } else {
          pressedCityId = city.id;
        }
        render();
      });
      dynamicLayerEl.appendChild(nameEl);
    });

    applyTransform();
    updateCreateCityUI();
    updateFortifyUI();
  }

  // ---- TAP HANDLING (select character / move) ----
  boardEl.addEventListener('click', (e) => {
    if (tapWasDrag) { tapWasDrag = false; return; }
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const x = parseInt(cell.dataset.x, 10);
    const y = parseInt(cell.dataset.y, 10);

    const selectedChar = characters.find(c => c.id === selectedCharId);

    // A character is currently selected: only the selected character's own
    // square (to deselect) or a reachable destination square respond to
    // taps. Every other character is locked out until deselection.
    if (selectedChar) {
      const isSelectedCharSquare = (x === selectedChar.x && y === selectedChar.y);
      const reachable = getReachableCells(selectedChar);
      const isReachable = reachable.some(c => c.x === x && c.y === y);

      if (isReachable) {
        selectedChar.x = x;
        selectedChar.y = y;
        selectedChar.hasMovedThisTurn = true;
        if (selectedChar.fortified) {
          selectedChar.fortified = false;
          selectedChar.fortifyTurns = 0;
        }
        selectedCharId = null;
        render();
        updateTurnUI();
        return;
      }

      if (isSelectedCharSquare) {
        selectedCharId = null;
        render();
        return;
      }

      // Tapped a locked character or empty unreachable square: ignore.
      return;
    }

    // Nothing selected yet: tapping a square with character(s) selects one.
    const tappedChars = characters.filter(c => c.x === x && c.y === y);
    if (tappedChars.length > 0) {
      selectedCharId = tappedChars[0].id;
      render();
    }
  });


  // ---- ZOOM CONTROLS (buttons) ----
  function setZoom(newCellSize, anchorClientX, anchorClientY) {
    newCellSize = Math.max(minCellSize, Math.min(maxCellSize, newCellSize));
    if (anchorClientX === undefined) {
      // Anchor to viewport center by default
      const rect = viewportEl.getBoundingClientRect();
      anchorClientX = rect.left + rect.width / 2;
      anchorClientY = rect.top + rect.height / 2;
    }
    const rect = viewportEl.getBoundingClientRect();
    const vx = anchorClientX - rect.left - rect.width / 2;
    const vy = anchorClientY - rect.top - rect.height / 2;

    // Point in fixed board-local space currently under the anchor
    const oldScale = cellSize / BASE_HEX_SIZE;
    const boardX = (vx - panX + hexLayout.boardW / 2) / oldScale;
    const boardY = (vy - panY + hexLayout.boardH / 2) / oldScale;

    cellSize = newCellSize;
    const newScale = cellSize / BASE_HEX_SIZE;
    panX = vx - newScale * boardX + hexLayout.boardW / 2;
    panY = vy - newScale * boardY + hexLayout.boardH / 2;
    clampPan();
    scheduleTransform();
  }

  // ---- PAN + PINCH ZOOM (touch) ----
  let touches = {};
  let lastPanPoint = null;
  let lastPinchDist = null;
  let dragMoved = false;
  let tapWasDrag = false;
  let touchStartTime = 0;
  let touchStartPos = null;

  // Momentum: track recent pointer velocity while dragging, then glide
  // with friction after release instead of stopping dead. Makes panning
  // feel like a toss rather than a rigid 1:1 drag.
  let velX = 0, velY = 0;
  let lastMoveTime = 0;
  let inertiaFrame = null;

  function stopInertia() {
    if (inertiaFrame !== null) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  }

  function trackVelocity(dx, dy) {
    const now = performance.now();
    const dt = Math.max(1, now - lastMoveTime);
    // Blend with the previous sample so one jumpy event doesn't fling it
    velX = velX * 0.7 + (dx / dt) * 0.3;
    velY = velY * 0.7 + (dy / dt) * 0.3;
    lastMoveTime = now;
  }

  function startInertia() {
    const FRICTION = 0.94;
    const MIN_SPEED = 0.02; // px/ms
    function step() {
      panX += velX * 16;
      panY += velY * 16;
      velX *= FRICTION;
      velY *= FRICTION;
      clampPan();
      applyTransform();
      if (Math.abs(velX) < MIN_SPEED && Math.abs(velY) < MIN_SPEED) {
        inertiaFrame = null;
        endInteractSoon();
        return;
      }
      inertiaFrame = requestAnimationFrame(step);
    }
    stopInertia();
    beginInteract();
    inertiaFrame = requestAnimationFrame(step);
  }

  function dist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function midpoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  viewportEl.addEventListener('touchstart', (e) => {
    dragMoved = false;
    stopInertia();
    beginInteract();
    velX = 0; velY = 0;
    if (e.touches.length === 1) {
      lastPanPoint = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      touchStartPos = lastPanPoint;
      touchStartTime = Date.now();
      lastMoveTime = performance.now();
      lastPinchDist = null;
    } else if (e.touches.length === 2) {
      lastPinchDist = dist(e.touches[0], e.touches[1]);
      lastPanPoint = null;
    }
  }, { passive: true });

  viewportEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && lastPanPoint) {
      const dx = e.touches[0].clientX - lastPanPoint.x;
      const dy = e.touches[0].clientY - lastPanPoint.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
      panX += dx;
      panY += dy;
      trackVelocity(dx, dy);
      lastPanPoint = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      scheduleTransform();
    } else if (e.touches.length === 2) {
      dragMoved = true;
      const d = dist(e.touches[0], e.touches[1]);
      const mid = midpoint(e.touches[0], e.touches[1]);
      if (lastPinchDist) {
        const rawRatio = d / lastPinchDist;
        // Amplify the response a bit — the zoom range is much wider now
        // (30x30 grid), so a 1:1 ratio alone feels sluggish to traverse.
        const scaleFactor = Math.pow(rawRatio, 1.6);
        setZoom(cellSize * scaleFactor, mid.x, mid.y);
      }
      lastPinchDist = d;
    }
  }, { passive: true });

  viewportEl.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      tapWasDrag = dragMoved;
      lastPanPoint = null;
      lastPinchDist = null;
      if (dragMoved && (Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02)) {
        startInertia();
      } else {
        endInteractSoon();
      }
    } else if (e.touches.length === 1) {
      lastPanPoint = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      lastPinchDist = null;
    }
  }, { passive: true });

  // ---- Mouse drag support (desktop) ----
  let mouseDown = false;
  let mouseMoved = false;
  let lastMouse = null;
  viewportEl.addEventListener('mousedown', (e) => {
    mouseDown = true;
    mouseMoved = false;
    lastMouse = { x: e.clientX, y: e.clientY };
    stopInertia();
    beginInteract();
    velX = 0; velY = 0;
    lastMoveTime = performance.now();
  });
  window.addEventListener('mousemove', (e) => {
    if (!mouseDown || !lastMouse) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) mouseMoved = true;
    panX += dx;
    panY += dy;
    trackVelocity(dx, dy);
    lastMouse = { x: e.clientX, y: e.clientY };
    scheduleTransform();
  });
  window.addEventListener('mouseup', () => {
    mouseDown = false;
    lastMouse = null;
    tapWasDrag = mouseMoved;
    if (mouseMoved && (Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02)) {
      startInertia();
    } else {
      endInteractSoon();
    }
  });

  viewportEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    stopInertia();
    beginInteract();
    const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
    setZoom(cellSize * factor, e.clientX, e.clientY);
    endInteractSoon();
  }, { passive: false });

  // ---- TURN SYSTEM ----
  const turnLabelEl = document.getElementById('turnLabel');
  const endTurnBtn = document.getElementById('endTurnBtn');
  const createCityBtn = document.getElementById('createCityBtn');
  const fortifyBtn = document.getElementById('fortifyBtn');

  function updateTurnUI() {
    turnLabelEl.textContent = 'Turn ' + turnNumber;
    const anyMoved = characters.some(c => c.hasMovedThisTurn);
    endTurnBtn.classList.toggle('visible', anyMoved);
  }

  // Shows "Create new city" only while a Settler is selected and hasn't
  // used its move this turn yet.
  function updateCreateCityUI() {
    const selected = characters.find(c => c.id === selectedCharId);
    const show = !!selected && selected.type === 'settler' && !selected.hasMovedThisTurn;
    createCityBtn.classList.toggle('visible', show);
  }

  // ---- FORTIFICATION ----
  // Any unit in the 'melee' category can fortify: it skips its turn and
  // gains a growing defense bonus for every consecutive turn it stays put
  // — 5%, then 12%, then 25%, then caps at 40% — which lasts until the
  // unit actually moves.
  const FORTIFY_BONUS_STEPS = [5, 12, 25, 40];
  function isMeleeUnit(character) {
    return !!(character && character.categories && character.categories.includes('melee'));
  }
  function getFortifyBonusPercent(character) {
    if (!character || !character.fortified || !character.fortifyTurns) return 0;
    const idx = Math.min(character.fortifyTurns, FORTIFY_BONUS_STEPS.length) - 1;
    return FORTIFY_BONUS_STEPS[Math.max(0, idx)];
  }

  // Shows "Fortify" only for a selected melee unit that isn't already
  // fortified and hasn't used its move this turn yet.
  function updateFortifyUI() {
    const selected = characters.find(c => c.id === selectedCharId);
    const show = !!selected && isMeleeUnit(selected) && !selected.fortified && !selected.hasMovedThisTurn;
    fortifyBtn.classList.toggle('visible', show);
  }

  function pickCityName() {
    const used = cities.map(c => c.name);
    const available = CITY_NAMES.filter(n => !used.includes(n));
    const pool = available.length > 0 ? available : CITY_NAMES;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ---- TILE YIELDS ----
  // What a worked tile produces, by terrain type.
  const TERRAIN_YIELDS = {
    grass: { food: 2, production: 1 },
    hills: { food: 1, production: 2 },
    forest: { food: 1, production: 2 },
    jungle: { food: 1, production: 1 },
    desert: { food: 0, production: 1 },
    mountains: { food: 0, production: 0 },
    water: { food: 0, production: 0 },
  };
  function getTileYield(x, y) {
    const cell = grid[y] && grid[y][x];
    if (!cell || !cell.walkable) return { food: 0, production: 0 };
    return TERRAIN_YIELDS[cell.terrain] || { food: 0, production: 0 };
  }

  // A city works its center tile (always) plus one tile per population,
  // automatically prioritizing whichever owned tiles produce the most
  // food (no buildings yet to influence the choice).
  function getWorkedTiles(city) {
    const center = { x: city.x, y: city.y };
    const others = city.tiles.filter(t => !(t.x === center.x && t.y === center.y));
    const sorted = others.slice().sort((a, b) => getTileYield(b.x, b.y).food - getTileYield(a.x, a.y).food);
    return [center, ...sorted.slice(0, city.population)];
  }

  function computeCityYields(city) {
    const worked = getWorkedTiles(city);
    return worked.reduce((totals, t) => {
      const y = getTileYield(t.x, t.y);
      totals.food += y.food;
      totals.production += y.production;
      return totals;
    }, { food: 0, production: 0 });
  }

  // ---- CITY GROWTH ----
  // Food needed to grow FROM population N TO N+1. Starts at a base cost
  // for level 1->2, then compounds +40% per level — once a city is past
  // population 10, each further level instead compounds +50%. No cap:
  // this works for any population level, however high.
  const FOOD_GROWTH_BASE = 10; // threshold for 1 -> 2
  const FOOD_GROWTH_RATE_EARLY = 1.4; // +40% per level, for levels below 10
  const FOOD_GROWTH_RATE_LATE = 1.5; // +50% per level, from level 10 onward
  function getGrowthThreshold(population) {
    if (population < 1) return undefined;
    let threshold = FOOD_GROWTH_BASE;
    for (let level = 1; level < population; level++) {
      threshold *= (level < 10) ? FOOD_GROWTH_RATE_EARLY : FOOD_GROWTH_RATE_LATE;
    }
    return Math.round(threshold);
  }

  // Each population eats 2 food/turn, subtracted from that turn's yield
  // before the surplus (or deficit) is added to the city's food stockpile.
  const FOOD_UPKEEP_PER_POP = 2;

  function processCityGrowth(city) {
    const yields = computeCityYields(city);
    const consumption = FOOD_UPKEEP_PER_POP * city.population;
    city.foodStored += yields.food - consumption;
    if (city.foodStored < 0) city.foodStored = 0;

    let threshold = getGrowthThreshold(city.population);
    while (threshold !== undefined && city.foodStored >= threshold) {
      city.population += 1;
      city.foodStored = 0; // resets when the city grows
      threshold = getGrowthThreshold(city.population);
    }
  }

  // ---- CITY BORDER GROWTH ----
  // Anything that can earn a city a new border tile. Each condition just
  // needs a unique id and a creditsEarned(city) function returning how
  // many border-growth "credits" that condition has produced so far given
  // the city's CURRENT state (not a delta) — the difference from last
  // turn's count is how many tiles get claimed. This makes it easy to add
  // more triggers later (e.g. a culture-based one) alongside population.
  const BORDER_GROWTH_CONDITIONS = [
    {
      id: 'population',
      // One border tile per population level above the starting 1.
      creditsEarned(city) {
        return Math.max(0, city.population - 1);
      },
    },
  ];

  // All tiles adjacent to the city's current territory that aren't
  // already claimed by any city and are actual land (not water/mountain).
  function getBorderCandidates(city) {
    const claimedSet = new Set(city.tiles.map(t => `${t.x},${t.y}`));
    const candidates = new Map();
    city.tiles.forEach(t => {
      const table = (t.x % 2 === 1) ? HEX_NEIGHBORS_ODD_COL : HEX_NEIGHBORS_EVEN_COL;
      table.forEach(dir => {
        const nx = t.x + dir.dc, ny = t.y + dir.dr;
        if (nx < 0 || ny < 0 || nx >= GRID_SIZE || ny >= GRID_SIZE) return;
        const key = `${nx},${ny}`;
        if (claimedSet.has(key)) return;
        if (!grid[ny][nx].walkable) return; // can't claim water/mountains
        if (grid[ny][nx].cityMarked) return; // already someone else's
        candidates.set(key, { x: nx, y: ny });
      });
    });
    return Array.from(candidates.values());
  }

  // Picks the best candidate tile — highest food first, production as
  // the tiebreaker (the only real per-tile stats that exist right now).
  function pickBestBorderTile(candidates) {
    let best = null;
    let bestYield = null;
    for (const c of candidates) {
      const y = getTileYield(c.x, c.y);
      if (!best || y.food > bestYield.food || (y.food === bestYield.food && y.production > bestYield.production)) {
        best = c;
        bestYield = y;
      }
    }
    return best;
  }

  function growCityBorderByOne(city) {
    const candidates = getBorderCandidates(city);
    if (candidates.length === 0) return; // nowhere left to grow
    const best = pickBestBorderTile(candidates);
    if (!best) return;
    grid[best.y][best.x].cityMarked = true;
    city.tiles.push({ x: best.x, y: best.y });
  }

  function processCityBorderGrowth(city) {
    if (!city.borderGrowthProgress) city.borderGrowthProgress = {};
    BORDER_GROWTH_CONDITIONS.forEach(cond => {
      const earned = cond.creditsEarned(city);
      const used = city.borderGrowthProgress[cond.id] || 0;
      for (let i = 0; i < earned - used; i++) {
        growCityBorderByOne(city);
      }
      city.borderGrowthProgress[cond.id] = earned;
    });
  }

  // ---- CITY PRODUCTION ----
  // What a city can build. Edit this list to add more producible items —
  // `onComplete` runs once enough production has accumulated.
  // The full buildable roster. Each entry becomes a city-production option;
  // completing it spawns a movable unit on the city's tile. `cat` sets the
  // unit's categories (melee units can Fortify). Icons come from the cropped
  // style-guide sheet. Edit this one list to add/remove/retune units.
  const UNIT_ROSTER = [
    { key: 'settler',          title: 'Settler',         cost: 16, icon: ICONS.pathfinder,        type: 'settler', mr: 1, cat: [] },
    { key: 'worker',           title: 'Worker',          cost: 17, icon: ICONS.builder,           type: 'worker',  mr: 1, cat: [] },
    { key: 'spearman',         title: 'Spearman',        cost: 10, icon: ICONS.spearmen,          type: 'spearman', mr: 2, cat: ['melee'] },
    { key: 'bowmen',           title: 'Bowmen',          cost: 12, icon: ICONS.bowmen,            type: 'bowmen',  mr: 2, cat: ['ranged'] },
    { key: 'legionary',        title: 'Legionary',       cost: 14, icon: ICONS.legionary,         type: 'legionary', mr: 2, cat: ['melee'] },

    { key: 'war_elephant',     title: 'War Elephant',    cost: 26, icon: ICONS.war_elephant,      type: 'war_elephant', mr: 2, cat: ['melee'] },

    { key: 'pathfinder',       title: 'Pathfinder',      cost: 8,  icon: ICONS.pathfinder,        type: 'pathfinder', mr: 2, cat: [] },
    { key: 'spy',              title: 'Classical Spy',   cost: 12, icon: ICONS.spy,               type: 'spy',     mr: 2, cat: [] },
    { key: 'intelligencer',    title: 'Intelligencer',   cost: 14, icon: ICONS.intelligencer,     type: 'intelligencer', mr: 2, cat: [] },
    { key: 'healer',           title: 'Ancient Healer',  cost: 12, icon: ICONS.healer,            type: 'healer',  mr: 2, cat: ['support'] },
    { key: 'merchant_ship',    title: 'Merchant Ship',   cost: 14, icon: ICONS.merchant_ship,     type: 'merchant_ship', mr: 2, cat: ['naval'] },
    { key: 'trireme',          title: 'Trireme',         cost: 16, icon: ICONS.trireme,           type: 'trireme', mr: 2, cat: ['naval'] },
    { key: 'quinquereme',      title: 'Quinquereme',     cost: 22, icon: ICONS.quinquereme,       type: 'quinquereme', mr: 3, cat: ['naval'] },
    { key: 'war_galley',       title: 'Ancient War Galley', cost: 18, icon: ICONS.war_galley,     type: 'war_galley', mr: 2, cat: ['naval'] },
  ];

  function spawnUnit(city, def) {
    const unit = {
      id: def.key + (nextUnitId++),
      name: def.title,
      icon: def.icon,
      x: city.x,
      y: city.y,
      hasMovedThisTurn: false,
      moveRange: def.mr,
      type: def.type,
      categories: def.cat.slice(),
    };
    if (def.cat.includes('melee')) { unit.fortified = false; unit.fortifyTurns = 0; }
    characters.push(unit);
  }

  const PRODUCTION_ITEMS = UNIT_ROSTER.map(def => ({
    key: def.key,
    title: def.title,
    cost: def.cost,
    icon: def.icon,
    onComplete(city) { spawnUnit(city, def); },
  }));

  function processCityProduction(city) {
    if (!city.currentProduction) return;
    const item = PRODUCTION_ITEMS.find(i => i.key === city.currentProduction);
    if (!item) return;
    const yields = computeCityYields(city);
    city.productionProgress += yields.production;
    if (city.productionProgress >= item.cost) {
      item.onComplete(city);
      city.currentProduction = null;
      city.productionProgress = 0;
    }
  }

  createCityBtn.addEventListener('click', () => {
    const settler = characters.find(c => c.id === selectedCharId && c.type === 'settler');
    if (!settler) return;
    const claimed = hexesWithinRange(settler.x, settler.y, 1);
    claimed.forEach(({ x, y }) => { grid[y][x].cityMarked = true; });
    cities.push({
      id: 'city' + (nextCityId++),
      name: pickCityName(),
      x: settler.x,
      y: settler.y,
      tiles: claimed,
      population: 1,
      foodStored: 0,
      currentProduction: null,
      productionProgress: 0,
      borderGrowthProgress: {},
      stats: { gold: 0, science: 1, culture: 1, happiness: 1, faith: 0 },
    });
    characters = characters.filter(c => c.id !== settler.id);
    selectedCharId = null;
    render();
    updateTurnUI();
  });

  fortifyBtn.addEventListener('click', () => {
    const selected = characters.find(c => c.id === selectedCharId);
    if (!selected || !isMeleeUnit(selected) || selected.fortified || selected.hasMovedThisTurn) return;
    // Fortifying IS this turn's action — it skips the move, and the first
    // stage (+5%) applies immediately rather than waiting a full turn.
    selected.fortified = true;
    selected.fortifyTurns = 1;
    selected.hasMovedThisTurn = true;
    selectedCharId = null;
    render();
    updateTurnUI();
  });

  endTurnBtn.addEventListener('click', () => {
    turnNumber += 1;
    characters.forEach(c => {
      // Staying in a fortified position counts as this turn's move: a unit
      // that's still fortified begins the new turn having already used its
      // action (its only way out is to move, which clears fortify below).
      c.hasMovedThisTurn = !!c.fortified;
      // Any unit that's still fortified (didn't move — moving clears the
      // flag immediately, see the move handler above) advances one more
      // stage, capped at the last defined bonus step.
      if (c.fortified) {
        c.fortifyTurns = Math.min(FORTIFY_BONUS_STEPS.length, (c.fortifyTurns || 0) + 1);
      }
    });
    cities.forEach(city => {
      processCityGrowth(city);
      processCityProduction(city);
      processCityBorderGrowth(city);
    });
    selectedCharId = null;
    render();
    updateTurnUI();
    if (cityMenuOverlay.classList.contains('visible') && currentMenuCity) {
      renderCityMenuStats(currentMenuCity);
      renderCityMenuAccordion();
    }
  });

  const cityMenuTitle = document.getElementById('cityMenuTitle');
  const cityMenuCloseBtn = document.getElementById('cityMenuCloseBtn');
  const cityMenuStats = document.getElementById('cityMenuStats');
  const cityMenuAccordion = document.getElementById('cityMenuAccordion');
